# A curated paper = the container P, its whole local subgraph (CONCEPT §5).
# Filename stem `Ruppel2023NatPhys` IS the citekey: <Family><Year><Venue> (SCHEMA §3).
# Curated tier because this file exists. Lean slice model (SCHEMA v2): claims / questions /
# methods slices wired by leads-to (grounded_in / leads_to), corroborates|contradicts, answers.
# Everything else (evidence, open/answered, original/borrowed) is emergent (CONCEPT §13).
# This example is illustrative — the paper and its DOI are fictional.
title: "Force propagation in epithelial monolayers depends on substrate stiffness"
type: original                       # original | review | methods | perspective | commentary
year: 2023
pass: 3                              # curation depth tier (SCHEMA §4): fully curated through Pass 3
                                     #   (methods DAG + introducing papers). Absent → stub. Breadth
                                     #   tier (curated vs stub) stays emergent via file presence.
doi: 10.1038/s41567-023-01234
authors:
  - {name: "Ruppel, Artur",   position: first}
  - {name: "Doe, Jane"}              # unmarked → middle
  - {name: "Balland, Martial", position: last, corresponding: true}

# ── Methods: the *how* axis (CONCEPT §7). A measurement method grounding only in its source
# paper is a floor; claims rest on it via grounded_in. (No `evidence`/`uses`/`introduced_by`.)
methods:
  - id: m1
    text: "traction force microscopy"
    grounded_in: [Butler2002AmJPhysiol]   # the methods paper that introduced TFM → a floor
    leads_to:    [traction-force-microscopy]   # the method ladder: TFM is-a force microscopy

# ── Questions. open vs answered is emergent: a question is answered iff some claim answers it.
questions:
  - id: q1
    text: "Does the force-propagation length scale diverge near a rigidity threshold?"
    leads_to: [q-rigidity-sensing]         # open (nothing answers it); nests under a broader question
  - id: q2
    text: "What sets the baseline cortical tension of a cell?"
    # answered: c4 `answers` it (emergent — no `status`/`answered_by` field)

# ── Claims. original vs borrowed is emergent from grounded_in (a citation target → borrowed);
# grounded vs plausible from whether the leads-to chain reaches a floor. Quotes are verbatim.
claims:
  - id: c1
    text:  "Traction forces in epithelial monolayers rise with substrate stiffness."
    quote: "average traction stress increased monotonically as substrate modulus went from 5 to 50 kPa"
    grounded_in:  [m1]                     # measured via TFM (the floor) — the data/method braid (CONCEPT §7)
    leads_to:     [traction-scales-with-stiffness]   # generalizes into the broad claim (its support)
    corroborates: [Jones2018BiophysJ]      # lateral: supports Jones' single-cell result

  - id: c2
    text:  "A substantial fraction of intercellular force is borne by cell–cell junctions."
    quote: "~40% of total contractile force was balanced across junctions rather than the substrate"
    grounded_in: [m1]                      # a standalone novel finding — no prior work to position against
    leads_to:    [junctions-bear-load]

  - id: c3
    # The paper's own model claim (was evidence: novel-theory). Grounds in the measured trend
    # c1 (derivation: data → model), so its leads-to chain still reaches the m1 floor → grounded.
    text:  "Traction does not scale without bound — a poroelastic model predicts a plateau above a critical stiffness."
    quote: "our continuum model yields saturating traction for moduli beyond ~40 kPa"
    grounded_in: [c1]
    contradicts: [Smith2010PhysRevLett, traction-scales-with-stiffness]
    # Lateral clash with Smith's unbounded-scaling claim AND with the SAME broad claim c1
    # supports → the emergent evidence meter (CONCEPT §9): traction-scales-with-stiffness reads
    # 1 support (c1, via leads_to) / 1 contradict (c3).

  - id: c4
    # Borrowed (restated) context claim: grounds in a citation (a container), not a floor →
    # emergently borrowed (CONCEPT §6.1). No `evidence: none` / `ca*` prefix — both are gone.
    text:  "Keratin networks set baseline cortical tension."
    quote: "consistent with Ramms et al., keratin-rich cells showed elevated cortical tension"
    grounded_in: [Ramms2013Pnas]
    leads_to:    [cytoskeleton-sets-tension]
    answers:     [q2]                       # makes q2 emergently answered
