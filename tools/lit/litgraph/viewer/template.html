<div id="aimPanel" hidden></div>
<div id="libraryPane">
  <div id="libFacets"></div>
  <div id="libMain">
    <div id="libBar">
      <input id="libFilter" type="search" autocomplete="off" spellcheck="false"
             placeholder="filter the library — title, author, journal, tag…">
      <span class="lb-count" id="libCount"></span>
      <span class="lb-clear" id="libClear" hidden>clear filters</span>
    </div>
    <div id="libScroll"><div id="libSizer"><div id="libRows"></div></div></div>
  </div>
</div>
<div id="walkPane">
  <aside id="walkRail"></aside>
  <main id="walkStage"></main>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
// ── data: injected by `lit build` (replaces the mockup's hardcoded literals) ──
const GRAPH = /*__GRAPH_JSON__*/ {"papers":{},"broad":{},"stubs":{},"order":[],"active":[]} /*__END__*/;
const PAPERS = GRAPH.papers;
const BROAD = GRAPH.broad;
const STUBS = GRAPH.stubs;
const ORDER = GRAPH.order;
// The topic axis (SCHEMA §9) — a saved-search tree over the paper `tags` vocabulary, computed
// once in Python (build.py's _topics_json: closure + curated membership already reduced, so
// this viewer never re-walks `broader`). `|| {}` covers both an untopiced repo (to_json_dict
// still emits "topics": {}) and `lit preview`'s isolated payload, which carries no "topics" key
// at all (preview.isolate() reduces to one paper — see preview.py).
const TOPICS = GRAPH.topics || {};

// slug -> every curated paper that links into that broad node (generalize / stance / answer),
// independent of expansion state. Lets a broad-node hover reach papers still collapsed in the
// landing column, not just the expanded ones whose edges happen to already be drawn.
const BROAD_LINKS = {};
function buildBroadLinks(){
  for(const k in BROAD_LINKS) delete BROAD_LINKS[k];   // idempotent: a live refresh rebuilds it
  const push=(slug,key,via,kind)=>{ (BROAD_LINKS[slug]=BROAD_LINKS[slug]||[]).push({key,via,kind}); };
  for(const [key,p] of Object.entries(PAPERS)){
    if(!p.cur) continue;
    (p.cons||[]).forEach(c=>push(c.slug,key,c.via,"leads"));
    (p.lateral||[]).forEach(l=>{ if(l.slug) push(l.slug,key,l.via,l.sign); });
    (p.ans||[]).forEach(a=>{ if(a.slug) push(a.slug,key,a.via,"answers"); });
  }
}
buildBroadLinks();

const board=document.getElementById("board");    // the scroll port
const stage=document.getElementById("stage");    // what the columns live on, and what zooms
const svg=document.getElementById("edges");
// The board's zoom factor, read straight off the CSS variable that applies it — one source of
// truth, so nothing can drift from what the reader is actually looking at. See #stage's CSS.
function boardZoom(){
  const z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bz"));
  return z>0?z:1;
}
const tip=document.getElementById("tip");
let edges=[];            // {from:{cardId,sid},to:{cardId,sid},kind} — an endpoint anchors at the
                         // sid's row when drilling has made it visible, else at the card, so
                         // aggregate paper→paper edges sharpen to slice edges as the human drills
const cols={};           // level -> {el, keys:Set, label}
const open=new Set();    // "level:key" of focused cards — a set, so expansion is non-exclusive
const drill=new Map();   // "level:key" -> Set of expanded row paths ("c3", "c3/c1", …); AIM cards
                         // only — a paper's slices are a graph now, and a graph has no paths
const sFold=new Map();   // "level:key" -> Set of slice ids folded down to their badge. A paper's
                         // graph shows every slice at once, so folding is how the reader trades
                         // the text away for the topology, one node or all of them at a time.
const grpCollapsed=new Set();  // "level:key::<group label>" — entry sub-groups folded shut
const grpSeeded=new Set();     // aim cards whose default fold has been applied once. An aim opens
                               // on its ARGUMENT alone; the seeding must not re-fold what the
                               // reader has since unfolded, so it runs on first render only
                               // (and again after a close, which clears the id — a reopened card
                               // is a fresh read and should land back on the default view).
let ctxOpen=new Set();   // cards context-opened to reveal a sharpened target (recomputed)
let ctxDrill=new Map();  // row paths force-expanded to reveal a sharpened target (recomputed)
const stacks=new Set();  // source-stack ids the human explicitly unfolded (persists rebuilds)
let hover=null;          // {cardId,sid} — hovered slice row/broad node: redraw isolates its
                         // edges (bright) and highlights the counterpart papers, transiently
let pin=[];              // [{cardId,sid}] — clicked isolations that persist after the pointer
                         // leaves and ACCUMULATE: each click hardens another target. Bright set
                         // = every pinned target ∪ the current hover; everything else stays dim.
const SYNTH=1e6;         // synthesis band: the one column every broad node lives in
                         // (papers occupy small levels; builds-on growth stays left of it)
// A broad node's OWN leads_to (SCHEMA §4) can ladder it into a broader broad node, and the band is
// laid out as that nesting (see broadFamilies) rather than as columns of it.
// broadTier[slug] = the length of the longest chain of broad-to-broad leads_to edges ENDING at
// that slug, i.e. its altitude: 0 for a node only ever fed by papers (a plain head — nearest
// the papers), 1+max(tier of everything that ladders into it) otherwise. It no longer picks a
// column — it is what `broadKids` falls out of, and what orders a family's standing position.
// Recomputed once per rebuild() (cheap — tens of nodes), so a DRIVE window's hot-reloaded BROAD
// is picked up too.
let broadTier={};
let broadKids={};        // slug -> the broad nodes that ladder INTO it (one rung below), set by
                         // computeBroadTiers since it walks exactly that relation already
// The band is FLAT: every rung of every ladder has a card, always. It was not always — the band
// used to land on its ROOTS only, and a rung appeared when the human showed the node above it, on
// the theory that 42 nodes at once is a backlog and 14 is a view. Hiding was the wrong tool for
// that job. Once ORDER does the organizing, hiding only subtracts: you cannot see that a claim you
// have not clicked exists, cannot read the shape of the ladder without walking it, and a claim
// reachable through two parents flickers in and out depending on which one you have open.
//
// So `shownBroad` means one thing only: whose block is gathered at the top (and whose papers are in
// the column). Nothing about it decides what exists on screen. That still holds — the band is now
// CONTAINERIZED rather than flat (see broadFamilies), and containment reveals nothing and hides
// nothing; it only puts a family in one box instead of spraying it across four columns.
function computeBroadTiers(){
  const kids={};                                    // slug -> broad nodes that ladder INTO it
  for(const s in BROAD) kids[s]=[];
  for(const [s,b] of Object.entries(BROAD))
    for(const r of (b.leads_to||[])) if(kids[r]) kids[r].push(s);
  const tier={}, visiting=new Set();
  function tierOf(slug){
    if(slug in tier) return tier[slug];
    if(visiting.has(slug)) return 0;                // a cycle here means the build already
    visiting.add(slug);                             // rejected it; just don't hang on stale data
    let t=0;
    for(const c of kids[slug]) t=Math.max(t,tierOf(c)+1);
    visiting.delete(slug);
    return tier[slug]=t;
  }
  for(const slug in BROAD) tierOf(slug);
  broadKids=kids;
  return tier;
}
// ── the band as containers ───────────────────────────────────────────────────────────────
// The band used to be four COLUMNS keyed by altitude — `broadLevel` returned SYNTH+tier and each
// rung stood in the column its tier put it in. Altitude is a derived scalar; `leads_to` between two
// broad nodes is the relation actually authored, and rendering the scalar instead of the relation
// sprayed every family across the board: tier 0 alone held 34 of 45 cards, and the only thing
// tying a parent to its children was an arrow `redraw` deliberately suppresses until the node is
// hovered or clicked. At rest the ladder was not drawn at all.
//
// So a family is a CONTAINER, the same way a paper is a container of its slices (CONCEPT: the model
// is recursively containerized). Containment is drawn as containment — a box inside a box — which
// is why the rung arrows are gone rather than merely dimmed: geometry says what the arrow said, and
// says it without being hovered. One synthesis column now, one card per ladder root, everything
// under that root nested inside it.
//
// There is therefore no `broadLevel` any more: every broad card's id is `card-<SYNTH>:<slug>`
// whatever its altitude, so every id-building call site (expandCard, hoistEls, showBroad, the pin
// derivation) is unchanged — the card moved in the DOM, not in the addressing scheme.
const synthLabel=()=>"synthesis →";

// A node with two parents cannot nest under both without being duplicated, and duplication is
// precisely what `localDag` was written to stop doing to the paper card. So: a node NESTS under the
// first parent its authored `leads_to` names, and every other parent gets a REFERENCE row pointing
// at the real card. Authored order means the curator decides which parent hosts, with no magic to
// reverse-engineer. Three nodes today, one of which (vimentin-effect-is-context-dependent) is the
// only one whose parents sit under different roots.
let broadHost={};      // slug -> the parent that nests it ("" for a root)
let broadNest={};      // slug -> children nested inside it, in ladder order
let broadRefs={};      // slug -> children that live elsewhere and are only referenced here
let broadRoot={};      // slug -> the root of its hosting chain (its family)
let broadOrder=[];     // roots, in the standing order the band lays them out
function broadFamilies(){
  broadHost={}; broadNest={}; broadRefs={}; broadRoot={};
  for(const s in BROAD){ broadNest[s]=[]; broadRefs[s]=[]; }
  for(const s in BROAD){
    const par=(BROAD[s].leads_to||[]).filter(r=>BROAD[r]);
    broadHost[s]=par[0]||"";
    if(par[0]) broadNest[par[0]].push(s);
    for(const r of par.slice(1)) broadRefs[r].push(s);
  }
  // the root of the hosting chain; the guard is for a cycle the build should already have rejected
  const rootOf=(s,seen)=>{
    const h=broadHost[s];
    if(!h||seen.has(s)) return s;
    seen.add(s); return rootOf(h,seen);
  };
  for(const s in BROAD) broadRoot[s]=rootOf(s,new Set());
  // Standing order: families before leaves, biggest family first, then kind, then slug. Structure
  // ahead of orphans is the useful reading — and note this deliberately does NOT sort by kind
  // first. Separating the broad methods from the broad claims is still the open question of
  // 2026-08-03 §7; containers make it far less pressing (the two method ladders become their own
  // boxes and self-segregate) without deciding it here.
  const size=(s,seen)=>seen.has(s)?0:(seen.add(s),broadNest[s].reduce((n,c)=>n+size(c,seen),1));
  broadOrder=Object.keys(BROAD).filter(s=>!broadHost[s])
    .sort((a,b)=>size(b,new Set())-size(a,new Set())
                ||BROAD[a].kind.localeCompare(BROAD[b].kind)||a.localeCompare(b));
}
// Everything the band derives from BROAD, in one call — because there are two entry points that
// need it (boot, which never calls rebuild, and rebuild itself) and two of them computing half of
// it each is exactly how the band's altitudes and its nesting would drift out of step.
function broadRefresh(){
  broadTier=computeBroadTiers();
  broadFamilies();
  // A family lands folded to its rungs' titles: the band is the standing MAP of what the library
  // claims, and a map shows names. Seeded once, so a box the reader opened stays open across every
  // rebuild — the fold is a reading position, and a click elsewhere must not reset it.
  if(!famSeeded){ famSeeded=true; for(const r of broadOrder) famFolded.add(r); }
}

// curation maturity (SCHEMA §4) as a pie-filled circle: pass/4. Empty ring = stub (0),
// full disk = fully curated (4). Stubs have no `pass` → treated as 0.
function passCircle(pass){
  const p = Math.max(0, Math.min(4, pass || 0)), frac = p / 4, r = 7;
  const ring = `<circle cx="8" cy="8" r="${r}" fill="none" style="stroke:var(--faint);stroke-width:1.3"/>`;
  let wedge = "";
  if (frac >= 1) wedge = `<circle cx="8" cy="8" r="${r}" style="fill:var(--grounded)"/>`;
  else if (frac > 0) {
    const a = frac * 2 * Math.PI, ex = 8 + r * Math.sin(a), ey = 8 - r * Math.cos(a);
    wedge = `<path d="M8,8 L8,${8 - r} A${r},${r} 0 ${frac > 0.5 ? 1 : 0} 1 ${ex.toFixed(2)},${ey.toFixed(2)} Z" style="fill:var(--grounded)"/>`;
  }
  return `<span class="circle" title="curation maturity ${p}/4">`
       + `<svg width="16" height="16" viewBox="0 0 16 16">${ring}${wedge}</svg></span>`;
}
function authLine(a){return a.map(([n, pos, corr]) =>
  corr ? `<span class="star">${n}*</span>` : n).join(' · ');}
// A cited source is on screen as evidence, not as a bibliography record: it opens automatically
// beside the focal card, so a 25-name byline is 25 lines of noise between the reader and the
// claim. Compact to the ends of the byline — which is how the paper gets cited anyway — keeping
// the corresponding-author mark. Under six names it is already short enough to print in full.
function shortAuthLine(a){
  if (a.length < 6) return authLine(a);
  const one = ([n, , corr]) => corr ? `<span class="star">${n}*</span>` : n;
  const corr = a.filter(x => x[2]).map(one);
  const ends = [one(a[0]), ...(corr.length ? corr : [one(a[a.length - 1])])];
  return `${ends[0]} · … · ${ends.slice(1).join(' · ')} <span class="anum">(${a.length} authors)</span>`;
}
// citekey = <Family><Year><Venue>; the venue token is the journal (ISO-4 abbrev / brand). Used as
// the journal until a real `journal` field is stored end-to-end (then p.journal wins).
const venueFromKey = k => { const m = String(k).match(/\d{4}([A-Za-z][A-Za-z0-9]*)$/); return m ? m[1] : ""; };

// An aim's `note` is written as thesis-then-consequence — "same mean, percolating pattern → solid;
// dispersed → fluid. If it holds it makes a number and closes the chain…". Split it there: the
// first sentence is the punchline (closed card), the remainder is the pitch (open card). No new
// schema field — the two layers were already in the YAML, the card just never printed them.
function splitNote(n){
  const t = (n || "").trim();
  const m = t.match(/^([\s\S]*?[.!?])\s+([\s\S]+)$/);
  return m ? [m[1], m[2].replace(/\s+/g, " ")] : [t, ""];
}
// The standing counts: what the aim rests on that nothing checks, what would settle it, what it
// cannot yet do. This is `lit programme`'s report compressed onto one line, and it deliberately
// leads with the weakest thing — that is what a reviewer finds first regardless.
function aimStat(p){
  const S = p.slices, n = (k, one, many) => `${k} ${k === 1 ? one : many}`;
  const lb = S.filter(s => s.lb), tests = S.filter(s => s.kind === "test");
  const risk = tests.filter(s => s.risk);
  const asp = S.filter(s => s.kind === "capability" && s.asp);
  const openq = S.filter(s => s.kind === "question" && !s.answered);
  const bits = [];
  if (lb.length) bits.push(`<span class="warn">${n(lb.length, "assumption", "assumptions")} `
    + `nothing checks</span> (${lb.map(s => s.br + "✕").join(" · ")})`);
  if (tests.length) bits.push(n(tests.length, "test", "tests") + (risk.length
    ? `, <span class="warn">${risk.length === tests.length ? "all" : risk.length} at risk</span>` : ""));
  if (asp.length) bits.push(`<span class="warn">`
    + n(asp.length, "capability that doesn't", "capabilities that don't") + ` exist yet</span>`);
  if (openq.length) bits.push(n(openq.length, "open question", "open questions"));
  return bits.join(" · ");
}

function paperCard(key, level){
  const p = PAPERS[key] || STUBS[key];
  const cur = !!(PAPERS[key] && PAPERS[key].cur);
  const aim = !!(PAPERS[key] && PAPERS[key].aim);
  const id = `${level}:${key}`;
  const el = document.createElement("div");
  el.className = `card ${cur ? 'curated' : 'stub'}${aim ? ' aim' : ''}`;
  el.id = "card-" + id; el.dataset.key = key; el.dataset.id = id;
  el.dataset.year = p.year || 0;
  // Collapsed by default: circle + citekey only. The rest is revealed on focus (.open).
  // An aim carries neither: curation maturity is a reading protocol for a document that already
  // exists (programme design §7), and an aim has no year — which the header used to print as
  // a literal "null".
  let body = `<div class="chd">${aim ? "" : passCircle(cur ? p.pass : 0)}<span class="ckey">${key}</span>`;
  if (cur) {
    body += `<span class="ctype ${p.type}">${p.type}</span>`;
    // tags ride in the header (collapsed too) between the class pill and the right-pushed year
    if (p.tags && p.tags.length) body += `<div class="ctags">`
      + p.tags.map(t => `<span class="ctag" data-tag="${esc(t)}">${esc(t)}</span>`).join("") + `</div>`;
    if (!aim) body += `<span class="cyr">${p.year}</span>`;
  }
  body += `</div>`;
  if (cur) {
    body += `<div class="ctitle">${p.title}</div>`;
    if (aim) {
      const [punch, pitch] = splitNote(p.note);
      if (punch) body += `<div class="cpunch">${punch}</div>`;
      const stat = aimStat(p);
      if (stat) body += `<div class="cstat">${stat}</div>`;
      if (pitch) body += `<div class="cnote">${pitch}</div>`;
    } else {
      if (p.authors) body += `<div class="cauth">`
        + (p.cited ? shortAuthLine(p.authors) : authLine(p.authors)) + `</div>`;
      if (p.abs) body += `<div class="cabs">${p.abs}</div>`;   // shown inline only on touch (CSS); desktop reads it in the hover tip
    }
    body += `<div class="slices"></div>`;   // filled by renderSlices from the drill state
  }
  // The provenance strip, landing column only: which shown claims this paper answers to. Born empty
  // (hence .plain) and filled by syncLanding, because what a card is doing here changes after it is
  // built — showing a second claim that also rests on this paper adds a reason.
  if (level === 0)
    body += `<div class="cprov"><span class="cvia"></span></div>`;
  el.innerHTML = body;
  if (level === 0) el.classList.add("plain");
  // a tag chip runs a search for that tag (the whole filter-by-tag story — no separate panel);
  // stopPropagation keeps the click off cardClick's fold/drill routing
  if (cur) el.querySelectorAll(".ctag").forEach(chip =>
    chip.addEventListener("click", e => { e.stopPropagation(); runSearch(chip.dataset.tag); }));
  // the abstract + PDF-preview tip is bound to the citekey tag only (hovering the body drills
  // slices / isolates edges without popping the tip); edge-isolation still tracks any row.
  el.addEventListener("mousemove", e => {
    if (e.target.closest(".ckey")) showTip(e, key, el); else dropTip();
    hoverRow(el, e);
  });
  el.addEventListener("mouseleave", () => { dropTip(); hoverRow(null); });
  // right-click a curated card (browse view) → "Curate this paper" → move it onto the worklist
  if (cur && LIVE && !DRIVE) el.addEventListener("contextmenu", e => showCurateMenu(e, key));
  // touch has no hover: a curated card opens on tap; a stub (no open action) pins its tip instead,
  // so its bib metadata stays reachable on a phone (dismissed by the next outside tap).
  el.addEventListener("click", e => {
    if (cur) cardClick(e, el, level, key);
    else if (!HOVER) showTip(e, key, el, true);
  });
  return el;
}

const samePin=(a,b)=>!!a&&!!b&&a.cardId===b.cardId&&a.sid===b.sid;
// the level baked into a card id ("card-<level>:<key>") — SYNTH and up is a synthesis-band claim
const cardIdLevel=cardId=>+cardId.slice(5,cardId.indexOf(":"));
// A target a second click just RELEASED. Without this the release is invisible: the pointer is
// still resting on the row it released, so the transient `hover` immediately re-lights the very
// edges the click turned off. On desktop that lasts until the pointer wanders away; on touch,
// where a tap fires a synthetic mousemove and no mouseleave ever comes, it lasts until some other
// card is tapped — which is exactly the "second click does nothing" it was reported as. The
// suppression lifts the moment the hover genuinely moves somewhere else.
let unpinned=null;
// Hover-isolate: hovering a slice row (or a broad synthesis node) keeps only the edges
// incident on it — every other arrow disappears — and each counterpart card lights up
// (.hl), so the paper an edge touches is visible even while its slice is still folded.
function setHover(h){
  if (samePin(h, unpinned)) return;                 // still on the target we just released
  unpinned = null;
  if (h ? (hover && h.cardId === hover.cardId && h.sid === hover.sid) : !hover) return;
  hover = h; redraw();
  aimDockFromHover(h);          // if the docked PDF viewer is open, aim it at this claim's source
}
function hoverRow(el, e){
  let h = null;
  if (el && el.classList.contains("open")) {
    const row = e.target.closest(".slice");
    if (row) h = {cardId: el.id, sid: row.dataset.sid};
  }
  setHover(h);
}
// Click-to-pin: harden a target so it stays bright after the pointer leaves. Pins accumulate;
// clicking the same target again releases just it, a click on empty board space thaws them all.
function togglePin(t){
  const i=pin.findIndex(p=>samePin(p,t));
  if(i>=0){ pin.splice(i,1); unpinned=t; if(samePin(hover,t)) hover=null; }  // release, and stay released
  else { pin.push(t); unpinned=null; }
  redraw();
}
const SID_CLASS = {floor: "fl", model: "fl", grounded: "cl", borrowed: "bo",
                   plausible: "cl", question: "q",
                   // programme layer: a claim's modality, then the feasibility kinds.
                   // "established" reuses the borrowed blue — it *is* grounded elsewhere.
                   established: "bo", proposed: "pr", speculation: "sp",
                   test: "te", "test-at-risk": "ri",
                   capability: "ca", "capability-aspirational": "ri"};

// ── folding in place ─────────────────────────────────────────────────────────────────────
// Folding is a local edit to one node, so the view must not move under it. It did: renderSlices
// replaces the card body wholesale, which destroys the sideways-scrolled `.snodes` and reborns
// it at scrollLeft 0 — every click on a node in column 3 threw the card back to its floors. And
// a whole-card fold halves every column's width, so even a preserved scrollLeft would land
// somewhere else entirely.
//
// So don't preserve a scroll offset; preserve a *node*. The one the human just clicked is where
// their eye is, and it is the same node before and after. Pin its screen position, re-render,
// then put the scrollers back until it is where it was — the card's own `.snodes` first, and
// the board for whatever the card could not absorb (a clamped scroller, or the column above it
// changing height).
const nodeSel = sid => `.snodes .slice[data-sid="${CSS.escape(sid)}"]`;
const grpSel  = g   => `.sgrp[data-grp="${CSS.escape(g)}"]`;
function cornerNode(box){                       // no click to anchor on → the top-left-most node
  const nodes = box.querySelector(".snodes");
  if (!nodes) return null;
  const r0 = nodes.getBoundingClientRect();
  let best = null, bd = Infinity;
  for (const el of nodes.querySelectorAll(".slice[data-sid]")) {
    const r = el.getBoundingClientRect();
    if (r.right < r0.left || r.left > r0.right) continue;      // scrolled out of the body
    const d = (r.left - r0.left) ** 2 + (r.top - r0.top) ** 2;
    if (d < bd) { bd = d; best = el; }
  }
  return best;
}
// `sel` names the anchor inside the card body — it has to be a selector, not the element, because
// the re-render throws that element away and we need to find its replacement.
function renderSlicesInPlace(id, sel){
  const card = document.getElementById("card-" + id);
  const box = card && card.querySelector(".slices");
  if (!box) { renderSlices(id); return; }
  if (!sel) { const c = cornerNode(box); sel = c && nodeSel(c.dataset.sid); }
  const anchor = sel && box.querySelector(sel);
  const r0 = anchor && anchor.getBoundingClientRect();
  renderSlices(id);
  const el = r0 && box.querySelector(sel);
  if (!el) return;
  const nodes = box.querySelector(".snodes");
  let r = el.getBoundingClientRect();
  if (nodes && nodes.contains(el)) {
    // .snodes lives INSIDE the zoomed stage, so its scroll offsets are stage pixels while the
    // rects above are glass pixels — the delta has to come back down through the zoom. The board
    // below doesn't: it is the scroll port the transform hangs under, so its own space is glass.
    const bz = boardZoom();
    nodes.scrollLeft += (r.left - r0.left) / bz;
    nodes.scrollTop  += (r.top  - r0.top) / bz;  // no-op while .snodes only scrolls sideways
    r = el.getBoundingClientRect();
  }
  board.scrollLeft += r.left - r0.left;          // the remainder is the board's to make up
  board.scrollTop  += r.top  - r0.top;
}

// Click routing on a curated card: closed → click anywhere focuses it; open → the header
// collapses it (or promotes a context-opened card to focus), and slice rows fold (a paper's
// graph) or drill (an aim's outline).
function cardClick(e, el, level, key){
  const id = `${level}:${key}`;
  if (e.target.closest(".sfold") && el.classList.contains("open")) {
    // the whole card at once: fold every slice to its badge, or give the text back. Folded is
    // how the graph is READ — 26 rows of prose is a scroll, 26 badges is a diagram.
    const {rows} = localDag(PAPERS[key]);
    const s = sFold.get(id) || new Set();
    if (rows.length && rows.every(n => s.has(n))) s.clear(); else rows.forEach(n => s.add(n));
    sFold.set(id, s);
    renderSlicesInPlace(id); redraw();
    return;
  }
  const grp = e.target.closest(".sgrp");
  if (grp && el.classList.contains("open")) {          // fold/unfold an entry sub-group
    const gkey = `${id}::${grp.dataset.grp}`;
    if (grpCollapsed.has(gkey)) grpCollapsed.delete(gkey); else grpCollapsed.add(gkey);
    renderSlicesInPlace(id, grpSel(grp.dataset.grp));
    redraw();                                          // rows appear/vanish → edges re-anchor
    return;
  }
  const row = e.target.closest(".slice");
  if (row && el.classList.contains("open")) {
    togglePin({cardId: el.id, sid: row.dataset.sid});   // harden/release this row (accumulates)
    // A quote-slice click aims the PDF at that exact quote. This used to be hover-only in the
    // browse view, which meant a phone could never see a highlighted quote at all: there is no
    // hover to aim with, so the dock sat on page 1 of the paper no matter what you tapped. Click
    // now aims it everywhere — on desktop that's a no-op confirming what the hover already did
    // (aimDock early-returns when it's already parked on this claim). Aiming never OPENS the
    // PDF: with the dock shut the aim is just remembered, and the next explicit 📄 lands on it.
    if (row.classList.contains("pdf-src")) {
      if (DRIVE) focusFromClick(key, row.dataset.sid);   // card window: steer the separate PDF window
      else aimDock(key, row.dataset.sid);                // browse / mobile-curate: aim the dock
    }
    // an aim's row drills its branch; a paper's row has no branch to drill — every slice is
    // already on screen — so the click trades that row's text for its badge instead.
    if (row.classList.contains("drillable")) toggleDrill(id, row.dataset.path);  // drill + rebuild
    else if (row.dataset.sid && !PAPERS[key].aim && !PAPERS[key].cited) {
      const s = sFold.get(id) || new Set();
      if (s.has(row.dataset.sid)) s.delete(row.dataset.sid); else s.add(row.dataset.sid);
      sFold.set(id, s);
      renderSlicesInPlace(id, nodeSel(row.dataset.sid));
      redraw();                                        // row height changed → arcs re-anchor
    }
    return;
  }
  if (el.classList.contains("open")) {
    if (e.target.closest(".chd")) {
      if (open.has(id)) {
        open.delete(id); drill.delete(id); grpSeeded.delete(id); sFold.delete(id);
        for (const g of [...grpCollapsed]) if (g.startsWith(id + "::")) grpCollapsed.delete(g);
      }
      else open.add(id);                      // context-opened card → promote to focused
      rebuild(id);                            // the card you clicked stays where you clicked it
    }
    return;
  }
  open.add(id); rebuild(id);                   // collapsed card clicked open — reading the graph, not the PDF
}

function toggleDrill(id, path){
  let s = drill.get(id);
  if (!s) { s = new Set(); drill.set(id, s); }
  if (s.has(path))                       // fold the whole branch under this row
    for (const p of [...s]) { if (p === path || p.startsWith(path + "/")) s.delete(p); }
  else s.add(path);
  rebuild(id);
}

// ── the paper's local subgraph ───────────────────────────────────────────────────────────
// A paper's slices form a small DAG — measured across the 53 curated papers it is never
// deeper than 5 nor wider than 12 — and this reduces it to a drawing order for that DAG.
//
// Direction: `a` stands ABOVE `b` when a rests on b (grounded_in), when a is the broader
// claim b ladders into (local leads_to), or when a is the question b answers. So the top of
// the list is what the paper concluded and the bottom is the floors it stands on, which is
// the order the outline used to nest in — minus the nesting.
//
//   * `rows`  — every slice exactly once, each below all of its parents (Kahn, depth-first
//     so a chain stays contiguous, ties broken by authored order).
//   * `depth` — longest path from a root, the indent. Reproduces the outline's shape for the
//     tree-like part without paying its duplication for the parts that aren't a tree.
//   * `links` — the real edges, drawn as arcs. This is the half an outline threw away: a
//     support with two parents, and a claim that grounds in something three generations down.
function localDag(p){
  const byId = {}; p.slices.forEach(s => byId[s.id] = s);
  const rank = {}; p.slices.forEach((s, i) => rank[s.id] = i);
  const kids = {}, par = {}, links = [];
  const link = (a, b, kind) => {
    if (a === b || !byId[a] || !byId[b]) return;
    if (links.some(l => l.a === a && l.b === b)) return;      // one arc per pair, whatever the refs
    links.push({a, b, kind});
    (kids[a] = kids[a] || []).push(b);
    (par[b] = par[b] || []).push(a);
  };
  p.slices.forEach(s => {
    (s.up || []).forEach(u => link(s.id, u, "leads"));        // s rests on u
    (s.gen || []).forEach(g => link(g, s.id, "gen"));         // g is the broader claim s ladders into
    (s.answers || []).forEach(q => link(q, s.id, "answers")); // the question stands over its answer
  });
  const rows = [], seen = new Set();
  const pend = {}; p.slices.forEach(s => pend[s.id] = (par[s.id] || []).length);
  // Among slices that are all equally free to be placed, order by the paper's own rhetoric —
  // the same order the entry groups used to impose as containers: the line of inquiry it
  // answered, then its novel claims, then the ones it merely restates, then the methods, and
  // last the questions it leaves OPEN. The groups were headings over that order; a topological
  // sort can carry it as a tie-break instead, which is how the reading survives the flattening.
  const bucket = s => s.kind === "question" ? (s.answered ? 0 : 4)
                    : s.kind === "method" ? 3
                    : s.color === "borrowed" ? 2 : 1;
  const ord = {}; p.slices.forEach(s => ord[s.id] = bucket(s) * 1e4 + rank[s.id]);
  const byRank = a => a.slice().sort((x, y) => ord[y] - ord[x]);     // stack pops the first wanted
  const ready = byRank(p.slices.filter(s => !pend[s.id]).map(s => s.id));
  while (ready.length) {
    const n = ready.pop();
    if (seen.has(n)) continue;
    seen.add(n); rows.push(n);
    const freed = (kids[n] || []).filter(c => --pend[c] === 0);
    ready.push(...byRank(freed));                             // depth-first: a chain stays together
  }
  // a cycle would strand its members; the schema forbids one, but a stranded slice must still
  // render — dropping a proposed claim silently is the one failure mode this card can't have
  p.slices.forEach(s => { if (!seen.has(s.id)) { seen.add(s.id); rows.push(s.id); } });

  // ── the columns ────────────────────────────────────────────────────────────────────────
  // A slice's column is its longest chain of local support: a slice resting on nothing local
  // is a floor and sits at 0, and everything stands one column right of the furthest thing it
  // leans on. So the axis reads ground → derived, left → right, the same direction `leads-to`
  // runs everywhere else in this viewer — the card is the board one scale down.
  //
  // A claim with no LOCAL grounding lands in column 0 beside the methods, which looks wrong for
  // about a second and is then exactly right: its grounding is a citation, and the paper it
  // cites is the card immediately to the left of this one.
  const lv = {};
  const level = (n, st) => {
    if (lv[n] != null) return lv[n];
    if (st.has(n)) return 0;                                  // defensive: a cycle stops here
    st.add(n);
    lv[n] = Math.max(0, ...(kids[n] || []).map(k => level(k, st) + 1));
    st.delete(n); return lv[n];
  };
  rows.forEach(n => level(n, new Set()));
  const width = Math.max(0, ...Object.values(lv)) + 1;
  const cols = Array.from({length: width}, () => []);
  rows.forEach(n => cols[lv[n]].push(n));                     // rows order = the rhetoric tie-break
  // Order each column by the barycentre of what it rests on, so an edge runs as near to
  // horizontal as the graph allows and two supports of one claim sit next to each other rather
  // than at opposite ends of a column. Column 0 has nothing to its left, so it keeps the
  // rhetoric order; every column after it is placed against the one already settled.
  for (let c = 1; c < width; c++) {
    const at = {}; cols[c - 1].forEach((n, i) => at[n] = i);
    const bary = {};
    cols[c].forEach((n, i) => {
      const ks = (kids[n] || []).filter(k => at[k] != null).map(k => at[k]);
      bary[n] = ks.length ? ks.reduce((a, b) => a + b, 0) / ks.length : i;
    });
    cols[c].sort((x, y) => bary[x] - bary[y] || rows.indexOf(x) - rows.indexOf(y));
  }
  return {rows, cols, lv, links, byId, par, kids};
}

// Render that DAG as columns of nodes: one node per slice, its column its support depth, with
// the edges handed to redraw(). The card body scrolls sideways when the ladder is longer than
// the window — and folding (a node by click, the card by the bar's toggle) is the way out of
// that: badges are a quarter the width, so a folded card puts the whole ladder on screen at
// once. Read the text one column at a time, fold to see the shape.
function renderGraph(id, key, p, box){
  const {rows, cols, links} = localDag(p);
  const cid = "card-" + id;
  const folded = sFold.get(id) || new Set();
  const all = rows.length && rows.every(n => folded.has(n));
  let html = `<div class="sbar"><span>${rows.length} slice${rows.length === 1 ? "" : "s"}`
           + ` · ${links.length} edge${links.length === 1 ? "" : "s"}</span>`
           + `<span class="saxis">ground →&nbsp;derived</span>`
           + `<span class="sfold">${all ? "show text" : "fold to graph"}</span></div>`
           + `<div class="snodes${all ? " allfold" : ""}">`;
  cols.forEach((col, c) => {
    html += `<div class="scol"><div class="schd">${c === 0 ? "floors" : "· ".repeat(c)}`
          + `<span class="sct">${col.length}</span></div>`;
    for (const sid of col) {
      const s = p.slices.find(x => x.id === sid);
      const ans = s.kind === "question" && s.answered ? " ans" : "";
      const pdf = (LIVE && s.quote) ? " pdf-src" : "";   // quote-bearing → hover aims the docked viewer
      html += `<div class="slice${pdf}${folded.has(sid) ? " fold" : ""}" data-sid="${s.id}"`
            + ` title="click to fold this slice to its badge">`
            + `<span class="sid ${SID_CLASS[s.color] || 'cl'}${ans}">${s.id}</span>`
            + `<span class="stx">${s.text}</span>`
            + `<span class="fkd">${s.kind}</span>`
            + `</div>`;
    }
    html += `</div>`;
  });
  box.innerHTML = html + `</div>`;
  // The columns scroll under a stationary overlay, so the arcs have to be re-laid on every
  // scroll tick or they detach from the nodes they belong to.
  box.querySelector(".snodes").addEventListener("scroll", redraw);
  // The within-paper edges go to the same overlay the cross-paper ones use, so they inherit the
  // whole isolation story for free: faint at rest, bright when the hover or a pin touches either
  // end. That dimming is what keeps 34 arcs legible in the space between five columns.
  //
  // Emitted ground → derived (`l.b` rests under `l.a`), so the arrowhead lands on the derived
  // slice and every arrow in this card points the same way as every arrow on the board.
  for (const l of links)
    addEdge({cardId: cid, sid: l.b}, {cardId: cid, sid: l.a}, l.kind, true);
}

// Drill-down rendering (AIM cards): entry rows are the top of the container's local support
// hierarchy. Expanding a row reveals its direct supports — for a question, the claims that
// answer it; for a broader claim, also the claims that ladder into it (⤴). An aim is read as
// an argument, not as a support DAG, so it keeps its rhetorical groups and its outline; the
// duplication an outline costs is bounded there because the groups already place every claim
// exactly once and the nesting only reaches methods.
function renderSlices(id){
  const key = id.slice(id.indexOf(":") + 1), p = PAPERS[key];
  const box = document.getElementById("card-" + id).querySelector(".slices");
  if (!box) return;
  if (!p.aim && !p.cited) return renderGraph(id, key, p, box);
  const byId = {}; p.slices.forEach(s => byId[s.id] = s);
  const answeredBy = {};
  p.slices.forEach(s => (s.answers || []).forEach(r => {
    if (!r.includes(":")) (answeredBy[r] = answeredBy[r] || []).push(s.id);
  }));
  const genBy = {};                    // broader slice -> the local slices laddering into it
  p.slices.forEach(s => (s.gen || []).forEach(g => (genBy[g] = genBy[g] || []).push(s.id)));
  const dependents = new Set();
  p.slices.forEach(s => (s.up || []).forEach(u => dependents.add(u)));
  // an aim additionally shows tests as entries in their own right — a test is not
  // sub-structure of a claim, it is what the aim proposes to *do*.
  const tests = p.aim ? p.slices.filter(s => s.kind === "test") : [];
  // a laddering claim (local leads_to) sits under its broader parent, not at the top
  const entries = p.slices.filter(s =>
    (s.kind === "claim" && !dependents.has(s.id) && !(s.gen || []).length)
    || s.kind === "question");
  const questions = entries.filter(s => s.kind === "question");
  // An aim's card answers a different question from a paper's, and it must not open on all of it.
  // A paper reports what it found; an aim makes an argument, and an argument is read top-down —
  // the hypothesis, its rivals, and the experiments that separate them, with everything else
  // folded until asked for. Three rules differ from the paper branch:
  //
  //   * **every claim is placed, exactly once.** The paper rule ("a claim something depends on is
  //     sub-structure — nest it") inverts here: an aim's hypothesis is grounded in its assumptions
  //     and its payoff is grounded in the hypothesis, so the load-bearing claims are precisely the
  //     ones that rule hid. It hid c5 (the hypothesis) behind c14, and made the assumptions group
  //     unreachable outright — `lb` requires a dependent, and having a dependent removed you.
  //   * **the argument leads.** Ordered by blast radius, so the hypothesis stands above the rivals
  //     it is being tested against rather than below whichever null sorts first.
  //   * **the rest is folded** (seeded below), so the card opens on ~one screenful.
  const argued = new Set();            // claims a test separates — the argument's live front
  tests.forEach(t => (t.disc || []).forEach(c => argued.add(c)));
  const testFor = {};                  // claim -> the test(s) aimed at it, shown as a row chip
  tests.forEach(t => (t.disc || []).forEach(c => (testFor[c] = testFor[c] || []).push(t.id)));
  const allClaims = p.aim ? p.slices.filter(s => s.kind === "claim") : [];
  const placed = new Set();            // first group wins, so nothing renders twice
  const take = f => {                  // …and nothing silently vanishes: see the "everything else"
    const out = allClaims.filter(s => !placed.has(s.id) && f(s));
    out.forEach(s => placed.add(s.id));
    return out;
  };
  const argument = [...take(s => argued.has(s.id)).sort((a, b) => (b.br || 0) - (a.br || 0)), ...tests];
  const assumptions = take(s => s.lb);
  const literature = take(s => s.mod === "established");
  const rest = take(() => true);       // controls the test verifies, and what follows if it works
  const caps = p.aim ? p.slices.filter(s => s.kind === "capability") : [];
  const other = p.aim ? p.slices.filter(s =>
    !["claim", "question", "test", "capability"].includes(s.kind)) : [];
  // A trimmed neighbour (`lit preview` of an aim, preview.py `_cited_neighbour`) carries only the
  // slices the focal container cites, and they go in one group whatever their kind — the paper
  // branch's entry rule never surfaces a Method, and three of the five sources here are cited for
  // their methods. The group IS the answer to "what does the aim take from this paper".
  // [label, rows, folded-by-default]
  const groups = p.cited ? [
    ["cited here", p.cited.map(i => byId[i]).filter(Boolean), false],
  ] : p.aim ? [
    ["the argument", argument, false],
    ["assumptions — nothing checks these", assumptions, true],
    ["rests on the literature", literature, true],
    ["controls & consequences", rest, true],
    ["open questions", questions.filter(s => !s.answered), true],
    ["answered questions", questions.filter(s => s.answered), true],
    ["capabilities", caps, true],
    ["everything else", other, true],
  ] : [];
  const paths = new Set([...(drill.get(id) || []), ...(ctxDrill.get(id) || [])]);
  // a question's direct answers are only the *un-subsumed* ones: an answer that grounds (up) or
  // ladders (gen) into another answer of the SAME question nests under that sibling when it's
  // drilled, so listing it flat here too would render it twice (the umbrella + its supports).
  // This mirrors the top-level `dependents`/`gen` entry filter, which the answer list bypassed.
  const qKids = qid => {
    const ans = answeredBy[qid] || [], set = new Set(ans), sub = new Set();
    ans.forEach(a => {
      (byId[a].up || []).forEach(u => { if (set.has(u)) sub.add(u); });
      (genBy[a] || []).forEach(u => { if (set.has(u)) sub.add(u); });
    });
    return ans.filter(a => !sub.has(a)).map(k => ({s: byId[k], lad: false}));
  };
  // A test drills to the methods it uses. What it *separates* and what it *needs* used to nest
  // here too, which is what made one aim's 23 slices render as 47 rows — the rivals sit in the
  // same group as the test and the capabilities have their own, so nesting them re-rendered
  // claims up to five times over. Both relations ride on the row instead, as cross-references.
  const kidsOf = s => s.kind === "question"
    ? qKids(s.id)
    : s.kind === "test"
    ? (s.up || []).map(u => ({s: byId[u], lad: false})).filter(k => k.s)
    : [...(s.up || []).map(u => ({s: byId[u], lad: false})),
       ...(genBy[s.id] || []).map(u => ({s: byId[u], lad: true}))].filter(k => k.s);
  // the cross-reference lines under a test's text: what it settles, and the kit it needs (an
  // unevidenced capability shown in the risk colour — it is the reason the test reads at-risk).
  const xref = s => {
    if (s.kind !== "test") return "";
    const bits = [];
    if ((s.disc || []).length)
      bits.push(`separates ${s.disc.map(c => `<b>${c}</b>`).join(" · ")}`);
    if ((s.en || []).length)
      bits.push(`needs ${s.en.map(k => byId[k] && byId[k].asp
        ? `<b style="color:var(--risk)" title="claimed but not evidenced">${k}</b>` : `<b>${k}</b>`).join(" · ")}`);
    return bits.length ? `<span class="sep">${bits.join(" &nbsp;·&nbsp; ")}</span>` : "";
  };
  let html = "";
  const row = (s, path, depth, lad) => {
    const kids = kidsOf(s);
    const can = kids.length;                        // drillable only if it has sub-structure now
    const isOpen = can && paths.has(path);
    const ans = s.kind === "question" && s.answered ? " ans" : "";
    // a slice whose weld is a quote: no inline quote text — its PDF pops on hover / pins on click
    const pdf = (LIVE && s.quote) ? " pdf-src" : "";   // quote-bearing → hover aims the docked viewer
    html += `<div class="slice${can ? ' drillable' : ''}${pdf}${lad ? ' gen' : ''}" data-sid="${s.id}" data-path="${path}"`
          + ` style="margin-left:${depth * 14}px"${lad ? ' title="generalizes into the claim above (leads_to)"' : ''}>`
          + `<span class="car">${can ? (isOpen ? "▾" : "▸") : "·"}</span>`
          + (lad ? `<span class="gmk">⤴</span>` : ``)
          + `<span class="sid ${SID_CLASS[s.color] || 'cl'}${ans}">${s.id}</span>`
          + `<span class="stx">${s.text}${xref(s)}</span>`
          // the one thing a jury finds first: what the aim rests on with nothing under it
          + (s.lb ? `<span class="lb" title="load-bearing: ${s.br} dependent${s.br === 1 ? '' : 's'}, no test aimed at it">${s.br}✕</span>` : ``)
          // …and its mirror: the test aimed at this claim, so a rival names its own referee
          + ((testFor[s.id] || []).length
             ? `<span class="tst" title="settled by ${testFor[s.id].join(", ")}">${testFor[s.id].join(" ")}</span>` : ``)
          + `</div>`;
    if (isOpen) {

    }
  };
  // An aim opens on its argument alone. Seeded once per card (see grpSeeded) so unfolding a group
  // sticks; a close clears the seed, so reopening lands back on the default view.
  if (p.aim && !grpSeeded.has(id)) {
    grpSeeded.add(id);
    for (const [label, ss, fold] of groups)

    html += `<div class="sgrp" data-grp="${label}"><span class="gcar">${col ? "▸" : "▾"}</span>`
          + `${label}<span class="gct">${ss.length}</span></div>`;
    if (col) continue;                     // header only — rows stay folded away
    html += `<div class="sgrpb">`;

}
// ── hoisting ─────────────────────────────────────────────────────────────────────────────
// Clicking a broad claim pulls it AND every container that feeds it to the top of their columns.
// While the library was small the isolation highlight was enough: dim everything, and the two or
// three lit cards were on screen anyway. It isn't any more — a broad node's papers sit anywhere
// down a column of thousands, so isolating it lit up arrows that pointed off the bottom of the
// screen. Hoisting gathers the claim and its containers into one screenful, which is what
// "show me this broad claim" meant all along.
function colInsertPoint(col){                        // the first slot below the column's header
  const hd=col.querySelector(":scope > .colhd");
  return hd?hd.nextSibling:col.firstChild;

// Move each element to the top of its own column, preserving the order given — elements sharing a

function hoistAll(els){
  const prev=new Map();                              // column -> the last element hoisted into it
  for(const el of els){
    const col=el&&el.parentNode;
    if(!col||!col.classList||!col.classList.contains("col")) continue;
    const p=prev.get(col);
    // chain off the previous hoist rather than tracking a "next sibling" cursor: that cursor goes
    // null on the column's last child, and insertBefore(el,null) APPENDS — the exact opposite
    if(p) p.after(el); else col.insertBefore(el,colInsertPoint(col));
    prev.set(col,el);

function hoistEls(slug){
  // The FAMILY is what travels, not the rung. A rung's card lives inside its root's box, so moving
  // it to the top of the column would tear it out of the containment that makes the band readable —
  // and there is nothing left to gather anyway: the narrower claims a hoist used to fetch up beside
  // this one are already nested directly under it. So the hoist has one job now, placing the box
  // that holds the claim at the top of the synthesis column, and the papers in the curated list.
  const root=broadRoot[slug]||slug;
  const els=[document.getElementById("fam-"+root)
            ||document.getElementById(`card-${SYNTH}:${root}`)];
  const seen=new Set();
  for(const lk of (BROAD_LINKS[slug]||[])){          // once per paper, however many slices feed the node
    if(seen.has(lk.key)) continue;
    seen.add(lk.key);
    // every instance, not just the landing one: an expanded paper also has a card in the
    // grounds/builds column it spawned into, and that is where its real edge anchors
    for(const lvl of Object.keys(cols).map(Number))
      if(lvl<SYNTH&&cols[lvl].keys.has(lk.key))
        els.push(document.getElementById(`card-${lvl}:${lk.key}`));
  }

  // a block, it does not get to re-sort inside it. Keeps the landing column's pass ranking intact,
  // and makes replaying the stack idempotent for the blocks already in place.
  return els.filter(e=>e&&e.isConnected)

// Hoisting ACCUMULATES: the first claim you show gathers itself and its papers at the top, the

// a synthesis band is for, and a board that reorders itself under a comparison you are halfway
// through is unusable. A paper feeding two shown claims stays with the first that claimed it —
// pulling it down on the second click would tear a hole in the block you just built.

const broadPapers=slug=>[...new Set((BROAD_LINKS[slug]||[]).map(l=>l.key))];
const broadTitle=slug=>(BROAD[slug]&&(BROAD[slug].title||BROAD[slug].text))||slug;

function broadCard(slug,level,rung){

  // optional `title` (SCHEMA §4): the at-a-glance name, with the full statement as its gloss

  // what lies one step below this claim: narrower claims (up the ladder) and papers (at the foot of
  // it). A claim can have either, both, or neither; a leaf carries no affordance it cannot honour.
  const on=shownBroad.has(slug);
  const kids=(broadKids[slug]||[]).length;
  // The rung pill reads differently now that the narrower claims are literally inside this card's
  // box: it names what you are already looking at rather than pointing off across the band. Kept
  // because the count is still the fact that matters — how much of the library this claim gathers.
  const dn=kids?`<div class="bdrill${on?" on":""}"`
          +` title="the narrower claims that ladder into this one — they are nested inside this`
          +` box; click the card to gather its papers in the curated list">`
          +`${kids} narrower</div>`:"";

  // "showing 3 of 4", because a × could dismiss one of the papers the claim had just landed; with

  // constant fact about the graph and the fill says whether the block is gathered.
  const keys=broadPapers(slug);

          +` title="the papers that assert this — they stand in the curated list; click the card to`
          +` gather them at the top of it">`
          +`◂ ${keys.length} paper${keys.length===1?"":"s"}</span></div>`:"";

  const alt=(BROAD[slug].leads_to||[]).filter(r=>BROAD[r]&&r!==broadHost[slug]);

          +`also under ${alt.map(r=>"“"+esc(broadTitle(r))+"”").join(" · ")}</div>`:"";

  // hovering a broad node isolates its edges and lights up the papers linked into it
  el.addEventListener("mousemove",e=>{ e.stopPropagation(); setHover({cardId:el.id,sid:null}); });
  el.addEventListener("mouseleave",()=>setHover(null));

  return el;
}

// ── the family container ─────────────────────────────────────────────────────────────────
// One box per ladder root, holding its whole descent. The root's own card is the box's header —
// exactly as a paper's citekey/title header names the container its slices sit in — and everything
// that ladders into it nests below, recursively. A root with nothing under it is not a container at
// all, just the card it always was; a box with one member in it would be chrome around a fact.
const famFolded=new Set();   // roots whose rungs are folded to their titles (default: all of them)
let famSeeded=false;         // …seeded once, so a fold the reader opened survives every rebuild
function scrollToBroad(slug){
  const el=document.getElementById(`card-${SYNTH}:${slug}`);
  if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.remove("found"); void el.offsetWidth;      // restart a flash still running
  el.classList.add("found");
  setTimeout(()=>el.classList.remove("found"),1800);
}
// `seen` is the cycle guard the rest of this file carries for the same reason (see computeBroadTiers):
// a hot-reloaded DRIVE window can hold YAML the build would have rejected, and a `leads_to` cycle
// would otherwise recurse until the tab dies. Nesting stops at the repeat; the node keeps its card
// wherever it was first reached.
function famNest(slug,root,depth,seen){
  const box=document.createElement("div");
  box.className="bnest";
  for(const kid of broadNest[slug]) box.appendChild(famBranch(kid,root,depth+1,seen));
  // A claim hosted by another parent still has to be VISIBLE here, or this box quietly lies about
  // what ladders into it. It is a pointer, not a copy: one row, the real card's name, and a click
  // that goes and finds it. Copying the card is what an outline does and what the paper card's DAG
  // was written to stop.
  for(const kid of broadRefs[slug]){

      +`<span class="brefn">nested under “${esc(broadTitle(broadHost[kid]))}”</span>`;

function famBranch(slug,root,depth,seen){

  wrap.appendChild(broadCard(slug,SYNTH,true));
  if(seen.has(slug)) return wrap;                          // cycle: card yes, descent no
  seen.add(slug);
  if(broadNest[slug].length||broadRefs[slug].length) wrap.appendChild(famNest(slug,root,depth,seen));
  return wrap;
}
// The whole family, as it stands in the synthesis column. `fam-<root>` is what hoisting moves: the
// family is the unit that travels, because pulling one rung out of its box to the column top would
// undo the containment that is the entire point.
function familyEl(root){
  const has=broadNest[root].length||broadRefs[root].length;
  const head=broadCard(root,SYNTH,false);
  if(!has){ head.id="card-"+SYNTH+":"+root; head.dataset.fam=root; return head; }
  const el=document.createElement("div");
  el.className="bfam"; el.id="fam-"+root; el.dataset.fam=root;
  const n=(function size(s,seen){
    if(seen.has(s)) return 0;
    seen.add(s);
    return broadNest[s].reduce((a,c)=>a+size(c,seen),0)+1;
  })(root,new Set())-1;
  const folded=famFolded.has(root);
  const bar=document.createElement("div");
  bar.className="bfbar";
  // "in this ladder", not "narrower": the head card's own pill already says how many claims are ONE
  // rung down, and two adjacent counts both labelled "narrower" would be read as a contradiction.
  // This one is the whole descent — every claim inside the box, at any depth.
  bar.innerHTML=`<span class="bfn">${n} in this ladder</span>`
    +`<span class="bffold">${folded?"show statements":"fold to titles"}</span>`;

    e.stopPropagation();

function ensureCol(level,label){
  if(cols[level]) return cols[level];
  const el=document.createElement("div"); el.className="col";
  if(label) el.innerHTML=`<div class="colhd">${label}</div>`;
  cols[level]={el,keys:new Set(),label};
  // insert in DOM ordered by level (left→right)
  const levels=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const idx=levels.indexOf(level);
  if(idx===levels.length-1) stage.appendChild(el);
  else stage.insertBefore(el, cols[levels[idx+1]].el);
  return cols[level];
}
// ── where a spawned card goes vertically ─────────────────────────────────────────────────
// Every card in a spawned column carries the GROUP that pulled it in: the index of the card you
// opened, in the order you opened it (see rebuild's sweep). A column sorts by group first and by
// its own rule second. That ordering is the whole point — a column sorted only by year lets the
// second thing you click interleave into the first thing's block, so the board silently rearranges
// itself around a click that was meant to ADD something. Group-first means each click's material
// lands below the last one's, and what is already on screen stays where you left it.
//
// Cards nobody opened for — the synthesis band's standing backfill — carry BACKFILL and sit under
// everything, so the band still reads as the complete ladder once the opened claims are past.
const BACKFILL=1e9;

function placeInCol(c,el,grp,within){
  el.dataset.grp=grp;

  for(const ch of c.el.querySelectorAll(":scope > .card, :scope > .bn, :scope > .bfam")){
    const g=cardGrp(ch);

function addPaper(level,key,label,grp){
  const c=ensureCol(level,label);
  if(c.keys.has(key)) return;          // de-dup by citekey (accumulate) — and the FIRST group to
  c.keys.add(key);                     // ask for a card keeps it; a later one only adds an edge
  const card=paperCard(key,level);
  if(level===0){ c.el.appendChild(card); return; }   // landing keeps its pass ranking
  const yr=+card.dataset.year||0;      // within a group, chronology falls out of the grounding walk

// A broad node is never placed alone: naming any rung places its whole FAMILY, because a rung's

// every member is registered under it so a second call naming a sibling is a no-op.
function addBroad(level,slug,label,grp){
  const c=ensureCol(level,label);
  if(c.keys.has(slug)) return;
  const root=broadRoot[slug]||slug;
  if(c.keys.has(root)) { c.keys.add(slug); return; }
  for(const s in BROAD) if((broadRoot[s]||s)===root) c.keys.add(s);

  // backfill in the ladder's own standing order, both of which are already the order to show them in
  placeInCol(c,familyEl(root),grp==null?BACKFILL:grp,()=>false);

// The synthesis band always shows every broad claim / question, expanded state or not —

function ensureBroadBand(){
  // Every family, every rebuild, in the standing order broadFamilies settled. addBroad de-dups on

  // where that click put it.
  for(const root of broadOrder) addBroad(SYNTH,root,synthLabel());

  // anyway (redraw hides every broad edge until the node is hovered or clicked), which is exactly
  // why the ladder read as invisible: the relation was only ever drawn on demand.

  // arrow, and it is worth an arrow precisely because it is the edge the boxes do not express —

// Citation-wall collapse: a focused paper's UNCURATED sources never spawn cards — they fold

// (reveal()/rebuild() never unfold it, so it stays collapsed under any programmatic

function addStack(level,owner,wall,label,grp){

    .map(k=>({k,p:STUBS[k]||{}}))
    .sort((a,b)=>(b.p.year||0)-(a.p.year||0));

const edgeSeen=new Set();

// `intra` marks an edge whose two ends are rows in the SAME card — the paper's own subgraph.

function addEdge(from,to,kind,intra){      // de-dup: rebuilds must not stack duplicate paths
  const k=`${from.cardId}:${from.sid}|${to.cardId}:${to.sid}|${kind}`;

// Recompute every spawned column + edge from the open set (non-exclusive: opening one

// it in turn — cross-paper expansion is iterative, one generation per click. Expansion
// runs both directions, so the sweep iterates to a fixpoint instead of walking one way.
// `hold` is the card the human just acted on ("level:key"), if any. The landing column pins the

function rebuild(hold){

  const anchorEl=cols[0]&&cols[0].el;

    if(lvl!==0){ cols[lvl].el.remove(); delete cols[lvl]; return; }

  syncLanding();                     // before the expansion sweep below reads cols[0].keys
  document.querySelectorAll(".card.open,.card.focus").forEach(c=>c.classList.remove("open","focus"));
  ctxOpen=new Set(); ctxDrill=new Map();

  // is the group every spawned card inherits (placeInCol): open a second paper and its grounds
  // stack below the first paper's instead of interleaving by year. `open` is a Set, so it is
  // already insertion-ordered, and a card closed and reopened rightly counts as a fresh arrival.

  const seq=[...open], done=new Set();
