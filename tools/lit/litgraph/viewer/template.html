    ["controls & consequences", rest, true],
    ["open questions", questions.filter(s => !s.answered), true],
    ["answered questions", questions.filter(s => s.answered), true],
    ["capabilities", caps, true],
    ["everything else", other, true],
  ] : [];
  const paths = new Set([...(drill.get(id) || []), ...(ctxDrill.get(id) || [])]);
  // a question's direct answers are only the *un-subsumed* ones: an answer that grounds (up) or
  // ladders (gen) into another answer of the SAME question nests under that sibling when it's
  // drilled, so listing it flat here too would render it twice (the umbrella + its supports).
  // This mirrors the top-level `dependents`/`gen` entry filter, which the answer list bypassed.
  const qKids = qid => {
    const ans = answeredBy[qid] || [], set = new Set(ans), sub = new Set();
    ans.forEach(a => {
      (byId[a].up || []).forEach(u => { if (set.has(u)) sub.add(u); });
      (genBy[a] || []).forEach(u => { if (set.has(u)) sub.add(u); });
    });
    return ans.filter(a => !sub.has(a)).map(k => ({s: byId[k], lad: false}));
  };
  // A test drills to the methods it uses. What it *separates* and what it *needs* used to nest
  // here too, which is what made one aim's 23 slices render as 47 rows — the rivals sit in the
  // same group as the test and the capabilities have their own, so nesting them re-rendered
  // claims up to five times over. Both relations ride on the row instead, as cross-references.
  const kidsOf = s => s.kind === "question"
    ? qKids(s.id)
    : s.kind === "test"
    ? (s.up || []).map(u => ({s: byId[u], lad: false})).filter(k => k.s)
    : [...(s.up || []).map(u => ({s: byId[u], lad: false})),
       ...(genBy[s.id] || []).map(u => ({s: byId[u], lad: true}))].filter(k => k.s);
  // the cross-reference lines under a test's text: what it settles, and the kit it needs (an
  // unevidenced capability shown in the risk colour — it is the reason the test reads at-risk).
  const xref = s => {
    if (s.kind !== "test") return "";
    const bits = [];
    if ((s.disc || []).length)
      bits.push(`separates ${s.disc.map(c => `<b>${c}</b>`).join(" · ")}`);
    if ((s.en || []).length)
      bits.push(`needs ${s.en.map(k => byId[k] && byId[k].asp
        ? `<b style="color:var(--risk)" title="claimed but not evidenced">${k}</b>` : `<b>${k}</b>`).join(" · ")}`);
    return bits.length ? `<span class="sep">${bits.join(" &nbsp;·&nbsp; ")}</span>` : "";
  };
  let html = "";
  const row = (s, path, depth, lad) => {
    const kids = kidsOf(s);
    const can = kids.length;                        // drillable only if it has sub-structure now
    const isOpen = can && paths.has(path);
    const ans = s.kind === "question" && s.answered ? " ans" : "";
    // a slice whose weld is a quote: no inline quote text — its PDF pops on hover / pins on click
    const pdf = (LIVE && s.quote) ? " pdf-src" : "";   // quote-bearing → hover aims the docked viewer
    html += `<div class="slice${can ? ' drillable' : ''}${pdf}${lad ? ' gen' : ''}" data-sid="${s.id}" data-path="${path}"`
          + ` style="margin-left:${depth * 14}px"${lad ? ' title="generalizes into the claim above (leads_to)"' : ''}>`
          + `<span class="car">${can ? (isOpen ? "▾" : "▸") : "·"}</span>`
          + (lad ? `<span class="gmk">⤴</span>` : ``)
          + `<span class="sid ${SID_CLASS[s.color] || 'cl'}${ans}">${s.id}</span>`
          + `<span class="stx">${s.text}${xref(s)}</span>`
          // the one thing a jury finds first: what the aim rests on with nothing under it
          + (s.lb ? `<span class="lb" title="load-bearing: ${s.br} dependent${s.br === 1 ? '' : 's'}, no test aimed at it">${s.br}✕</span>` : ``)
          // …and its mirror: the test aimed at this claim, so a rival names its own referee
          + ((testFor[s.id] || []).length
             ? `<span class="tst" title="settled by ${testFor[s.id].join(", ")}">${testFor[s.id].join(" ")}</span>` : ``)
          + `</div>`;
    if (isOpen) {
      for (const k of kids) row(k.s, `${path}/${k.s.id}`, depth + 1, k.lad);
    }
  };
  // An aim opens on its argument alone. Seeded once per card (see grpSeeded) so unfolding a group
  // sticks; a close clears the seed, so reopening lands back on the default view.
  if (p.aim && !grpSeeded.has(id)) {
    grpSeeded.add(id);
    for (const [label, ss, fold] of groups)
      if (fold && ss.length) grpCollapsed.add(`${id}::${label}`);
  }
  for (const [label, ss] of groups) {
    if (!ss.length) continue;
    const col = grpCollapsed.has(`${id}::${label}`);
    html += `<div class="sgrp" data-grp="${label}"><span class="gcar">${col ? "▸" : "▾"}</span>`
          + `${label}<span class="gct">${ss.length}</span></div>`;
    if (col) continue;                     // header only — rows stay folded away
    html += `<div class="sgrpb">`;
    ss.forEach(s => row(s, s.id, 0, false));
    html += `</div>`;
  }
  box.innerHTML = html;
}
// ── hoisting ─────────────────────────────────────────────────────────────────────────────
// Clicking a broad claim pulls it AND every container that feeds it to the top of their columns.
// While the library was small the isolation highlight was enough: dim everything, and the two or
// three lit cards were on screen anyway. It isn't any more — a broad node's papers sit anywhere
// down a column of thousands, so isolating it lit up arrows that pointed off the bottom of the
// screen. Hoisting gathers the claim and its containers into one screenful, which is what
// "show me this broad claim" meant all along.
function colInsertPoint(col){                        // the first slot below the column's header
  const hd=col.querySelector(":scope > .colhd");
  return hd?hd.nextSibling:col.firstChild;
}
// Move each element to the top of its own column, preserving the order given — elements sharing a
// column stack in list order, and one already on top stays put.
function hoistAll(els){
  const prev=new Map();                              // column -> the last element hoisted into it
  for(const el of els){
    const col=el&&el.parentNode;
    if(!col||!col.classList||!col.classList.contains("col")) continue;
    const p=prev.get(col);
    // chain off the previous hoist rather than tracking a "next sibling" cursor: that cursor goes
    // null on the column's last child, and insertBefore(el,null) APPENDS — the exact opposite
    if(p) p.after(el); else col.insertBefore(el,colInsertPoint(col));
    prev.set(col,el);
  }
}
function hoistEls(slug){
  const els=[document.getElementById(`card-${broadLevel(slug)}:${slug}`)];
  // the rung below, if this claim has one: the narrower claims are this claim's evidence exactly as
  // papers are a tier-0 claim's, so they travel in the same block. One generation only — a shown
  // grandchild brings its own block up under its own entry in `shownBroad`.
  for(const kid of (broadKids[slug]||[]))
    els.push(document.getElementById(`card-${broadLevel(kid)}:${kid}`));
  const seen=new Set();
  for(const lk of (BROAD_LINKS[slug]||[])){          // once per paper, however many slices feed the node
    if(seen.has(lk.key)) continue;
    seen.add(lk.key);
    // every instance, not just the landing one: an expanded paper also has a card in the
    // grounds/builds column it spawned into, and that is where its real edge anchors
    for(const lvl of Object.keys(cols).map(Number))
      if(lvl<SYNTH&&cols[lvl].keys.has(lk.key))
        els.push(document.getElementById(`card-${lvl}:${lk.key}`));
  }
  // in the order they already stand, not the order BROAD_LINKS happens to list them: a hoist moves
  // a block, it does not get to re-sort inside it. Keeps the landing column's pass ranking intact,
  // and makes replaying the stack idempotent for the blocks already in place.
  return els.filter(e=>e&&e.isConnected)
            .sort((x,y)=>(x.compareDocumentPosition(y)&Node.DOCUMENT_POSITION_FOLLOWING)?-1:1);
}
// Hoisting ACCUMULATES: the first claim you show gathers itself and its papers at the top, the
// second lands directly BELOW that block instead of shoving it down. One hoist at a time was fine
// while a hoist was assumed to be the last thing you'd do, but two claims on screen at once is what
// a synthesis band is for, and a board that reorders itself under a comparison you are halfway
// through is unusable. A paper feeding two shown claims stays with the first that claimed it —
// pulling it down on the second click would tear a hole in the block you just built.
//
// The order comes straight from `shownBroad`, which is an insertion-ordered Set and therefore
// already the click order: no second list to keep in step, because two orderings of the same fact
// are two things that can drift apart.
function hoistShown(){
  const els=[],seen=new Set();
  for(const slug of shownBroad)
    for(const el of hoistEls(slug))
      if(!seen.has(el)){ seen.add(el); els.push(el); }
  hoistAll(els);
}
function broadCard(slug,level){
  const b=BROAD[slug], id=`${level}:${slug}`;
  const el=document.createElement("div");
  el.className="bn"+(b.kind.includes("question")?" q":"")+(b.title?" titled":"");
  el.id="card-"+id; el.dataset.id=id;
  let m = b.meter?`<div class="meter"><span class="s">▲ ${b.meter.s} support</span><span class="c">▼ ${b.meter.c} contradict</span></div>`:'';
  // optional `title` (SCHEMA §4): the at-a-glance name, with the full statement as its gloss
  let t = b.title?`<div class="btl">${b.title}</div>`:'';
  // TWO READOUTS, no controls — see showBroad. Both report what the card's own click did, split by
  // what lies one step below this claim: narrower claims (up the ladder) and papers (at the foot of
  // it). A claim can have either, both, or neither; a leaf carries no affordance it cannot honour.
  const on=shownBroad.has(slug);
  const kids=(broadKids[slug]||[]).length;
  const dn=kids?`<div class="bdrill${on?" on":""}"`
          +` title="the narrower claims that ladder into this one — click the card to bring them onto the board">`
          +`${on?"▾":"▸"} ${kids} narrower</div>`:"";
  // the paper readout. When the claim is shown it reports what is actually on screen rather than a
  // bare total, so a paper dismissed with × leaves the count honest instead of leaving the card
  // claiming papers that are gone.
  const keys=LANDING_COLLAPSED?[...new Set((BROAD_LINKS[slug]||[]).map(l=>l.key))]:[];
  const shown=on?keys.filter(k=>!landedDropped.has(k)).length:0;
  const lbl=!on?`${keys.length} paper${keys.length===1?"":"s"}`
              :(shown===keys.length?`showing ${shown}`:`showing ${shown} of ${keys.length}`);
  const dp=keys.length?`<div class="blens"><span class="lens${on?" on":""}"`
          +` title="the papers that assert this — click the card to bring them into the papers column">`
          +`◂ ${lbl}</span></div>`:"";
  el.innerHTML=`<div class="bkd">${b.kind}</div>${t}<div class="btx">${b.text}</div>${m}`
              +(dn?`<div class="bdrills">${dn}</div>`:"")+dp;
  // No per-chip handlers left: the card is the only thing on it that takes a click.
  // hovering a broad node isolates its edges and lights up the papers linked into it
  el.addEventListener("mousemove",()=>setHover({cardId:el.id,sid:null}));
  el.addEventListener("mouseleave",()=>setHover(null));
  el.addEventListener("click",()=>showBroad(slug));
  return el;
}

function ensureCol(level,label){
  if(cols[level]) return cols[level];
  const el=document.createElement("div"); el.className="col";
  if(label) el.innerHTML=`<div class="colhd">${label}</div>`;
  cols[level]={el,keys:new Set(),label};
  // insert in DOM ordered by level (left→right)
  const levels=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const idx=levels.indexOf(level);
  if(idx===levels.length-1) board.appendChild(el);
  else board.insertBefore(el, cols[levels[idx+1]].el);
  return cols[level];
}
// ── where a spawned card goes vertically ─────────────────────────────────────────────────
// Every card in a spawned column carries the GROUP that pulled it in: the index of the card you
// opened, in the order you opened it (see rebuild's sweep). A column sorts by group first and by
// its own rule second. That ordering is the whole point — a column sorted only by year lets the
// second thing you click interleave into the first thing's block, so the board silently rearranges
// itself around a click that was meant to ADD something. Group-first means each click's material
// lands below the last one's, and what is already on screen stays where you left it.
//
// Cards nobody opened for — the synthesis band's standing backfill — carry BACKFILL and sit under
// everything, so the band still reads as the complete ladder once the opened claims are past.
const BACKFILL=1e9;
const cardGrp=el=>{ const g=+el.dataset.grp; return Number.isFinite(g)?g:BACKFILL; };
// `within` breaks the tie inside one group: year desc for papers, arrival order for broad nodes.
function placeInCol(c,el,grp,within){
  el.dataset.grp=grp;
  let before=null;
  for(const ch of c.el.querySelectorAll(":scope > .card, :scope > .bn")){
    const g=cardGrp(ch);
    if(g>grp||(g===grp&&within(ch))){ before=ch; break; }
  }
  c.el.insertBefore(el,before);
}
function addPaper(level,key,label,grp){
  const c=ensureCol(level,label);
  if(c.keys.has(key)) return;          // de-dup by citekey (accumulate) — and the FIRST group to
  c.keys.add(key);                     // ask for a card keeps it; a later one only adds an edge
  const card=paperCard(key,level);
  if(level===0){ c.el.appendChild(card); return; }   // landing keeps its pass ranking
  const yr=+card.dataset.year||0;      // within a group, chronology falls out of the grounding walk
  placeInCol(c,card,grp==null?BACKFILL:grp,ch=>(+ch.dataset.year||0)<yr);
}
function addBroad(level,slug,label,grp){
  const c=ensureCol(level,label);
  if(c.keys.has(slug)) return;
  c.keys.add(slug);
  // no second key inside a group: claims arrive in the order the open paper cites them, and the
  // backfill in the ladder's own walk order, both of which are already the order to show them in
  placeInCol(c,broadCard(slug,level),grp==null?BACKFILL:grp,()=>false);
}
// The synthesis band always shows every broad claim / question, expanded state or not —
// they're the standing right-hand column. expandCard still adds the ones linked from an
// open paper (with real edges); this backfills the rest (deduped), so the band is complete
// on the landing view and survives every rebuild. Unlinked-yet nodes stay hover-active
// (broadExtraEdges lights their papers) like any other broad node.
function ensureBroadBand(){
  // Only the revealed rungs — see visibleBroad. expandCard still materializes any broad node an
  // OPEN paper points at, whether or not the ladder reveals it: a real edge from a card the
  // human opened outranks the collapse, same as reveal() outranking a folded card.
  for(const slug of visibleBroad())
    addBroad(broadLevel(slug),slug,synthLabel(broadTier[slug]||0));
  // The broad-to-broad half of `leads-to` (SCHEMA §4): a node's own generalization into a
  // broader one, one rung up the same ladder its slices climb into it from below. Drawn like
  // that in-paper ladder (kind:"gen", the --broad idiom), not a lateral or stance edge — and
  // added here, not in expandCard, so it stands whether or not any paper is open: the whole
  // point is that the band reads as one rightward structure, not four unrelated columns.
  // …but only between rungs that are actually on screen: a collapsed child has no card for the
  // arrow to land on, and addEdge would anchor it on nothing.
  const here=slug=>{ const c=cols[broadLevel(slug)]; return c&&c.keys.has(slug); };
  for(const [slug,b] of Object.entries(BROAD))
    for(const r of (b.leads_to||[]))
      if(BROAD[r]&&here(slug)&&here(r))
        addEdge({cardId:`card-${broadLevel(slug)}:${slug}`,sid:null},
                {cardId:`card-${broadLevel(r)}:${r}`,sid:null},"gen");
}
// Citation-wall collapse: a focused paper's UNCURATED sources never spawn cards — they fold
// into one "▸ N sources" stack per focused card, expandable on demand and ONLY on demand
// (reveal()/rebuild() never unfold it, so it stays collapsed under any programmatic
// expansion). Rows carry data-sid=<citekey>, so a wall edge sharpens from the stack card to
// its source row the moment the stack is unfolded. Returns the stack element id.
function addStack(level,owner,wall,label,grp){
  const c=ensureCol(level,label);
  const key=owner+"::srcs", id=`${level}:${key}`, eid="card-"+id;
  if(c.keys.has(key)) return eid;
  c.keys.add(key);
  const srcs=[...new Set(wall.map(g=>g.key))]
    .map(k=>({k,p:STUBS[k]||{}}))
    .sort((a,b)=>(b.p.year||0)-(a.p.year||0));
  const el=document.createElement("div");
  el.className="card stack"+(stacks.has(id)?" open":"");
  el.id=eid; el.dataset.id=id;
  el.dataset.year=srcs.length?(srcs[0].p.year||0):0;   // sorts by its newest source
  el.innerHTML=`<div class="chd"><span class="car">${stacks.has(id)?"▾":"▸"}</span>`
    +`<span class="ckey">${srcs.length} source${srcs.length===1?"":"s"}</span></div>`
    +`<div class="srcs">`+srcs.map(s=>
      `<div class="src" data-sid="${s.k}"><span class="skey">${s.k}</span>`
      +`<span class="sy">${s.p.year||""}</span></div>`).join("")+`</div>`;
  el.addEventListener("click",()=>{
    if(stacks.has(id)) stacks.delete(id); else stacks.add(id);
    el.classList.toggle("open",stacks.has(id));
    el.querySelector(".car").textContent=stacks.has(id)?"▾":"▸";
    redraw();                                          // anchors move; edges re-route
  });
  for(const row of el.querySelectorAll(".src")){
    row.addEventListener("mousemove",e=>showTip(e,row.dataset.sid,row));
    row.addEventListener("mouseleave",dropTip);
  }
  const yr=+el.dataset.year||0;                        // grouped then year-sorted, same rule as cards
  placeInCol(c,el,grp==null?BACKFILL:grp,ch=>(+ch.dataset.year||0)<yr);
  return eid;
}

const edgeSeen=new Set();
// each endpoint is {cardId, sid}: it anchors at sid's row when visible, else at the card.
// `intra` marks an edge whose two ends are rows in the SAME card — the paper's own subgraph.
// It only changes the geometry (redraw bows it into the card's left gutter instead of reaching
// for a facing edge that isn't there); everything else about an edge is the same either way.
function addEdge(from,to,kind,intra){      // de-dup: rebuilds must not stack duplicate paths
  const k=`${from.cardId}:${from.sid}|${to.cardId}:${to.sid}|${kind}`;
  if(edgeSeen.has(k)) return;
  edgeSeen.add(k); edges.push({from,to,kind,intra:!!intra});
}

// Recompute every spawned column + edge from the open set (non-exclusive: opening one
// paper never tears down another). An open card at level L pours its grounds into L-1 and
// the papers that build on it into L+1; if a spawned card is opened too, the sweep drills
// it in turn — cross-paper expansion is iterative, one generation per click. Expansion
// runs both directions, so the sweep iterates to a fixpoint instead of walking one way.
function rebuild(){
  // The landing column is a fixed anchor: content expands out from it (grounds ←, builds →)
  // without it sliding sideways. Capture its screen-x before the DOM churns, restore it after
  // by compensating scrollLeft for whatever columns were inserted/removed to its left.
  const anchorEl=cols[0]&&cols[0].el;
  const beforeLeft=anchorEl?anchorEl.getBoundingClientRect().left:0;
  Object.keys(cols).map(Number).forEach(lvl=>{
    if(lvl!==0){ cols[lvl].el.remove(); delete cols[lvl]; return; }
    for(const k of [...cols[0].keys]){          // stacks are rebuild-scoped; the landing
      if(!k.endsWith("::srcs")) continue;       // column persists, so evict its stacks
      cols[0].keys.delete(k);
      const el=document.getElementById(`card-0:${k}`); if(el) el.remove();
    }
  });
  edges=[]; edgeSeen.clear(); hover=null; unpinned=null;   // rows re-render; next mousemove re-isolates (docked viewer rests)
  broadTier=computeBroadTiers();     // fresh before anything below places a broad card by it
  pruneShown();                      // …and before syncLanding, so a claim folded away with its
                                     // parent stops asking for papers in the same pass
  syncLanding();                     // before the expansion sweep below reads cols[0].keys
  document.querySelectorAll(".card.open,.card.focus").forEach(c=>c.classList.remove("open","focus"));
  ctxOpen=new Set(); ctxDrill=new Map();
  // The sweep walks `open` in the order you OPENED things, not in column order, because that index
  // is the group every spawned card inherits (placeInCol): open a second paper and its grounds
  // stack below the first paper's instead of interleaving by year. `open` is a Set, so it is
  // already insertion-ordered, and a card closed and reopened rightly counts as a fresh arrival.
  // Still a fixpoint loop rather than a straight walk — a card at level 2 has no column to live in
  // until the level-1 card that spawns it has expanded — but the group comes from the index, so a
  // late unlock still lands in the block belonging to its own click.
  const seq=[...open], done=new Set();
  let changed=true;
  while(changed){
    changed=false;
    seq.forEach((id,grp)=>{
      if(done.has(id)) return;
      const i=id.indexOf(":"), lvl=+id.slice(0,i), key=id.slice(i+1);
      if(lvl>=SYNTH||!PAPERS[key]||!cols[lvl]||!cols[lvl].keys.has(key)) return;
      done.add(id); expandCard(lvl,key,PAPERS[key],grp); changed=true;
    });
  }
  ensureBroadBand();                                 // keep the full synthesis band standing
  // apply visual state + drill regions for focused and context-opened cards
  for(const id of new Set([...open,...ctxOpen])){
    const el=document.getElementById("card-"+id);
    if(!el||!PAPERS[id.slice(id.indexOf(":")+1)]) continue;
    el.classList.add("open");
    if(open.has(id)) el.classList.add("focus");      // ctx-only cards: revealed, not focused
    renderSlices(id);
  }
  // A claim's brightness is DERIVED from whether it is shown, never pinned independently: that is
  // the merge (see showBroad). Deriving rather than toggling is what makes it impossible for the
  // arrows and the papers column to disagree about which claims you are looking at.
  pin=pin.filter(p=>cardIdLevel(p.cardId)<SYNTH);
  for(const slug of shownBroad){
    const cardId=`card-${broadLevel(slug)}:${slug}`;
    if(document.getElementById(cardId)) pin.push({cardId,sid:null});
  }
  hoistShown();                                       // blocks in the order they were shown
  if(anchorEl){                                       // hold the anchor column visually still
    board.scrollLeft+=anchorEl.getBoundingClientRect().left-beforeLeft;
  }
  redraw();
}

// Where does `key` already sit? Prefer the instance nearest `near`; every paper the graph can
// point at is in the landing column (landingKeys keeps the referenced stubs), so level 0 is the
// guaranteed fallback. Callers that could still miss check for the element before using it.
function findCardLevel(key,near){
  let best=null;
  for(const lvl of Object.keys(cols).map(Number)){
    if(lvl>=SYNTH||!cols[lvl].keys.has(key)) continue;
    if(best===null||Math.abs(lvl-near)<Math.abs(best-near)) best=lvl;
  }
  return best===null?0:best;
}

// `grp` is which click this expansion belongs to; everything it spawns is stamped with it, so the
// cards land in one contiguous block per opened card rather than mixed in by year. See placeInCol.
function expandCard(level,key,p,grp){
  const cid=`card-${level}:${key}`;
  // LEFT — grounds spawn the previous generation. Curated sources get their own card; a
  // sharpened ref (tid) reveals the specific source slice there and anchors the edge on
  // it. Uncurated sources fold into one collapsed "▸ N sources" stack (citation-wall
  // collapse) — their edges anchor on the stack until the human unfolds it.
  const wall=[];
  (p.grounds||[]).forEach(g=>{
    if(!PAPERS[g.key]){ wall.push(g); return; }
    addPaper(level-1,g.key,"grounds ←",grp);
    if(g.tid) reveal(`${level-1}:${g.key}`,g.tid);
    addEdge({cardId:`card-${level-1}:${g.key}`,sid:g.tid||null},{cardId:cid,sid:g.via},"leads");
  });
  if(wall.length){
    const sid=addStack(level-1,key,wall,"grounds ←",grp);
    wall.forEach(g=>addEdge({cardId:sid,sid:g.key},{cardId:cid,sid:g.via},"leads"));
  }
  // LATERAL — never spawns a column: connect to the target wherever it already sits,
  // revealing the specific claim when the ref is sharpened (Kumar → Chen2021Sys:c1).
  (p.lateral||[]).forEach(l=>{
    const from={cardId:cid,sid:l.via};
    if(l.slug){                                      // stance toward a broad claim → synthesis band
      addBroad(broadLevel(l.slug),l.slug,synthLabel(broadTier[l.slug]||0),grp);
      addEdge(from,{cardId:`card-${broadLevel(l.slug)}:${l.slug}`,sid:null},l.sign);
      return;
    }
    const tl=findCardLevel(l.key,level);
    if(l.tid&&PAPERS[l.key]) reveal(`${tl}:${l.key}`,l.tid);
    addEdge(from,{cardId:`card-${tl}:${l.key}`,sid:l.tid||null},l.sign);
  });
  // ANSWERS — cross-paper claim→question: like lateral, never spawns a column. The target
  // question is context-revealed (an entry row, so opening its card suffices) and the
  // edge anchors on it; a broad-question target routes to the synthesis band.
  (p.ans||[]).forEach(a=>{
    const from={cardId:cid,sid:a.via};
    if(a.slug){
      addBroad(broadLevel(a.slug),a.slug,synthLabel(broadTier[a.slug]||0),grp);
      addEdge(from,{cardId:`card-${broadLevel(a.slug)}:${a.slug}`,sid:null},"answers");
      return;
    }
    const tl=findCardLevel(a.key,level);
    if(a.tid&&PAPERS[a.key]) reveal(`${tl}:${a.key}`,a.tid);
    addEdge(from,{cardId:`card-${tl}:${a.key}`,sid:a.tid||null},"answers");
  });
  // RIGHT — the papers that build on this one (inverted grounds) spawn the next
  // generation rightward; the edge runs ground→derived and sharpens as either side's
  // rows are drilled (b.tid = this paper's grounded slice, b.via = the building slice).
  (p.builds||[]).forEach(b=>{
    addPaper(level+1,b.key,"builds on →",grp);
    addEdge({cardId:cid,sid:b.tid||null},{cardId:`card-${level+1}:${b.key}`,sid:b.via},"leads");
  });
  // RIGHTMOST — synthesis band; the edge sharpens to the generalizing claim once it's drilled
  (p.cons||[]).forEach(c=>{
    addBroad(broadLevel(c.slug),c.slug,synthLabel(broadTier[c.slug]||0),grp);
    addEdge({cardId:cid,sid:c.via},{cardId:`card-${broadLevel(c.slug)}:${c.slug}`,sid:null},"leads");
  });
}

// Context-reveal a sharpened target: open its card and force-expand the drill path from
// an entry row down to `sid` (climbing the local outline parents — the slice's dependents
// via `up`, or the broader claim it ladders into via `gen`), so the exact slice is on
// screen. If the target is itself an entry row, opening the card suffices.
function reveal(id,sid){
  ctxOpen.add(id);
  const p=PAPERS[id.slice(id.indexOf(":")+1)];
  if(!p) return;
  // A paper's card renders every slice, so opening it IS the reveal — there is no path to
  // force. Only an aim's outline still hides a slice behind a fold.
  if(!p.aim&&!p.cited) return;
  const dep={};
  p.slices.forEach(s=>{
    (s.up||[]).forEach(u=>{ (dep[u]=dep[u]||[]).push(s.id); });
    (s.gen||[]).forEach(g=>{ (dep[s.id]=dep[s.id]||[]).push(g); });
  });
  const chain=[sid];
  let cur=sid, guard=0;
  while(dep[cur]&&dep[cur].length&&guard++<64){ cur=dep[cur][0]; chain.push(cur); }
  chain.reverse();                                   // entry row … target
  let s=ctxDrill.get(id);
  if(!s){ s=new Set(); ctxDrill.set(id,s); }
  let path="";
  for(let i=0;i<chain.length-1;i++){                 // expand every row above the target
    path=path?`${path}/${chain[i]}`:chain[i];
    s.add(path);
  }
}

// ── edges ──────────────────────────────────────────────────────────────────────────────
// The slug of the isolated broad node (an active broad target carries sid===null), else null.
function broadIsoSlug(iso){
  if(!iso||iso.sid!==null) return null;
  const el=document.getElementById(iso.cardId);
  if(!el||!el.classList.contains("bn")) return null;
  const id=el.dataset.id||"";
  return id.slice(id.indexOf(":")+1)||null;
}
// Isolated broad node: synthesize an edge to every linked paper NOT already wired to this node
// by a real (expanded-paper) edge, anchored on its card wherever it sits — so collapsed
// landing-column papers light up and connect too, not just the expanded ones.
function broadExtraEdges(iso,slug){
  const have=new Set();
  for(const e of edges){
    const other=e.to.cardId===iso.cardId?e.from:(e.from.cardId===iso.cardId?e.to:null);
    if(other){ const oc=document.getElementById(other.cardId); if(oc&&oc.dataset.key) have.add(oc.dataset.key); }
  }
  const extra=[];
  for(const lk of (BROAD_LINKS[slug]||[])){
    if(have.has(lk.key)) continue;
    have.add(lk.key);                              // one arrow per paper, even if several slices feed the node
    const cardId=`card-${findCardLevel(lk.key,0)}:${lk.key}`;
    if(document.getElementById(cardId))
      extra.push({from:{cardId,sid:null},to:{cardId:iso.cardId,sid:null},kind:lk.kind});
  }
  return extra;
}
// Strictly two-phase: every layout READ happens before every DOM WRITE.
//
// This used to be one loop that measured an endpoint, then set .hl on a card, then measured the
// next endpoint — and each write invalidates layout, so each following read forces the browser to
// re-lay-out the whole board synchronously. With ~3.7k cards in the landing column that penalty
// was measured at 192x (1 µs for a clean getBoundingClientRect, 192 µs for one straight after a
// class write), paid once per edge. Splitting the phases means at most ONE relayout per redraw
// instead of one per edge, which is what made pinning a broad claim feel slow.
function redraw(){
  // Isolation: the bright set is every pinned target (persisted, accumulating) ∪ the current
  // hover (transient). An edge incident on any target is drawn bright and its counterpart card
  // gets .hl; every other edge stays dim — faint scaffolding rather than a bright tangle.
  pin=pin.filter(p=>document.getElementById(p.cardId));       // drop pins whose card is gone
  // deduped: the pointer usually rests on the target it just pinned, and a target counted twice
  // made broadExtraEdges synthesize its arrows twice — identical paths stacked on each other
  const all=hover?[...pin,hover]:pin;
  const targets=all.filter((t,i)=>all.findIndex(o=>samePin(o,t))===i);
  const atT=(end,t)=>end.cardId===t.cardId&&end.sid===t.sid;
  const isTarget=end=>targets.some(t=>atT(end,t));
  const inc=e=>targets.some(t=>atT(e.from,t)||atT(e.to,t));   // incident on any target
  let work=edges.slice();
  for(const t of targets){                                    // broad target → connect collapsed papers too
    const slug=broadIsoSlug(t);
    if(slug) work=work.concat(broadExtraEdges(t,slug));
  }
  work.sort((a,b)=>(inc(a)?1:0)-(inc(b)?1:0));     // draw incident (bright) last → on top of dim

  // ── phase 1: read ──────────────────────────────────────────────────────────────────────
  // Nothing here may touch the DOM, so the browser answers every measurement from one layout.
  const bb=board.getBoundingClientRect();
  // Size the overlay from the COLUMNS, not from board.scrollWidth/scrollHeight. #edges is an
  // absolutely-positioned child of #board, so it contributes to the board's own scroll extent —
  // measuring the board to size the SVG fed the SVG's height back into the number that sets it,
  // a ratchet that could only grow. Once the landing column made the board ~187k px tall at boot
  // it stayed that tall forever, even when the content collapsed to a few hundred px, leaving a
  // vast empty scroll region and making every forced relayout far more expensive than the visible
  // content warranted. Columns share the SVG's origin (#board is the offsetParent), so their
  // extent is the right measure and reading it costs no extra layout.
  let W=0,H=0;
  for(const lvl of Object.keys(cols)){
    const el=cols[lvl].el;
    W=Math.max(W,el.offsetLeft+el.offsetWidth); H=Math.max(H,el.offsetTop+el.offsetHeight);
  }
  W=Math.max(W,board.clientWidth); H=Math.max(H,board.clientHeight);   // always cover the viewport
  const sTop=board.scrollTop, sLeft=board.scrollLeft;
  const stroke={grounded:cssv('--grounded'),cross:cssv('--cross'),question:cssv('--question'),
               broad:cssv('--broad')};
  const plan=[];
  for(const e of work){
    const ra=anchorRect(e.from), rb=anchorRect(e.to);
    if(!ra||!rb) continue;                          // no visible endpoint yet
    // Both ends name a specific slice but neither is on screen (e.g. a source→method grounding
    // while the sources stack is collapsed and methods aren't entry rows): the edge has no row
    // to land on, so both ends fall back to their card and it collapses onto the identical
    // container→container line — piling up with its siblings into one opaque, never-dimming
    // arrow at the card border. Skip it until a drill reveals a row for it to sharpen onto.
    if(e.from.sid && e.to.sid && !rowVisible(e.from) && !rowVisible(e.to)) continue;
    // A card's own columns scroll sideways inside it, and this SVG spans the whole board with
    // no per-card clip — so an arc to a node scrolled out of its card would be drawn straight
    // across the card's neighbours. The card's own box is the clip region.
    if(e.intra&&!inCard(e.from.cardId,ra,rb)) continue;
    plan.push({e,ra,rb,on:inc(e)});
  }

  // ── phase 2: write ─────────────────────────────────────────────────────────────────────
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const defs=document.createElementNS(NS,"defs");   // arrowheads
  defs.innerHTML=`
    <marker id="ar" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.grounded}"/></marker>
    <marker id="arx" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.cross}"/></marker>
    <marker id="arq" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.question}"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.broad}"/></marker>`;
  const frag=document.createDocumentFragment();
  frag.appendChild(defs);
  // .hl is recomputed as a set difference so a card that stays lit is never touched — a no-op
  // hover (the common case while the pointer drifts inside one card) writes nothing at all.
  const lit=new Set();
  for(const {e,on} of plan){
    if(!on) continue;                               // light up each non-target endpoint's card
    for(const end of [e.from,e.to]) if(!isTarget(end)) lit.add(end.cardId);
  }
  for(const el of document.querySelectorAll(".hl"))
    if(!lit.has(el.id)) el.classList.remove("hl"); else lit.delete(el.id);
  for(const id of lit){ const oc=document.getElementById(id); if(oc) oc.classList.add("hl"); }

  for(const {e,ra,rb,on} of plan){
    const ya=(ra.top+ra.bottom)/2-bb.top+sTop;
    const yb=(rb.top+rb.bottom)/2-bb.top+sTop;
    const contra=e.kind==="contra"||e.kind==="contradict";
    const ans=e.kind==="answers";
    const lat=e.kind==="corr"||contra;
    const gen=e.kind==="gen";           // broad->broad generalization (SCHEMA §4) — its own
                                        // color/marker, solid like a support edge, never lateral
    let d;
    if(e.intra){
      // Within one card the two nodes are in adjacent-or-further columns, so this is the facing-
      // edge case — but always, never by the width test below: folding the card shrinks the
      // columns to badge width and that test would then mistake a real ladder rung for a
      // same-column hop and bow it out the right of the card.
      const x1=ra.right-bb.left+sLeft, x2=rb.left-bb.left+sLeft;
      const mx=(x1+x2)/2;
      d=`M${x1},${ya} C${mx},${ya} ${mx},${yb} ${x2},${yb}`;
    } else if(Math.abs((ra.left+ra.right)-(rb.left+rb.right))<80){
      // same column (e.g. a lateral edge between two landing cards): bow out the right side
      const x1=ra.right-bb.left+sLeft, x2=rb.right-bb.left+sLeft;
      const bow=Math.max(x1,x2)+26;
      d=`M${x1},${ya} C${bow},${ya} ${bow},${yb} ${x2},${yb}`;
    } else {                                          // cross-paper: connect the facing edges
      const aLeft=(ra.left+ra.right)/2 < (rb.left+rb.right)/2;
      const x1=(aLeft?ra.right:ra.left)-bb.left+sLeft;
      const x2=(aLeft?rb.left:rb.right)-bb.left+sLeft;
