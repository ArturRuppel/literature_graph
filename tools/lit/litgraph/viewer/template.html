    });
  }
  ensureBroadBand();                                 // keep the full synthesis band standing
  // apply visual state + drill regions for focused and context-opened cards
  for(const id of new Set([...open,...ctxOpen])){
    const el=document.getElementById("card-"+id);
    if(!el||!PAPERS[id.slice(id.indexOf(":")+1)]) continue;
    el.classList.add("open");
    if(open.has(id)) el.classList.add("focus");      // ctx-only cards: revealed, not focused
    renderSlices(id);
  }
  // A claim's brightness is DERIVED from whether it is shown, never pinned independently: that is
  // the merge (see showBroad). Deriving rather than toggling is what makes it impossible for the
  // arrows and the papers column to disagree about which claims you are looking at.
  pin=pin.filter(p=>cardIdLevel(p.cardId)<SYNTH);
  for(const slug of shownBroad){
    const cardId=`card-${SYNTH}:${slug}`;
    if(document.getElementById(cardId)) pin.push({cardId,sid:null});
  }
  hoistShown();                                       // blocks in the order they were shown
  if(anchorEl){                                       // hold the anchor column visually still
    board.scrollLeft+=anchorEl.getBoundingClientRect().left-beforeLeft;
  }
  if(beforeTop!=null){                                // …and the clicked card at its own height
    const el=document.getElementById("card-"+hold);
    if(el) board.scrollTop+=el.getBoundingClientRect().top-beforeTop;
  }
  redraw();
}

// Where does `key` already sit? Prefer the instance nearest `near`; every paper the graph can
// point at is in the landing column (landingKeys keeps the referenced stubs), so level 0 is the
// guaranteed fallback. Callers that could still miss check for the element before using it.
function findCardLevel(key,near){
  let best=null;
  for(const lvl of Object.keys(cols).map(Number)){
    if(lvl>=SYNTH||!cols[lvl].keys.has(key)) continue;
    if(best===null||Math.abs(lvl-near)<Math.abs(best-near)) best=lvl;
  }
  return best===null?0:best;
}

// `grp` is which click this expansion belongs to; everything it spawns is stamped with it, so the
// cards land in one contiguous block per opened card rather than mixed in by year. See placeInCol.
function expandCard(level,key,p,grp){
  const cid=`card-${level}:${key}`;
  // LEFT — grounds spawn the previous generation. Curated sources get their own card; a
  // sharpened ref (tid) reveals the specific source slice there and anchors the edge on
  // it. Uncurated sources fold into one collapsed "▸ N sources" stack (citation-wall
  // collapse) — their edges anchor on the stack until the human unfolds it.
  const wall=[];
  (p.grounds||[]).forEach(g=>{
    if(!PAPERS[g.key]){ wall.push(g); return; }
    addPaper(level-1,g.key,"grounds ←",grp);
    if(g.tid) reveal(`${level-1}:${g.key}`,g.tid);
    addEdge({cardId:`card-${level-1}:${g.key}`,sid:g.tid||null},{cardId:cid,sid:g.via},"leads");
  });
  if(wall.length){
    const sid=addStack(level-1,key,wall,"grounds ←",grp);
    wall.forEach(g=>addEdge({cardId:sid,sid:g.key},{cardId:cid,sid:g.via},"leads"));
  }
  // LATERAL — never spawns a column: connect to the target wherever it already sits,
  // revealing the specific claim when the ref is sharpened (Kumar → Chen2021Sys:c1).
  (p.lateral||[]).forEach(l=>{
    const from={cardId:cid,sid:l.via};
    if(l.slug){                                      // stance toward a broad claim → synthesis band
      addBroad(SYNTH,l.slug,synthLabel(),grp);
      addEdge(from,{cardId:`card-${SYNTH}:${l.slug}`,sid:null},l.sign);
      return;
    }
    const tl=findCardLevel(l.key,level);
    if(l.tid&&PAPERS[l.key]) reveal(`${tl}:${l.key}`,l.tid);
    addEdge(from,{cardId:`card-${tl}:${l.key}`,sid:l.tid||null},l.sign);
  });
  // ANSWERS — cross-paper claim→question: like lateral, never spawns a column. The target
  // question is context-revealed (an entry row, so opening its card suffices) and the
  // edge anchors on it; a broad-question target routes to the synthesis band.
  (p.ans||[]).forEach(a=>{
    const from={cardId:cid,sid:a.via};
    if(a.slug){
      addBroad(SYNTH,a.slug,synthLabel(),grp);
      addEdge(from,{cardId:`card-${SYNTH}:${a.slug}`,sid:null},"answers");
      return;
    }
    const tl=findCardLevel(a.key,level);
    if(a.tid&&PAPERS[a.key]) reveal(`${tl}:${a.key}`,a.tid);
    addEdge(from,{cardId:`card-${tl}:${a.key}`,sid:a.tid||null},"answers");
  });
  // RIGHT — the papers that build on this one (inverted grounds) spawn the next
  // generation rightward; the edge runs ground→derived and sharpens as either side's
  // rows are drilled (b.tid = this paper's grounded slice, b.via = the building slice).
  (p.builds||[]).forEach(b=>{
    addPaper(level+1,b.key,"builds on →",grp);
    addEdge({cardId:cid,sid:b.tid||null},{cardId:`card-${level+1}:${b.key}`,sid:b.via},"leads");
  });
  // RIGHTMOST — synthesis band; the edge sharpens to the generalizing claim once it's drilled
  (p.cons||[]).forEach(c=>{
    addBroad(SYNTH,c.slug,synthLabel(),grp);
    addEdge({cardId:cid,sid:c.via},{cardId:`card-${SYNTH}:${c.slug}`,sid:null},"leads");
  });
}

// Context-reveal a sharpened target: open its card and force-expand the drill path from
// an entry row down to `sid` (climbing the local outline parents — the slice's dependents
// via `up`, or the broader claim it ladders into via `gen`), so the exact slice is on
// screen. If the target is itself an entry row, opening the card suffices.
function reveal(id,sid){
  ctxOpen.add(id);
  const p=PAPERS[id.slice(id.indexOf(":")+1)];
  if(!p) return;
  // A paper's card renders every slice, so opening it IS the reveal — there is no path to
  // force. Only an aim's outline still hides a slice behind a fold.
  if(!p.aim&&!p.cited) return;
  const dep={};
  p.slices.forEach(s=>{
    (s.up||[]).forEach(u=>{ (dep[u]=dep[u]||[]).push(s.id); });
    (s.gen||[]).forEach(g=>{ (dep[s.id]=dep[s.id]||[]).push(g); });
  });
  const chain=[sid];
  let cur=sid, guard=0;
  while(dep[cur]&&dep[cur].length&&guard++<64){ cur=dep[cur][0]; chain.push(cur); }
  chain.reverse();                                   // entry row … target
  let s=ctxDrill.get(id);
  if(!s){ s=new Set(); ctxDrill.set(id,s); }
  let path="";
  for(let i=0;i<chain.length-1;i++){                 // expand every row above the target
    path=path?`${path}/${chain[i]}`:chain[i];
    s.add(path);
  }
}

// ── edges ──────────────────────────────────────────────────────────────────────────────
// The slug of the isolated broad node (an active broad target carries sid===null), else null.
function broadIsoSlug(iso){
  if(!iso||iso.sid!==null) return null;
  const el=document.getElementById(iso.cardId);
  if(!el||!el.classList.contains("bn")) return null;
  const id=el.dataset.id||"";
  return id.slice(id.indexOf(":")+1)||null;
}
// Does this endpoint sit on a broad node? Read off the card id (`card-<level>:<key>`) rather
// than the DOM — the synthesis band owns every level at/after SYNTH, and this is asked once per
// edge inside redraw's read phase, where a lookup would be a lookup too many.
function isBroadEnd(end){
  const i=end.cardId.indexOf(":");
  return i>0&&+end.cardId.slice(5,i)>=SYNTH;
}
// Isolated broad node: synthesize an edge to every linked paper NOT already wired to this node
// by a real (expanded-paper) edge, anchored on its card wherever it sits — so collapsed
// landing-column papers light up and connect too, not just the expanded ones.
function broadExtraEdges(iso,slug){
  const have=new Set();
  for(const e of edges){
    const other=e.to.cardId===iso.cardId?e.from:(e.from.cardId===iso.cardId?e.to:null);
    if(other){ const oc=document.getElementById(other.cardId); if(oc&&oc.dataset.key) have.add(oc.dataset.key); }
  }
  const extra=[];
  for(const lk of (BROAD_LINKS[slug]||[])){
    if(have.has(lk.key)) continue;
    have.add(lk.key);                              // one arrow per paper, even if several slices feed the node
    const cardId=`card-${findCardLevel(lk.key,0)}:${lk.key}`;
    if(document.getElementById(cardId))
      extra.push({from:{cardId,sid:null},to:{cardId:iso.cardId,sid:null},kind:lk.kind});
  }
  return extra;
}
// Strictly two-phase: every layout READ happens before every DOM WRITE.
//
// This used to be one loop that measured an endpoint, then set .hl on a card, then measured the
// next endpoint — and each write invalidates layout, so each following read forces the browser to
// re-lay-out the whole board synchronously. With ~3.7k cards in the landing column that penalty
// was measured at 192x (1 µs for a clean getBoundingClientRect, 192 µs for one straight after a
// class write), paid once per edge. Splitting the phases means at most ONE relayout per redraw
// instead of one per edge, which is what made pinning a broad claim feel slow.
function redraw(){
  // Isolation: the bright set is every pinned target (persisted, accumulating) ∪ the current
  // hover (transient). An edge incident on any target is drawn bright and its counterpart card
  // gets .hl; every other edge stays dim — faint scaffolding rather than a bright tangle.
  pin=pin.filter(p=>document.getElementById(p.cardId));       // drop pins whose card is gone
  // deduped: the pointer usually rests on the target it just pinned, and a target counted twice
  // made broadExtraEdges synthesize its arrows twice — identical paths stacked on each other
  const all=hover?[...pin,hover]:pin;
  const targets=all.filter((t,i)=>all.findIndex(o=>samePin(o,t))===i);
  const atT=(end,t)=>end.cardId===t.cardId&&end.sid===t.sid;
  const isTarget=end=>targets.some(t=>atT(end,t));
  const inc=e=>targets.some(t=>atT(e.from,t)||atT(e.to,t));   // incident on any target
  let work=edges.slice();
  for(const t of targets){                                    // broad target → connect collapsed papers too
    const slug=broadIsoSlug(t);
    if(slug) work=work.concat(broadExtraEdges(t,slug));
  }
  work.sort((a,b)=>(inc(a)?1:0)-(inc(b)?1:0));     // draw incident (bright) last → on top of dim

  // ── phase 1: read ──────────────────────────────────────────────────────────────────────
  // Nothing here may touch the DOM, so the browser answers every measurement from one layout.
  // Everything below is in STAGE coordinates — the unzoomed space the columns and this overlay
  // are laid out in — because that is the space the SVG paints in and the space the zoom
  // transform then scales as a whole. Rects come back from the browser in viewport (glass)
  // pixels, so BZ divides them back down; offsets are already stage-space and don't.
  const BZ=boardZoom();
  const sb=stage.getBoundingClientRect();         // stage origin on the glass (scroll folded in)
  const X=v=>(v-sb.left)/BZ, Y=v=>(v-sb.top)/BZ;
  // Size the overlay from the COLUMNS, not from board.scrollWidth/scrollHeight. #edges is an
  // absolutely-positioned child of #stage, so it contributes to the board's own scroll extent —
  // measuring the board to size the SVG fed the SVG's height back into the number that sets it,
  // a ratchet that could only grow. Once the landing column made the board ~187k px tall at boot
  // it stayed that tall forever, even when the content collapsed to a few hundred px, leaving a
  // vast empty scroll region and making every forced relayout far more expensive than the visible
  // content warranted. Columns share the SVG's origin (#stage is the offsetParent), so their
  // extent is the right measure and reading it costs no extra layout.
  let W=0,H=0;
  for(const lvl of Object.keys(cols)){
    const el=cols[lvl].el;
    W=Math.max(W,el.offsetLeft+el.offsetWidth); H=Math.max(H,el.offsetTop+el.offsetHeight);
  }
  // always cover the viewport — which, zoomed out, is MORE stage than the port is wide
  W=Math.max(W,board.clientWidth/BZ); H=Math.max(H,board.clientHeight/BZ);
  const stroke={grounded:cssv('--grounded'),cross:cssv('--cross'),question:cssv('--question'),
               broad:cssv('--broad')};
  const plan=[];
  for(const e of work){
    const on=inc(e);
    // The synthesis band is the one place where dim scaffolding stops being scaffolding. Every
    // paper that reaches a broad claim throws an arrow clear across the board, and the band
    // collects all of them — a permanent fan over every column that said only "many things
    // generalize", which you knew. So an edge touching a broad node is drawn ONLY while that node
    // (or the slice at the other end) is isolated: hover or click it and its fan appears alone,
    // which is the question you actually had. Broad-to-broad rungs go with them — same rule, one
    // rule, and the band's own ladder is one click away.
    if(!on&&(isBroadEnd(e.from)||isBroadEnd(e.to))) continue;
    // `rowRect` is the row's rect CLIPPED to the boxes that actually clip it, and null once
    // nothing is left — so an endpoint scrolled out of the card's sideways-scrolling slice graph
    // falls back to its card here rather than anchoring where only the layout can see it.
    const fa=rowRect(e.from), fb=rowRect(e.to);
    const ra=fa||cardRect(e.from), rb=fb||cardRect(e.to);
    if(!ra||!rb) continue;                          // no visible endpoint yet
    // Both ends name a specific slice but neither is on screen (e.g. a source→method grounding
    // while the sources stack is collapsed and methods aren't entry rows): the edge has no row
    // to land on, so both ends fall back to their card and it collapses onto the identical
    // container→container line — piling up with its siblings into one opaque, never-dimming
    // arrow at the card border. Skip it until a drill reveals a row for it to sharpen onto.
    if(e.from.sid && e.to.sid && !fa && !fb) continue;
    // A card's own columns scroll sideways inside it, and this SVG spans the whole board with
    // no per-card clip — so an arc to a node scrolled out of its card would be drawn straight
    // across the card's neighbours. An intra-card rung is only meaningful while BOTH its nodes
    // are on screen; the moment one scrolls out there is nothing honest left to draw.
    if(e.intra&&!(fa&&fb)) continue;
    plan.push({e,ra,rb,on});
  }

  // ── phase 2: write ─────────────────────────────────────────────────────────────────────
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const defs=document.createElementNS(NS,"defs");   // arrowheads
  defs.innerHTML=`
    <marker id="ar" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.grounded}"/></marker>
    <marker id="arx" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.cross}"/></marker>
    <marker id="arq" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.question}"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${stroke.broad}"/></marker>`;
  const frag=document.createDocumentFragment();
  frag.appendChild(defs);
  // .hl is recomputed as a set difference so a card that stays lit is never touched — a no-op
  // hover (the common case while the pointer drifts inside one card) writes nothing at all.
  const lit=new Set();
  for(const {e,on} of plan){
    if(!on) continue;                               // light up each non-target endpoint's card
    for(const end of [e.from,e.to]) if(!isTarget(end)) lit.add(end.cardId);
  }
  for(const el of document.querySelectorAll(".hl"))
    if(!lit.has(el.id)) el.classList.remove("hl"); else lit.delete(el.id);
  for(const id of lit){ const oc=document.getElementById(id); if(oc) oc.classList.add("hl"); }

  for(const {e,ra,rb,on} of plan){
    const ya=Y((ra.top+ra.bottom)/2);
    const yb=Y((rb.top+rb.bottom)/2);
    const contra=e.kind==="contra"||e.kind==="contradict";
    const ans=e.kind==="answers";
    const lat=e.kind==="corr"||contra;
    const gen=e.kind==="gen";           // broad->broad generalization (SCHEMA §4) — its own
                                        // color/marker, solid like a support edge, never lateral
    let d;
    if(e.intra){
      // Within one card the two nodes are in adjacent-or-further columns, so this is the facing-
      // edge case — but always, never by the width test below: folding the card shrinks the
      // columns to badge width and that test would then mistake a real ladder rung for a
      // same-column hop and bow it out the right of the card.
      const x1=X(ra.right), x2=X(rb.left);
      const mx=(x1+x2)/2;
      d=`M${x1},${ya} C${mx},${ya} ${mx},${yb} ${x2},${yb}`;
      // the 80 is a stage-space distance (a fraction of a column), so this runs on stage
      // coordinates too — otherwise zooming out would start reading distinct columns as one
    } else if(Math.abs((ra.left+ra.right)-(rb.left+rb.right))/BZ<80){
      // same column (e.g. a lateral edge between two landing cards): bow out the right side
      const x1=X(ra.right), x2=X(rb.right);
      const bow=Math.max(x1,x2)+26;
      d=`M${x1},${ya} C${bow},${ya} ${bow},${yb} ${x2},${yb}`;
    } else {                                          // cross-paper: connect the facing edges
      const aLeft=(ra.left+ra.right)/2 < (rb.left+rb.right)/2;
      const x1=X(aLeft?ra.right:ra.left);
      const x2=X(aLeft?rb.left:rb.right);
      const mx=(x1+x2)/2;
      d=`M${x1},${ya} C${mx},${ya} ${mx},${yb} ${x2},${yb}`;
    }
    const path=document.createElementNS(NS,"path");
    path.setAttribute("d",d);
    path.setAttribute("fill","none");
    path.setAttribute("stroke",contra?stroke.cross:ans?stroke.question:gen?stroke.broad:stroke.grounded);
    path.setAttribute("stroke-width","1.6");
    if(lat) path.setAttribute("stroke-dasharray","5 4");
    else if(ans) path.setAttribute("stroke-dasharray","2 3");   // dotted: answers ≠ support
    path.setAttribute("opacity",on?(lat||ans?"0.85":"0.95"):"0.2");    // incident bright; dim floor lifted for the light canvas
    if(ans) path.setAttribute("marker-end","url(#arq)");
    else if(gen) path.setAttribute("marker-end","url(#arg)");
    else if(!lat) path.setAttribute("marker-end","url(#ar)");
    else if(contra) path.setAttribute("marker-end","url(#arx)");
    frag.appendChild(path);
  }
  svg.appendChild(frag);                            // one insertion, not one per edge
}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
// The VISIBLE slab of an endpoint's row: its rect ∩ every box that clips it. A row's layout rect
// is not where the eye sees it — a card hides its own overflow (`.card{overflow:hidden}`) and the
// slice graph inside it scrolls sideways (`.snodes{overflow-x:auto}`), so a node scrolled out of
// view goes on reporting a rect, one that can sit clear outside the card and even left of the
// whole board. Anchoring an edge on that rect threw the arc across every column to an arrowhead
// planted in blank canvas — twenty of them at once when a paper's sources all ground slices that
// had been scrolled off. Clipping to the scroller answers "where is this node on screen"; null
// means nowhere, and the caller falls back to the card the way an un-drilled endpoint does.
// (Clipping is to the CARD's box, not the viewport: a row scrolled out of sight down the board is
// still a legitimate anchor, since the overlay spans the board rather than the window.)
function rowRect(end){
  const card=end.sid&&document.getElementById(end.cardId);
  if(!card) return null;
  // drilled rows may render the same slice at several paths — take the first one on screen
  for(const rowEl of card.querySelectorAll(`[data-sid="${end.sid}"]`)){
    const r=rowEl.getBoundingClientRect();
    if(r.width<=0) continue;                        // folded away, not merely scrolled
    let l=r.left,t=r.top,ri=r.right,b=r.bottom;
    for(const clip of [rowEl.closest(".snodes"),card]){
      if(!clip) continue;
      const c=clip.getBoundingClientRect();
      l=Math.max(l,c.left); ri=Math.min(ri,c.right);
      t=Math.max(t,c.top);  b=Math.min(b,c.bottom);
    }
    if(ri>l&&b>t) return {left:l,top:t,right:ri,bottom:b};
  }
  return null;
}
// The card itself — the aggregate anchor, and what an endpoint with no on-screen row falls back to.
function cardRect(end){
  const card=document.getElementById(end.cardId);
  if(!card) return null;
  const r=card.getBoundingClientRect();
  return r.width>0?r:null;
}
// Resolve an endpoint: its on-screen row (a slice row, or a stack's source row) else the card.
// Falling back to the card is what keeps un-drilled edges aggregate.
function anchorRect(end){ return rowRect(end)||cardRect(end); }

// ── tooltip ────────────────────────────────────────────────────────────────────────────
// Served over HTTP (`lit serve`), the tooltip upgrades: pdfs.json says which curated
// papers have a servable PDF, hovering embeds its first page, clicking the preview opens
// the full PDF in a new tab. Opened from file:// (`lit build` output) it stays inert.
const LIVE = location.protocol.startsWith("http");
// touch/no-hover devices synthesize mouseenter/move on tap (iOS), which would pin a sticky
// tooltip and latch soft previews. Hover-only affordances are gated on a real hover pointer;
// the load-bearing actions (tap to open/pin) are click/pointer-based and unaffected.
const HOVER = matchMedia("(hover: hover)").matches;
const QUERY = new URLSearchParams(location.search);
// A touch-only device cannot meaningfully manage the desktop's three OS windows. Its curation
// route keeps the isolated card and PDF dock together in this one installed-app window.
const MOBILE_CURATE = LIVE && QUERY.has("mobile");
const PHONE_LAUNCH = matchMedia("(hover: none) and (pointer: coarse)").matches;
// A mode marker only — the split layout no longer branches on it. Phone curation used to carry its
// own stacked-pane CSS; the dock now splits on the window's long axis in every mode alike.
if (MOBILE_CURATE) document.body.classList.add("mobile-curate");
// COCKPIT = the server can open a curation terminal window (it found an emulator), injected by
// `lit serve` as GRAPH.cockpit ({terminal: "kitty"}). Entering curation turns this graph window
// into the card, opens the PDF, and asks the server for the terminal. This says whether POST /term
// can produce the terminal. Not a mode: the graph is only replaced after the curator enters.
const COCKPIT = GRAPH.cockpit || null;
// DRIVE: this document is a paper's curation card — /preview.html?key=…&drive=1, opened in its own
// OS window. It shows one paper's isolated subgraph; a quote-click POSTs the weld to the focus wire
// (aiming the separate PDF window) rather than mounting a pane of its own. The graph is never DRIVE.
const DRIVE = LIVE && QUERY.has("drive") && !MOBILE_CURATE;
if (DRIVE) document.body.classList.add("cardwin");
// Hot-reload the DRIVE card IN PLACE on a YAML edit: fetch the freshly-isolated subgraph, refill
// the data objects (const bindings survive — we mutate contents, never reassign), rebuild from the
// preserved reading state (open/drill/grpCollapsed/stacks are untouched), and restore scroll. The
// card window watches the focus wire's `data_version` itself (it's a top-level window now, with no
// parent to tell it) — far gentler than reloading, which tore down the DOM and collapsed the card
// the human was mid-read on.
async function refreshDriveData(){
  const key = new URLSearchParams(location.search).get("key");
  if (!key) return;
  let g; try { g = await fetch(`preview.json?key=${encodeURIComponent(key)}`).then(r => r.ok ? r.json() : null); }
  catch { return; }                                    // server gone / broken edit → keep the last good render
  if (!g || !g.papers) return;
  for (const k in PAPERS) delete PAPERS[k]; Object.assign(PAPERS, g.papers);
  for (const k in BROAD)  delete BROAD[k];  Object.assign(BROAD,  g.broad || {});
  for (const k in STUBS)  delete STUBS[k];  Object.assign(STUBS,  g.stubs || {});
  ORDER.length = 0; ORDER.push(...(g.order || []));
  buildBroadLinks();
  const sc = document.scrollingElement || document.documentElement;
  const y = sc.scrollTop, x = board.scrollLeft;        // rebuild churns the DOM; hold the reading spot
  rebuild();
  sc.scrollTop = y; board.scrollLeft = x;
  // The walk indexes the same objects, so it has to be rebuilt from them too — otherwise a slice
  // the agent just added stays missing from the roster, which is the one thing it must never do.
  const W = window.litWalk;
  if (W) {
    const st = document.getElementById("walkStage"), sy = st ? st.scrollTop : 0;
    W.reindex();
    if (!W.focus || !W.nodes[W.focus]) W.standOnCard();   // focus may have been edited away
