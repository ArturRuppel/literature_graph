<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>litgraph · paper-centric column view</title>
<style>
  :root{
    /* ELN light theme. The variable NAMES are load-bearing: JS reads --grounded / --cross /
       --question via cssv() to stroke the SVG edges, so only their VALUES change here. */
    --bg:#eef1f4;--ink:#27313a;--dim:#53616d;--faint:#6a7884;--line:#d7dde2;--panel:#ffffff;
    --floor:#b5822f;--model:#8a6db1;--grounded:#27735f;--borrowed:#286b9f;
    --question:#a15c1e;--broad:#7a4fb0;--cross:#9a3b3b;
    --plausible:#8a97a4;
    --navy:#263646;   /* the signature ELN accent bar (the HUD) */
    --col:340px;   /* content-container width; the width slider in the HUD drives it */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;
    padding:8px 16px;background:var(--navy);color:#d7e0e7;
    border-bottom:1px solid rgba(0,0,0,.18);backdrop-filter:blur(6px)}
  #hud b{font-size:13px;color:#fff}
  #hud .widthctl{margin-left:auto;display:flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#a9b7c4}
  #hud .widthctl input{width:150px;accent-color:#5a9fd0;cursor:pointer}
  #hud .widthctl .val{min-width:34px;text-align:right;color:#d7e0e7;letter-spacing:0}

  /* curation-in-progress review lens (serve only) */
  #hud .wip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#e7cfa6;
    border:1px solid rgba(231,207,166,.42);border-radius:999px;padding:3px 10px;
    background:rgba(181,130,47,.15)}
  #hud .wip:hover{background:rgba(181,130,47,.28);border-color:rgba(231,207,166,.7)}
  #hud .wip .n{color:#fff;font-weight:600}
  #hud .wip[hidden]{display:none}

  /* collapsible PDF viewer toggle (serve only, browse view) */
  #hud .pdfbtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#bcd2e4;
    border:1px solid rgba(120,170,210,.42);border-radius:999px;padding:3px 10px;
    background:rgba(90,159,208,.14)}
  #hud .pdfbtn:hover{background:rgba(90,159,208,.26);border-color:rgba(150,195,225,.7)}
  #hud .pdfbtn.on{background:rgba(90,159,208,.34);border-color:rgba(170,205,230,.85);color:#fff}
  #hud .pdfbtn[hidden]{display:none}
  #wipPanel{position:fixed;z-index:45;top:44px;left:16px;width:300px;max-height:72vh;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 34px rgba(38,54,70,.24);padding:6px}
  #wipPanel[hidden]{display:none}
  #wipPanel .wp-hd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding:6px 8px 5px}
  #wipPanel .wp-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer}
  #wipPanel .wp-row:hover{background:var(--bg)}
  #wipPanel .wp-row .ckey{font-size:12px;color:var(--ink)}
  #wipPanel .wp-row .stage{margin-left:auto;font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
  #wipOverlay{position:absolute;inset:46px 0 0 0;z-index:40;display:flex;flex-direction:column;background:var(--bg)}
  #wipOverlay[hidden]{display:none}
  #wipOverlay .wo-bar{display:flex;align-items:center;gap:12px;padding:7px 16px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  #wipOverlay .wo-bar button{font:inherit;font-size:11px;color:var(--ink);background:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
  #wipOverlay .wo-bar button:hover{background:var(--bg)}
  #wipOverlay .wo-title{font-size:11px;color:var(--dim)}
  #wipOverlay .wo-title b{color:var(--ink)}
  #wipOverlay .wo-nav{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--faint)}
  #wipOverlay iframe{flex:1;width:100%;border:0;background:var(--bg)}

  /* side padding centers the landing column on screen when nothing is expanded (half the
     viewport minus half a column), so grounds (←) and builds/synthesis (→) spawn symmetrically;
     it grows into scroll as columns fan out. min 40px keeps a gutter on narrow screens. */
  #board{position:absolute;inset:46px 0 0 0;overflow:auto;display:flex;align-items:flex-start;
    gap:54px;padding:34px max(40px, calc(50vw - var(--col)/2)) 80px}
  /* edges paint above the cards so an arrow runs all the way to the slice row it anchors
     on (never clipped at the container border); hover-isolation is for disentangling */
  svg#edges{position:absolute;top:0;left:0;z-index:10;pointer-events:none;overflow:visible}

  .col{position:relative;z-index:5;display:flex;flex-direction:column;gap:14px;flex:none;width:var(--col)}
  .col .colhd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding-left:4px;margin-bottom:-4px}

  /* paper card */
  .card{position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);
    overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:#b8c3cc}
  .card.curated{border-style:solid}
  .card.stub{border-style:dashed;opacity:.92;cursor:default}
  .card.focus{border-color:var(--grounded);box-shadow:0 0 0 1px var(--grounded),0 6px 20px rgba(38,54,70,.14)}
  /* hover counterpart: the paper(s) an edge of the hovered claim touches */
  .card.hl{border-color:var(--borrowed);box-shadow:0 0 0 1px var(--borrowed)}
  .bn.hl{box-shadow:0 0 0 1.5px var(--borrowed)}
  /* header: circle + citekey always; type/year only when expanded. Flex row = no overlap. */
  .chd{display:flex;align-items:center;gap:7px;padding:9px 11px}
  .circle{flex:none;display:flex;width:16px;height:16px}
  .ckey{font-size:11px;font-weight:700;cursor:help}
  /* the paper classifier (original / perspective / methods …) rides in the header at all
     times — collapsed or open — so a paper's kind is legible without focusing it */
  .ctype{display:inline-block;font-size:7px;padding:1px 5px;border-radius:4px;font-weight:700;
    color:#fff;background:var(--dim)}
  .ctype.original{background:#5d7290}.ctype.methods{background:var(--floor)}
  .ctype.perspective{background:#8a6db1}.ctype.review{background:#2f8f7f}
  .ctype.commentary{background:#a15c1e}
  .cyr{display:none;margin-left:auto;font-size:9px;color:var(--faint)}
  /* expanded-only body (revealed when a curated card is focused → .open) */
  .ctitle{display:none;padding:0 11px 2px;font-size:10px;color:var(--dim);line-height:1.32}
  .cauth{display:none;padding:4px 11px 6px;font-size:9px;color:var(--faint)}
  .cauth .star{color:var(--floor)}
  /* the abstract: on desktop it lives in the hover tip; on touch (no hover) it shows inline in
     the open card instead (revealed by the coarse-pointer media query below) */
  .cabs{display:none;padding:0 11px 8px;font-size:10px;color:var(--dim);line-height:1.4}
  .card.open .cyr{display:inline-block}
  .card.open .ctitle,.card.open .cauth{display:block}
  /* open card: body is inert; the header collapses, the slice rows drill */
  .card.open{cursor:default}
  .card.open .chd{cursor:pointer}

  /* slices (vertical, within-paper) — entry rows are the top of the local support DAG;
     drilling a row unfolds its branch (quote + direct supports), outline-style */
  .slices{display:none;border-top:1px solid var(--line);padding:6px 9px 9px 12px;background:#f9fbfc}
  .card.open .slices{display:block}
  /* the paper's entry rows partition into standing sections — its own novel claims &
     questions, then the borrowed (restated) claims, then the open questions it leaves
     unanswered (at the bottom) — each a labeled sub-container */
  .slices .sgrp{display:flex;align-items:center;gap:4px;cursor:pointer;
    font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);
    margin:7px 0 3px;padding-top:5px;border-top:1px solid var(--line)}
  .slices .sgrp:first-child{margin-top:0;padding-top:0;border-top:0}
  .slices .sgrp:hover{color:var(--dim)}
  .slices .sgrp .gcar{font-size:7px}
  .slices .sgrp .gct{margin-left:auto;letter-spacing:0;font-weight:400;color:var(--faint)}
  .slices .sgrpb{padding-left:6px;margin-left:2px;border-left:1px solid #e0e5e9}
  .slice{display:flex;gap:5px;align-items:flex-start;padding:3px 5px;margin:2px 0;border-radius:5px;
    background:#f3f6f8;font-size:9px}
  .slice.drillable{cursor:pointer}
  .slice.drillable:hover{background:#e9eef2}
  .car{flex:none;width:9px;color:var(--faint);font-size:8px;margin-top:1px;text-align:center}
  .sid{flex:none;font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff;margin-top:1px}
  .sid.fl{background:var(--floor)}.sid.cl{background:var(--grounded)}.sid.bo{background:var(--borrowed)}
  .sid.q{background:var(--question)}
  .sid.q.ans{opacity:.55}
  .stx{color:var(--ink);line-height:1.28}
  /* a slice whose weld is a PDF quote: its page pops on hover, pins on click (no inline text) */
  .slice.pdf-src{cursor:pointer}
  .slice.pdf-src .stx{border-bottom:1px dotted #b9a55f}
  .slice.pdf-src:hover .stx{border-bottom-color:var(--borrowed)}
  /* the generalization ladder: a row that ladders (leads_to) into the broader claim above */
  .slice.gen{border-left:2px solid var(--broad)}
  .gmk{flex:none;color:var(--broad);font-size:8px;margin-top:1px}

  /* source stack — citation-wall collapse: a focused paper's uncurated sources fold into
     one "▸ N sources" card; only an explicit click unfolds it */
  .card.stack{cursor:pointer}
  .stack .ckey{color:var(--dim);font-weight:600}
  .srcs{display:none;border-top:1px solid var(--line);padding:5px 9px 8px;background:#f9fbfc}
  .card.stack.open .srcs{display:block}
  .src{display:flex;gap:6px;align-items:baseline;padding:2px 5px;margin:1px 0;border-radius:4px;
    background:#f3f6f8;font-size:9px}
  .src:hover{background:#e9eef2}
  .src .skey{font-weight:700}
  .src .sy{margin-left:auto;color:var(--faint);font-size:8px}

  /* broad / synthesis nodes */
  .bn{position:relative;border:1.6px solid var(--broad);border-radius:14px;padding:9px 12px;
    background:linear-gradient(160deg,#f4f0fa,#ece3f6);cursor:default}
  .bn.q{border-color:var(--question);background:linear-gradient(160deg,#faf3e6,#f6ead8)}
  .bn .bkd{font-size:7px;letter-spacing:1.4px;text-transform:uppercase;color:#6b3fae;margin-bottom:3px}
  .bn.q .bkd{color:#9a6516}
  .bn .btx{font-size:10px;line-height:1.3;color:var(--ink)}
  .bn .meter{margin-top:6px;display:flex;gap:6px;font-size:8px}
  .bn .meter .s{color:var(--grounded)}.bn .meter .c{color:var(--cross)}

  /* tooltip */
  #tip{position:fixed;z-index:50;width:300px;border:1px solid var(--line);border-radius:10px;
    background:rgba(255,255,255,.97);box-shadow:0 12px 40px rgba(38,54,70,.18);padding:11px 13px;display:none;backdrop-filter:blur(8px);
    max-height:88vh;overflow-y:auto}
  /* metadata card: title · all authors · journal · year · non-clickable first-page preview */
  #tip .ttitle{margin:0 0 4px;font-size:11px;font-weight:700;color:var(--ink);line-height:1.3}
  #tip .tauth{font-size:9.5px;color:var(--dim);line-height:1.4;margin-bottom:6px}
  #tip .meta{font-size:9px;color:var(--faint);margin-bottom:7px}
  #tip .pdf{margin-top:9px;height:70px;border:1px dashed var(--line);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--faint);
    background:repeating-linear-gradient(180deg,#f3f6f8,#f3f6f8 6px,#e9eef2 6px,#e9eef2 12px)}
  #tip .pdf.live{border-color:var(--line);height:210px;padding:0;overflow:hidden;
    background:#fff;align-items:flex-start;border-style:solid}
  #tip .pdf.live img{width:100%;display:block}
  #tip .nopdf{margin-top:9px;font-size:9px;color:var(--faint);font-style:italic}
  .hint{position:fixed;bottom:12px;left:16px;font-size:10px;color:var(--faint);z-index:30}

  /* right-click "Curate this paper" menu (serve only, browse view) */
  #ctxmenu{position:fixed;z-index:70;display:none;min-width:150px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 12px 40px rgba(38,54,70,.20)}
  #ctxmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;
    font:inherit;font-size:11px;color:var(--ink);padding:6px 10px;border-radius:5px;cursor:pointer}
  #ctxmenu button:hover{background:var(--bg)}

  /* floating PDF quote window: the page rendered, the quote highlighted, movable/zoomable */
  .pw{position:fixed;z-index:60;width:440px;height:520px;display:flex;flex-direction:column;
    border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;
    user-select:none;box-shadow:0 14px 50px rgba(38,54,70,.22)}
  .pw-bar{flex:none;display:flex;align-items:center;gap:6px;height:22px;padding:0 4px 0 8px;
    background:#f3f6f8;border-bottom:1px solid var(--line);cursor:move;user-select:none;
    font-size:9px;color:var(--dim)}
  .pw-bar b{color:#24313d;font-weight:700}
  .pw-bar .sp{margin-left:auto}
  .pw-tools{display:flex;gap:1px}
  .pw-tool{cursor:pointer;border:0;background:transparent;color:var(--faint);font:inherit;
    font-size:11px;line-height:1;padding:2px 5px;border-radius:3px}
  .pw-tool:hover{color:#24313d}
  .pw[data-tool=pan]  .pw-tool[data-t=pan],
  .pw[data-tool=text] .pw-tool[data-t=text]{background:#cfd8e0;color:#24313d}
  .pw-x{cursor:pointer;padding:0 5px;color:var(--faint);font-size:12px;line-height:1}
  .pw-x:hover{color:#24313d}
  .pw-body{flex:1;position:relative;overflow:auto;background:#e0e5e9;
    scrollbar-width:thin;scrollbar-gutter:stable}
  .pw[data-tool=pan]  .pw-body{cursor:grab}
  .pw[data-tool=pan]  .pw-body.pan{cursor:grabbing}
  .pw[data-tool=text] .pw-body{cursor:text}
  .pw-sizer{position:relative}
  .pw-stage{position:absolute;top:0;left:0;transform-origin:0 0}
  .pw-page{position:relative;width:100%;margin-bottom:8px;background:#fff;
    box-shadow:0 1px 3px rgba(38,54,70,.16)}
  .pw-page:last-child{margin-bottom:0}
  .pw-img{display:block;width:100%;height:auto;pointer-events:none}
  .pw-hl{position:absolute;background:#ffe45a55;outline:1.5px solid #ffd21e;
    mix-blend-mode:multiply;border-radius:1px;pointer-events:none}
  .pw-text{position:absolute;inset:0;line-height:1;pointer-events:none}
  .pw[data-tool=text] .pw-text{pointer-events:auto}
  .pw-text span{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;
    user-select:text;cursor:text}
  .pw-text span::selection{background:rgba(46,120,210,.30)}
  .pw-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--faint)}
  .pw-grip{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;
    background:linear-gradient(135deg,transparent 50%,var(--line) 50%,var(--line) 62%,transparent 62%,
    transparent 74%,var(--line) 74%,var(--line) 86%,transparent 86%)}

  /* ── mobile / touch: read-only friendliness ──────────────────────────────────────────────
     Desktop is fenced off: layout keys off max-width (below ~640px two columns can't fit
     anyway); input affordances key off (hover:none)+(pointer:coarse). The three unconditional
     clamps below are desktop-safe (they only bite when a panel would overflow the viewport). */
  #tip{max-width:calc(100vw - 16px)}
  #wipPanel{max-width:calc(100vw - 16px)}
  #board{overscroll-behavior-x:contain}          /* no back/forward-swipe hijack from the h-scroll */
  .pw-body{overscroll-behavior:contain}          /* nested page-scroll doesn't chain to the board */

  @media (max-width:640px){
    :root{--col:min(340px,86vw)}                 /* card fits with a gutter; neighbor column peeks */
    #board{gap:22px;padding:22px max(12px, calc(50vw - var(--col)/2)) 80px}
    #hud{gap:8px 10px;flex-wrap:wrap}
    #hud .widthctl{display:none}                 /* column ≈ full width — slider is moot (and ate swipes) */
    #wipPanel{left:8px;right:8px;width:auto;max-height:60vh}
    #wipOverlay .wo-bar{flex-wrap:wrap;gap:8px 10px}
  }
  @media (hover:none) and (pointer:coarse){
    /* the movable/resizable quote window becomes a near-fullscreen sheet: no drag, no resize,
       native scroll, closed by its × (drag/resize/pan are gated in JS on pointerType) */
    .pw{position:fixed !important;inset:8px !important;width:auto !important;height:auto !important}
    .pw-grip{display:none}
    .pw-bar{cursor:default}
    .card,.slice,.slices .sgrp,.card.stack,.pw-tool,.pw-x,#hud .wip,
    #wipPanel .wp-row,#wipOverlay .wo-bar button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .slice{padding:7px 6px}                       /* fatter tap targets */
    .slices .sgrp{padding-top:9px;margin:9px 0 4px}
    #wipPanel .wp-row{padding:11px 10px}
    .card:active{border-color:#b8c3cc}            /* tap feedback (replaces the lost :hover cue) */
    .slice.drillable:active{background:#e9eef2}
    .card.open .cabs{display:block}               /* abstract inline (no hover tip on touch) */
  }

  /* ── collapsible PDF viewer (browse view) ───────────────────────────────────────────────
     Toggled from the HUD. One docked pane on the right the graph makes room for; hovering a
     quote-slice aims it (JS). Empty until the first hover — the placeholder sits behind and is
     painted over once a page mounts. */
  body{--dock-w:44%}                              /* dock width — JS-driven, persisted, resizable */
  body.dock-open #board{right:var(--dock-w)}
  #dockEmpty{display:none}
  body.dock-open #dockEmpty{display:flex;position:fixed;right:0;top:46px;bottom:0;
    width:var(--dock-w);z-index:15;align-items:center;justify-content:center;text-align:center;
    padding:0 32px;border-left:1px solid var(--line);background:var(--bg);
    color:var(--faint);font-size:11px;line-height:1.6}
  body.dock-open .pw-side{position:fixed !important;right:0 !important;
    left:auto !important;top:46px !important;bottom:0 !important;width:var(--dock-w) !important;
    height:auto !important;border-radius:0;box-shadow:none;border-left:1px solid var(--line);
    z-index:16}
  body.dock-open .pw-side .pw-grip{display:none}
  body.dock-open .pw-side .pw-bar{cursor:default}
  /* drag handle on the dock's left seam — Hyprland-style width resize (persisted) */
  #dockGrip{display:none}
  body.dock-open #dockGrip{display:block;position:fixed;top:46px;bottom:0;right:var(--dock-w);
    width:8px;margin-right:-4px;z-index:17;cursor:ew-resize;background:transparent;transition:background .12s}
  #dockGrip:hover,body.dock-resizing #dockGrip{background:#6ea8d8}
  body.dock-resizing{cursor:ew-resize;user-select:none}
  body.dock-resizing .pw-side{pointer-events:none}

  /* ── in-progress zone = the cockpit ─────────────────────────────────────────────────────
     Entering an in-progress paper (from the "in progress" pill) opens its three-pane cockpit
     inside the review overlay: the isolated subgraph as the left card, the focus-wire PDF pane
     top-right, the paper's ttyd terminal bottom-right. The focus pane (.pw) is re-parented into
     .wo-pdf and absolute-filled; the terminal iframe mounts in .wo-term. */
  /* two-column × two-row tiling: the left card spans full height; the right column stacks the
     focus-wire PDF pane over the terminal. Thin gutter tracks (col 2 / row 2) carry the drag
     handles; the fr weights are driven by JS and persisted — Hyprland-style divider resize. */
  #wipOverlay .wo-body{flex:1;position:relative;display:grid;min-height:0;
    grid-template-columns:0.42fr 6px 0.58fr;grid-template-rows:0.58fr 6px 0.42fr}
  #wipOverlay .wo-frame{grid-column:1;grid-row:1 / 4;width:100%;height:100%;border:0;
    border-right:1px solid var(--line);background:var(--bg)}
  #wipOverlay .wo-pdf{grid-column:3;grid-row:1;position:relative;min-height:0;overflow:hidden}
  #wipOverlay .wo-term{grid-column:3;grid-row:3;position:relative;min-height:0;
    border-top:1px solid var(--line);background:#1e1e1e}
  #wipOverlay .wo-rs{position:relative;z-index:3;background:transparent;transition:background .12s}
  #wipOverlay .wo-rs-c{grid-column:2;grid-row:1 / 4;cursor:ew-resize}
  #wipOverlay .wo-rs-r{grid-column:3;grid-row:2;cursor:ns-resize}
  #wipOverlay .wo-rs-x{grid-column:2;grid-row:2;z-index:4;cursor:nwse-resize}
  #wipOverlay .wo-rs:hover,#wipOverlay .wo-body.resizing .wo-rs{background:#6ea8d8}
  /* during a divider drag, let pointer moves pass through the iframes/pane to the window listener */
  #wipOverlay .wo-body.resizing iframe,#wipOverlay .wo-body.resizing .wo-pdf{pointer-events:none}
  #wipOverlay .wo-term iframe{width:100%;height:100%;border:0;display:block}
  #wipOverlay .wo-term .term-empty{color:#9aa;font-size:11px;padding:10px 12px}
  #wipOverlay .wo-return{margin-left:8px;color:var(--grounded) !important}
  /* fill the .wo-pdf cell: inset:0 pins all four edges; width/height:auto let those edges (not the
     base .pw's 440×520) drive the size, so .pw-body becomes a bounded scroll viewport (scroll/pan). */
  .pw-zone{position:absolute !important;inset:0 !important;
    width:auto !important;height:auto !important;border-radius:0;box-shadow:none;z-index:1}
  .pw-zone .pw-grip{display:none}
  .pw-zone .pw-bar{cursor:default}
</style>
</head>
<body>
<div id="hud">
  <b>litgraph</b>
  <span id="wip" class="wip" hidden></span>
  <button id="pdfToggle" class="pdfbtn" hidden>📄 PDF</button>
  <label class="widthctl">width
    <input id="colw" type="range" min="220" max="720" step="4" value="340">
    <span class="val"></span>
  </label>
</div>
<div id="board"><svg id="edges"></svg></div>
<div id="dockEmpty">open a card to load its PDF · hover a claim to jump to its quote · toggle with 📄 PDF</div>
<div id="dockGrip"></div>
<div id="tip"></div>
<div id="ctxmenu"></div>
<div id="wipPanel" hidden></div>
<div id="wipOverlay" hidden>
  <div class="wo-bar">
    <button class="wo-back">← back to graph</button>
    <span class="wo-title"></span>
    <span class="wo-nav"><button class="wo-prev" title="previous (←)">‹</button>
      <span class="wo-count"></span><button class="wo-next" title="next (→)">›</button></span>
    <button class="wo-return" title="finish: return this paper to the graph">Return to graph</button>
  </div>
  <div class="wo-body">
    <iframe class="wo-frame" title="in-progress paper subgraph"></iframe>
    <div class="wo-pdf"></div>
    <div class="wo-term"><div class="term-empty">terminal unavailable — no ttyd on this serve</div></div>
    <div class="wo-rs wo-rs-c" title="drag to resize"></div>
    <div class="wo-rs wo-rs-r" title="drag to resize"></div>
    <div class="wo-rs wo-rs-x" title="drag to resize both"></div>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
// ── data: injected by `lit build` (replaces the mockup's hardcoded literals) ──
const GRAPH = /*__GRAPH_JSON__*/ {"papers":{},"broad":{},"stubs":{},"order":[],"active":[]} /*__END__*/;
const PAPERS = GRAPH.papers;
const BROAD = GRAPH.broad;
const STUBS = GRAPH.stubs;
const ORDER = GRAPH.order;

// slug -> every curated paper that links into that broad node (generalize / stance / answer),
// independent of expansion state. Lets a broad-node hover reach papers still collapsed in the
// landing column, not just the expanded ones whose edges happen to already be drawn.
const BROAD_LINKS = {};
(function(){
  const push=(slug,key,via,kind)=>{ (BROAD_LINKS[slug]=BROAD_LINKS[slug]||[]).push({key,via,kind}); };
  for(const [key,p] of Object.entries(PAPERS)){
    if(!p.cur) continue;
    (p.cons||[]).forEach(c=>push(c.slug,key,c.via,"leads"));
    (p.lateral||[]).forEach(l=>{ if(l.slug) push(l.slug,key,l.via,l.sign); });
    (p.ans||[]).forEach(a=>{ if(a.slug) push(a.slug,key,a.via,"answers"); });
  }
})();

const board=document.getElementById("edges").parentNode;
const svg=document.getElementById("edges");
const tip=document.getElementById("tip");
let edges=[];            // {from:{cardId,sid},to:{cardId,sid},kind} — an endpoint anchors at the
                         // sid's row when drilling has made it visible, else at the card, so
                         // aggregate paper→paper edges sharpen to slice edges as the human drills
const cols={};           // level -> {el, keys:Set, label}
const open=new Set();    // "level:key" of focused cards — a set, so expansion is non-exclusive
const drill=new Map();   // "level:key" -> Set of expanded row paths ("c3", "c3/c1", …)
const grpCollapsed=new Set();  // "level:key::<group label>" — entry sub-groups folded shut
let ctxOpen=new Set();   // cards context-opened to reveal a sharpened target (recomputed)
let ctxDrill=new Map();  // row paths force-expanded to reveal a sharpened target (recomputed)
const stacks=new Set();  // source-stack ids the human explicitly unfolded (persists rebuilds)
let hover=null;          // {cardId,sid} — hovered slice row/broad node: redraw isolates its
                         // edges (bright) and highlights the counterpart papers, transiently
let pin=[];              // [{cardId,sid}] — clicked isolations that persist after the pointer
                         // leaves and ACCUMULATE: each click hardens another target. Bright set
                         // = every pinned target ∪ the current hover; everything else stays dim.
const SYNTH=1e6;         // synthesis band: broad nodes always sit in the rightmost column
                         // (papers occupy small levels; builds-on growth stays left of it)

// curation maturity (SCHEMA §4) as a pie-filled circle: pass/4. Empty ring = stub (0),
// full disk = fully curated (4). Stubs have no `pass` → treated as 0.
function passCircle(pass){
  const p = Math.max(0, Math.min(4, pass || 0)), frac = p / 4, r = 7;
  const ring = `<circle cx="8" cy="8" r="${r}" fill="none" style="stroke:var(--faint);stroke-width:1.3"/>`;
  let wedge = "";
  if (frac >= 1) wedge = `<circle cx="8" cy="8" r="${r}" style="fill:var(--grounded)"/>`;
  else if (frac > 0) {
    const a = frac * 2 * Math.PI, ex = 8 + r * Math.sin(a), ey = 8 - r * Math.cos(a);
    wedge = `<path d="M8,8 L8,${8 - r} A${r},${r} 0 ${frac > 0.5 ? 1 : 0} 1 ${ex.toFixed(2)},${ey.toFixed(2)} Z" style="fill:var(--grounded)"/>`;
  }
  return `<span class="circle" title="curation maturity ${p}/4">`
       + `<svg width="16" height="16" viewBox="0 0 16 16">${ring}${wedge}</svg></span>`;
}
function authLine(a){return a.map(([n, pos, corr]) =>
  corr ? `<span class="star">${n}*</span>` : n).join(' · ');}
// citekey = <Family><Year><Venue>; the venue token is the journal (ISO-4 abbrev / brand). Used as
// the journal until a real `journal` field is stored end-to-end (then p.journal wins).
const venueFromKey = k => { const m = String(k).match(/\d{4}([A-Za-z][A-Za-z0-9]*)$/); return m ? m[1] : ""; };

function paperCard(key, level){
  const p = PAPERS[key] || STUBS[key];
  const cur = !!(PAPERS[key] && PAPERS[key].cur);
  const id = `${level}:${key}`;
  const el = document.createElement("div");
  el.className = `card ${cur ? 'curated' : 'stub'}`;
  el.id = "card-" + id; el.dataset.key = key; el.dataset.id = id;
  el.dataset.year = p.year || 0;
  // Collapsed by default: circle + citekey only. The rest is revealed on focus (.open).
  let body = `<div class="chd">${passCircle(cur ? p.pass : 0)}<span class="ckey">${key}</span>`;
  if (cur) body += `<span class="ctype ${p.type}">${p.type}</span><span class="cyr">${p.year}</span>`;
  body += `</div>`;
  if (cur) {
    body += `<div class="ctitle">${p.title}</div>`;
    if (p.authors) body += `<div class="cauth">${authLine(p.authors)}</div>`;
    if (p.abs) body += `<div class="cabs">${p.abs}</div>`;   // shown inline only on touch (CSS); desktop reads it in the hover tip
    body += `<div class="slices"></div>`;   // filled by renderSlices from the drill state
  }
  el.innerHTML = body;
  // the abstract + PDF-preview tip is bound to the citekey tag only (hovering the body drills
  // slices / isolates edges without popping the tip); edge-isolation still tracks any row.
  el.addEventListener("mousemove", e => {
    if (e.target.closest(".ckey")) showTip(e, key, el); else dropTip();
    hoverRow(el, e);
  });
  el.addEventListener("mouseleave", () => { dropTip(); hoverRow(null); });
  // right-click a curated card (browse view) → "Curate this paper" → move it into the zone
  if (cur && LIVE && !DRIVE) el.addEventListener("contextmenu", e => showCurateMenu(e, key));
  // touch has no hover: a curated card opens on tap; a stub (no open action) pins its tip instead,
  // so its bib metadata stays reachable on a phone (dismissed by the next outside tap).
  el.addEventListener("click", e => {
    if (cur) cardClick(e, el, level, key);
    else if (!HOVER) showTip(e, key, el, true);
  });
  return el;
}

// Hover-isolate: hovering a slice row (or a broad synthesis node) keeps only the edges
// incident on it — every other arrow disappears — and each counterpart card lights up
// (.hl), so the paper an edge touches is visible even while its slice is still folded.
function setHover(h){
  if (h ? (hover && h.cardId === hover.cardId && h.sid === hover.sid) : !hover) return;
  hover = h; redraw();
  aimDockFromHover(h);          // if the docked PDF viewer is open, aim it at this claim's source
}
function hoverRow(el, e){
  let h = null;
  if (el && el.classList.contains("open")) {
    const row = e.target.closest(".slice");
    if (row) h = {cardId: el.id, sid: row.dataset.sid};
  }
  setHover(h);
}
// Click-to-pin: harden a target so it stays bright after the pointer leaves. Pins accumulate;
// clicking the same target again releases just it, a click on empty board space thaws them all.
const samePin=(a,b)=>!!a&&!!b&&a.cardId===b.cardId&&a.sid===b.sid;
function togglePin(t){
  const i=pin.findIndex(p=>samePin(p,t));
  if(i>=0) pin.splice(i,1); else pin.push(t);
  redraw();
}
const SID_CLASS = {floor: "fl", model: "fl", grounded: "cl", borrowed: "bo",
                   plausible: "cl", question: "q"};

// Click routing on a curated card: closed → click anywhere focuses it; open → the header
// collapses it (or promotes a context-opened card to focus), and slice rows drill.
function cardClick(e, el, level, key){
  const id = `${level}:${key}`;
  const grp = e.target.closest(".sgrp");
  if (grp && el.classList.contains("open")) {          // fold/unfold an entry sub-group
    const gkey = `${id}::${grp.dataset.grp}`;
    if (grpCollapsed.has(gkey)) grpCollapsed.delete(gkey); else grpCollapsed.add(gkey);
    renderSlices(id); redraw();                        // rows appear/vanish → edges re-anchor
    return;
  }
  const row = e.target.closest(".slice");
  if (row && el.classList.contains("open")) {
    togglePin({cardId: el.id, sid: row.dataset.sid});   // harden/release this row (accumulates)
    // zone left-card (DRIVE): a quote-slice click aims the parent zone's PDF pane via the focus
    // wire. Browse view: the click just pins the edge — the docked viewer follows hover, not clicks.
    if (DRIVE && row.classList.contains("pdf-src")) focusFromClick(key, row.dataset.sid);
    if (row.classList.contains("drillable")) toggleDrill(id, row.dataset.path);  // drill + rebuild
    return;
  }
  if (el.classList.contains("open")) {
    if (e.target.closest(".chd")) {
      if (open.has(id)) {
        open.delete(id); drill.delete(id);
        for (const g of [...grpCollapsed]) if (g.startsWith(id + "::")) grpCollapsed.delete(g);
      }
      else { open.add(id); loadDock(key); }   // context-opened card → promote to focused + load its PDF
      rebuild();
    }
    return;
  }
  open.add(id); loadDock(key); rebuild();      // collapsed card clicked open → load its PDF into the dock
}

function toggleDrill(id, path){
  let s = drill.get(id);
  if (!s) { s = new Set(); drill.set(id, s); }
  if (s.has(path))                       // fold the whole branch under this row
    for (const p of [...s]) { if (p === path || p.startsWith(path + "/")) s.delete(p); }
  else s.add(path);
  rebuild();
}

// Drill-down rendering: entry rows are the top of the paper's local support hierarchy
// (claims nothing else builds on or subsumes, plus its questions). Expanding a row reveals
// its weld (the exact quote) and its direct supports — for a question, the claims that
// answer it; for a broader claim, also the claims that ladder into it (local leads_to,
// the generalization ladder — marked ⤴). Each is drillable in turn, branch by branch,
// down to the floors. A support shared by two branches appears under each (outline
// semantics); rows are addressed by path, so the same slice can render at several
// positions and anchorRect picks any visible instance.
function renderSlices(id){
  const key = id.slice(id.indexOf(":") + 1), p = PAPERS[key];
  const box = document.getElementById("card-" + id).querySelector(".slices");
  if (!box) return;
  const byId = {}; p.slices.forEach(s => byId[s.id] = s);
  const answeredBy = {};
  p.slices.forEach(s => (s.answers || []).forEach(r => {
    if (!r.includes(":")) (answeredBy[r] = answeredBy[r] || []).push(s.id);
  }));
  const genBy = {};                    // broader slice -> the local slices laddering into it
  p.slices.forEach(s => (s.gen || []).forEach(g => (genBy[g] = genBy[g] || []).push(s.id)));
  const dependents = new Set();
  p.slices.forEach(s => (s.up || []).forEach(u => dependents.add(u)));
  // a laddering claim (local leads_to) sits under its broader parent, not at the top
  const entries = p.slices.filter(s =>
    (s.kind === "claim" && !dependents.has(s.id) && !(s.gen || []).length)
    || s.kind === "question");
  // a claim that answers a local question already renders nested under that question, so it
  // must not also stand alone as a top-level entry — that double-render was the old redundancy
  const answersLocalQ = new Set(Object.values(answeredBy).flat());
  const claims = entries.filter(s => s.kind === "claim" && !answersLocalQ.has(s.id));
  // the entry rows split into standing groups. First the paper's own line of inquiry — the
  // questions it answered (each with its answering claims nested) followed by the novel claims
  // that don't answer one; then the claims it merely restates from elsewhere; and last, in its
  // own section at the bottom, the OPEN questions — the ones the paper raises and leaves
  // unanswered (emergent: no incoming `answers`), the birds-eye "what this paper leaves open"
  const questions = entries.filter(s => s.kind === "question");
  const groups = [
    ["novel claims & questions",
      [...questions.filter(s => s.answered),
       ...claims.filter(s => s.color !== "borrowed")]],
    ["borrowed claims", claims.filter(s => s.color === "borrowed")],
    ["open questions", questions.filter(s => !s.answered)],
  ];
  const paths = new Set([...(drill.get(id) || []), ...(ctxDrill.get(id) || [])]);
  // a question's direct answers are only the *un-subsumed* ones: an answer that grounds (up) or
  // ladders (gen) into another answer of the SAME question nests under that sibling when it's
  // drilled, so listing it flat here too would render it twice (the umbrella + its supports).
  // This mirrors the top-level `dependents`/`gen` entry filter, which the answer list bypassed.
  const qKids = qid => {
    const ans = answeredBy[qid] || [], set = new Set(ans), sub = new Set();
    ans.forEach(a => {
      (byId[a].up || []).forEach(u => { if (set.has(u)) sub.add(u); });
      (genBy[a] || []).forEach(u => { if (set.has(u)) sub.add(u); });
    });
    return ans.filter(a => !sub.has(a)).map(k => ({s: byId[k], lad: false}));
  };
  const kidsOf = s => s.kind === "question"
    ? qKids(s.id)
    : [...(s.up || []).map(u => ({s: byId[u], lad: false})),
       ...(genBy[s.id] || []).map(u => ({s: byId[u], lad: true}))].filter(k => k.s);
  let html = "";
  const row = (s, path, depth, lad) => {
    const kids = kidsOf(s);
    const can = kids.length;                        // drillable only if it has sub-structure now
    const isOpen = can && paths.has(path);
    const ans = s.kind === "question" && s.answered ? " ans" : "";
    // a slice whose weld is a quote: no inline quote text — its PDF pops on hover / pins on click
    const pdf = (LIVE && s.quote) ? " pdf-src" : "";   // quote-bearing → hover aims the docked viewer
    html += `<div class="slice${can ? ' drillable' : ''}${pdf}${lad ? ' gen' : ''}" data-sid="${s.id}" data-path="${path}"`
          + ` style="margin-left:${depth * 14}px"${lad ? ' title="generalizes into the claim above (leads_to)"' : ''}>`
          + `<span class="car">${can ? (isOpen ? "▾" : "▸") : "·"}</span>`
          + (lad ? `<span class="gmk">⤴</span>` : ``)
          + `<span class="sid ${SID_CLASS[s.color] || 'cl'}${ans}">${s.id}</span>`
          + `<span class="stx">${s.text}</span></div>`;
    if (isOpen) {
      for (const k of kids) row(k.s, `${path}/${k.s.id}`, depth + 1, k.lad);
    }
  };
  for (const [label, ss] of groups) {
    if (!ss.length) continue;
    const col = grpCollapsed.has(`${id}::${label}`);
    html += `<div class="sgrp" data-grp="${label}"><span class="gcar">${col ? "▸" : "▾"}</span>`
          + `${label}<span class="gct">${ss.length}</span></div>`;
    if (col) continue;                     // header only — rows stay folded away
    html += `<div class="sgrpb">`;
    ss.forEach(s => row(s, s.id, 0, false));
    html += `</div>`;
  }
  box.innerHTML = html;
}
function broadCard(slug,level){
  const b=BROAD[slug], id=`${level}:${slug}`;
  const el=document.createElement("div");
  el.className="bn"+(b.kind.includes("question")?" q":"");
  el.id="card-"+id; el.dataset.id=id;
  let m = b.meter?`<div class="meter"><span class="s">▲ ${b.meter.s} support</span><span class="c">▼ ${b.meter.c} contradict</span></div>`:'';
  el.innerHTML=`<div class="bkd">${b.kind}</div><div class="btx">${b.text}</div>${m}`;
  // hovering a broad node isolates its edges and lights up the papers linked into it
  el.addEventListener("mousemove",()=>setHover({cardId:el.id,sid:null}));
  el.addEventListener("mouseleave",()=>setHover(null));
  el.addEventListener("click",()=>togglePin({cardId:el.id,sid:null}));  // pin/unpin this node
  return el;
}

function ensureCol(level,label){
  if(cols[level]) return cols[level];
  const el=document.createElement("div"); el.className="col";
  if(label) el.innerHTML=`<div class="colhd">${label}</div>`;
  cols[level]={el,keys:new Set(),label};
  // insert in DOM ordered by level (left→right)
  const levels=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const idx=levels.indexOf(level);
  if(idx===levels.length-1) board.appendChild(el);
  else board.insertBefore(el, cols[levels[idx+1]].el);
  return cols[level];
}
function addPaper(level,key,label){
  const c=ensureCol(level,label);
  if(c.keys.has(key)) return;          // de-dup by citekey (accumulate)
  c.keys.add(key);
  const card=paperCard(key,level);
  if(level===0){ c.el.appendChild(card); return; }   // landing keeps its pass ranking
  // spawned columns sort by year desc — chronology falls out of the grounding walk
  const yr=+card.dataset.year||0;
  let before=null;
  for(const ch of c.el.querySelectorAll(":scope > .card"))
    if((+ch.dataset.year||0)<yr){ before=ch; break; }
  c.el.insertBefore(card,before);
}
function addBroad(level,slug,label){
  const c=ensureCol(level,label);
  if(c.keys.has(slug)) return;
  c.keys.add(slug); c.el.appendChild(broadCard(slug,level));
}
// The synthesis band always shows every broad claim / question, expanded state or not —
// they're the standing right-hand column. expandCard still adds the ones linked from an
// open paper (with real edges); this backfills the rest (deduped), so the band is complete
// on the landing view and survives every rebuild. Unlinked-yet nodes stay hover-active
// (broadExtraEdges lights their papers) like any other broad node.
function ensureBroadBand(){
  for(const slug of Object.keys(BROAD)) addBroad(SYNTH,slug,"synthesis · now →");
}
// Citation-wall collapse: a focused paper's UNCURATED sources never spawn cards — they fold
// into one "▸ N sources" stack per focused card, expandable on demand and ONLY on demand
// (reveal()/rebuild() never unfold it, so it stays collapsed under any programmatic
// expansion). Rows carry data-sid=<citekey>, so a wall edge sharpens from the stack card to
// its source row the moment the stack is unfolded. Returns the stack element id.
function addStack(level,owner,wall,label){
  const c=ensureCol(level,label);
  const key=owner+"::srcs", id=`${level}:${key}`, eid="card-"+id;
  if(c.keys.has(key)) return eid;
  c.keys.add(key);
  const srcs=[...new Set(wall.map(g=>g.key))]
    .map(k=>({k,p:STUBS[k]||{}}))
    .sort((a,b)=>(b.p.year||0)-(a.p.year||0));
  const el=document.createElement("div");
  el.className="card stack"+(stacks.has(id)?" open":"");
  el.id=eid; el.dataset.id=id;
  el.dataset.year=srcs.length?(srcs[0].p.year||0):0;   // sorts by its newest source
  el.innerHTML=`<div class="chd"><span class="car">${stacks.has(id)?"▾":"▸"}</span>`
    +`<span class="ckey">${srcs.length} source${srcs.length===1?"":"s"}</span></div>`
    +`<div class="srcs">`+srcs.map(s=>
      `<div class="src" data-sid="${s.k}"><span class="skey">${s.k}</span>`
      +`<span class="sy">${s.p.year||""}</span></div>`).join("")+`</div>`;
  el.addEventListener("click",()=>{
    if(stacks.has(id)) stacks.delete(id); else stacks.add(id);
    el.classList.toggle("open",stacks.has(id));
    el.querySelector(".car").textContent=stacks.has(id)?"▾":"▸";
    redraw();                                          // anchors move; edges re-route
  });
  for(const row of el.querySelectorAll(".src")){
    row.addEventListener("mousemove",e=>showTip(e,row.dataset.sid,row));
    row.addEventListener("mouseleave",dropTip);
  }
  const yr=+el.dataset.year||0;                        // year-sorted, same rule as cards
  let before=null;
  for(const ch of c.el.querySelectorAll(":scope > .card"))
    if((+ch.dataset.year||0)<yr){ before=ch; break; }
  c.el.insertBefore(el,before);
  return eid;
}

const edgeSeen=new Set();
// each endpoint is {cardId, sid}: it anchors at sid's row when visible, else at the card.
function addEdge(from,to,kind){            // de-dup: rebuilds must not stack duplicate paths
  const k=`${from.cardId}:${from.sid}|${to.cardId}:${to.sid}|${kind}`;
  if(edgeSeen.has(k)) return;
  edgeSeen.add(k); edges.push({from,to,kind});
}

// Recompute every spawned column + edge from the open set (non-exclusive: opening one
// paper never tears down another). An open card at level L pours its grounds into L-1 and
// the papers that build on it into L+1; if a spawned card is opened too, the sweep drills
// it in turn — cross-paper expansion is iterative, one generation per click. Expansion
// runs both directions, so the sweep iterates to a fixpoint instead of walking one way.
function rebuild(){
  // The landing column is a fixed anchor: content expands out from it (grounds ←, builds →)
  // without it sliding sideways. Capture its screen-x before the DOM churns, restore it after
  // by compensating scrollLeft for whatever columns were inserted/removed to its left.
  const anchorEl=cols[0]&&cols[0].el;
  const beforeLeft=anchorEl?anchorEl.getBoundingClientRect().left:0;
  Object.keys(cols).map(Number).forEach(lvl=>{
    if(lvl!==0){ cols[lvl].el.remove(); delete cols[lvl]; return; }
    for(const k of [...cols[0].keys]){          // stacks are rebuild-scoped; the landing
      if(!k.endsWith("::srcs")) continue;       // column persists, so evict its stacks
      cols[0].keys.delete(k);
      const el=document.getElementById(`card-0:${k}`); if(el) el.remove();
    }
  });
  edges=[]; edgeSeen.clear(); hover=null;   // rows re-render; next mousemove re-isolates (docked viewer rests)
  document.querySelectorAll(".card.open,.card.focus").forEach(c=>c.classList.remove("open","focus"));
  ctxOpen=new Set(); ctxDrill=new Map();
  const done=new Set();
  let changed=true;
  while(changed){
    changed=false;
    for(const lvl of Object.keys(cols).map(Number)){
      if(lvl===SYNTH) continue;
      for(const key of [...cols[lvl].keys]){
        const id=`${lvl}:${key}`;
        if(done.has(id)||!open.has(id)||!PAPERS[key]) continue;
        done.add(id); expandCard(lvl,key,PAPERS[key]); changed=true;
      }
    }
  }
  ensureBroadBand();                                 // keep the full synthesis band standing
  // apply visual state + drill regions for focused and context-opened cards
  for(const id of new Set([...open,...ctxOpen])){
    const el=document.getElementById("card-"+id);
    if(!el||!PAPERS[id.slice(id.indexOf(":")+1)]) continue;
    el.classList.add("open");
    if(open.has(id)) el.classList.add("focus");      // ctx-only cards: revealed, not focused
    renderSlices(id);
  }
  if(anchorEl){                                       // hold the anchor column visually still
    board.scrollLeft+=anchorEl.getBoundingClientRect().left-beforeLeft;
  }
  redraw();
}

// Where does `key` already sit? Prefer the instance nearest `near`; every paper is in
// the landing column, so level 0 is the guaranteed fallback.
function findCardLevel(key,near){
  let best=null;
  for(const lvl of Object.keys(cols).map(Number)){
    if(lvl===SYNTH||!cols[lvl].keys.has(key)) continue;
    if(best===null||Math.abs(lvl-near)<Math.abs(best-near)) best=lvl;
  }
  return best===null?0:best;
}

function expandCard(level,key,p){
  const cid=`card-${level}:${key}`;
  // LEFT — grounds spawn the previous generation. Curated sources get their own card; a
  // sharpened ref (tid) reveals the specific source slice there and anchors the edge on
  // it. Uncurated sources fold into one collapsed "▸ N sources" stack (citation-wall
  // collapse) — their edges anchor on the stack until the human unfolds it.
  const wall=[];
  (p.grounds||[]).forEach(g=>{
    if(!PAPERS[g.key]){ wall.push(g); return; }
    addPaper(level-1,g.key,"grounds ←");
    if(g.tid) reveal(`${level-1}:${g.key}`,g.tid);
    addEdge({cardId:`card-${level-1}:${g.key}`,sid:g.tid||null},{cardId:cid,sid:g.via},"leads");
  });
  if(wall.length){
    const sid=addStack(level-1,key,wall,"grounds ←");
    wall.forEach(g=>addEdge({cardId:sid,sid:g.key},{cardId:cid,sid:g.via},"leads"));
  }
  // LATERAL — never spawns a column: connect to the target wherever it already sits,
  // revealing the specific claim when the ref is sharpened (Kumar → Chen2021Sys:c1).
  (p.lateral||[]).forEach(l=>{
    const from={cardId:cid,sid:l.via};
    if(l.slug){                                      // stance toward a broad claim → synthesis band
      addBroad(SYNTH,l.slug,"synthesis · now →");
      addEdge(from,{cardId:`card-${SYNTH}:${l.slug}`,sid:null},l.sign);
      return;
    }
    const tl=findCardLevel(l.key,level);
    if(l.tid&&PAPERS[l.key]) reveal(`${tl}:${l.key}`,l.tid);
    addEdge(from,{cardId:`card-${tl}:${l.key}`,sid:l.tid||null},l.sign);
  });
  // ANSWERS — cross-paper claim→question: like lateral, never spawns a column. The target
  // question is context-revealed (an entry row, so opening its card suffices) and the
  // edge anchors on it; a broad-question target routes to the synthesis band.
  (p.ans||[]).forEach(a=>{
    const from={cardId:cid,sid:a.via};
    if(a.slug){
      addBroad(SYNTH,a.slug,"synthesis · now →");
      addEdge(from,{cardId:`card-${SYNTH}:${a.slug}`,sid:null},"answers");
      return;
    }
    const tl=findCardLevel(a.key,level);
    if(a.tid&&PAPERS[a.key]) reveal(`${tl}:${a.key}`,a.tid);
    addEdge(from,{cardId:`card-${tl}:${a.key}`,sid:a.tid||null},"answers");
  });
  // RIGHT — the papers that build on this one (inverted grounds) spawn the next
  // generation rightward; the edge runs ground→derived and sharpens as either side's
  // rows are drilled (b.tid = this paper's grounded slice, b.via = the building slice).
  (p.builds||[]).forEach(b=>{
    addPaper(level+1,b.key,"builds on →");
    addEdge({cardId:cid,sid:b.tid||null},{cardId:`card-${level+1}:${b.key}`,sid:b.via},"leads");
  });
  // RIGHTMOST — synthesis band; the edge sharpens to the generalizing claim once it's drilled
  (p.cons||[]).forEach(c=>{
    addBroad(SYNTH,c.slug,"synthesis · now →");
    addEdge({cardId:cid,sid:c.via},{cardId:`card-${SYNTH}:${c.slug}`,sid:null},"leads");
  });
}

// Context-reveal a sharpened target: open its card and force-expand the drill path from
// an entry row down to `sid` (climbing the local outline parents — the slice's dependents
// via `up`, or the broader claim it ladders into via `gen`), so the exact slice is on
// screen. If the target is itself an entry row, opening the card suffices.
function reveal(id,sid){
  ctxOpen.add(id);
  const p=PAPERS[id.slice(id.indexOf(":")+1)];
  if(!p) return;
  const dep={};
  p.slices.forEach(s=>{
    (s.up||[]).forEach(u=>{ (dep[u]=dep[u]||[]).push(s.id); });
    (s.gen||[]).forEach(g=>{ (dep[s.id]=dep[s.id]||[]).push(g); });
  });
  const chain=[sid];
  let cur=sid, guard=0;
  while(dep[cur]&&dep[cur].length&&guard++<64){ cur=dep[cur][0]; chain.push(cur); }
  chain.reverse();                                   // entry row … target
  let s=ctxDrill.get(id);
  if(!s){ s=new Set(); ctxDrill.set(id,s); }
  let path="";
  for(let i=0;i<chain.length-1;i++){                 // expand every row above the target
    path=path?`${path}/${chain[i]}`:chain[i];
    s.add(path);
  }
}

// ── edges ──────────────────────────────────────────────────────────────────────────────
// The slug of the isolated broad node (an active broad target carries sid===null), else null.
function broadIsoSlug(iso){
  if(!iso||iso.sid!==null) return null;
  const el=document.getElementById(iso.cardId);
  if(!el||!el.classList.contains("bn")) return null;
  const id=el.dataset.id||"";
  return id.slice(id.indexOf(":")+1)||null;
}
// Isolated broad node: synthesize an edge to every linked paper NOT already wired to this node
// by a real (expanded-paper) edge, anchored on its card wherever it sits — so collapsed
// landing-column papers light up and connect too, not just the expanded ones.
function broadExtraEdges(iso,slug){
  const have=new Set();
  for(const e of edges){
    const other=e.to.cardId===iso.cardId?e.from:(e.from.cardId===iso.cardId?e.to:null);
    if(other){ const oc=document.getElementById(other.cardId); if(oc&&oc.dataset.key) have.add(oc.dataset.key); }
  }
  const extra=[];
  for(const lk of (BROAD_LINKS[slug]||[])){
    if(have.has(lk.key)) continue;
    have.add(lk.key);                              // one arrow per paper, even if several slices feed the node
    const cardId=`card-${findCardLevel(lk.key,0)}:${lk.key}`;
    if(document.getElementById(cardId))
      extra.push({from:{cardId,sid:null},to:{cardId:iso.cardId,sid:null},kind:lk.kind});
  }
  return extra;
}
function redraw(){
  const bb=board.getBoundingClientRect();
  const W=board.scrollWidth, H=board.scrollHeight;
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  // arrowheads
  const defs=document.createElementNS(NS,"defs");
  defs.innerHTML=`
    <marker id="ar" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${cssv('--grounded')}"/></marker>
    <marker id="arx" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${cssv('--cross')}"/></marker>
    <marker id="arq" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${cssv('--question')}"/></marker>`;
  svg.appendChild(defs);
  // Isolation: the bright set is every pinned target (persisted, accumulating) ∪ the current
  // hover (transient). An edge incident on any target is drawn bright and its counterpart card
  // gets .hl; every other edge stays dim — faint scaffolding rather than a bright tangle.
  pin=pin.filter(p=>document.getElementById(p.cardId));       // drop pins whose card is gone
  const targets=hover?[...pin,hover]:pin;
  const atT=(end,t)=>end.cardId===t.cardId&&end.sid===t.sid;
  const isTarget=end=>targets.some(t=>atT(end,t));
  const inc=e=>targets.some(t=>atT(e.from,t)||atT(e.to,t));   // incident on any target
  document.querySelectorAll(".hl").forEach(el=>el.classList.remove("hl"));
  let work=edges.slice();
  for(const t of targets){                                    // broad target → connect collapsed papers too
    const slug=broadIsoSlug(t);
    if(slug) work=work.concat(broadExtraEdges(t,slug));
  }
  work.sort((a,b)=>(inc(a)?1:0)-(inc(b)?1:0));     // draw incident (bright) last → on top of dim
  for(const e of work){
    const on=inc(e);                               // incident → bright; every other edge stays dim
    const ra=anchorRect(e.from), rb=anchorRect(e.to);
    if(!ra||!rb) continue;                          // no visible endpoint yet
    // Both ends name a specific slice but neither is on screen (e.g. a source→method grounding
    // while the sources stack is collapsed and methods aren't entry rows): the edge has no row
    // to land on, so both ends fall back to their card and it collapses onto the identical
    // container→container line — piling up with its siblings into one opaque, never-dimming
    // arrow at the card border. Skip it until a drill reveals a row for it to sharpen onto.
    if(e.from.sid && e.to.sid && !rowVisible(e.from) && !rowVisible(e.to)) continue;
    if(on){                                         // light up each non-target endpoint's card
      for(const end of [e.from,e.to]){
        const oc=document.getElementById(end.cardId);
        if(oc&&!isTarget(end)) oc.classList.add("hl");
      }
    }
    const ya=(ra.top+ra.bottom)/2-bb.top+board.scrollTop;
    const yb=(rb.top+rb.bottom)/2-bb.top+board.scrollTop;
    const contra=e.kind==="contra"||e.kind==="contradict";
    const ans=e.kind==="answers";
    const lat=e.kind==="corr"||contra;
    let d;
    if(Math.abs((ra.left+ra.right)-(rb.left+rb.right))<80){
      // same column (e.g. a lateral edge between two landing cards): bow out the right side
      const x1=ra.right-bb.left+board.scrollLeft, x2=rb.right-bb.left+board.scrollLeft;
      const bow=Math.max(x1,x2)+26;
      d=`M${x1},${ya} C${bow},${ya} ${bow},${yb} ${x2},${yb}`;
    } else {                                          // cross-paper: connect the facing edges
      const aLeft=(ra.left+ra.right)/2 < (rb.left+rb.right)/2;
      const x1=(aLeft?ra.right:ra.left)-bb.left+board.scrollLeft;
      const x2=(aLeft?rb.left:rb.right)-bb.left+board.scrollLeft;
      const mx=(x1+x2)/2;
      d=`M${x1},${ya} C${mx},${ya} ${mx},${yb} ${x2},${yb}`;
    }
    const path=document.createElementNS(NS,"path");
    path.setAttribute("d",d);
    path.setAttribute("fill","none");
    path.setAttribute("stroke",contra?cssv('--cross'):ans?cssv('--question'):cssv('--grounded'));
    path.setAttribute("stroke-width","1.6");
    if(lat) path.setAttribute("stroke-dasharray","5 4");
    else if(ans) path.setAttribute("stroke-dasharray","2 3");   // dotted: answers ≠ support
    path.setAttribute("opacity",on?(lat||ans?"0.85":"0.95"):"0.2");    // incident bright; dim floor lifted for the light canvas
    if(ans) path.setAttribute("marker-end","url(#arq)");
    else if(!lat) path.setAttribute("marker-end","url(#ar)");
    else if(contra) path.setAttribute("marker-end","url(#arx)");
    svg.appendChild(path);
  }
}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
// Resolve an endpoint: the first visible row carrying the endpoint's sid — a slice row
// (drilled rows may render the same slice at several paths) or a stack's source row —
// else the card itself. Falling back to the card is what keeps un-drilled edges aggregate.
function anchorRect(end){
  const card=document.getElementById(end.cardId);
  if(!card) return null;
  if(end.sid){
    for(const rowEl of card.querySelectorAll(`[data-sid="${end.sid}"]`)){
      const r=rowEl.getBoundingClientRect();
      if(r.width>0) return r;
    }
  }
  const r=card.getBoundingClientRect();
  return r.width>0?r:null;
}
// True iff the endpoint's sid resolves to an on-screen row (not the container fallback) — lets
// redraw() tell a sharpened edge from one that merely fell back to the card.
function rowVisible(end){
  const card=end.sid&&document.getElementById(end.cardId);
  if(!card) return false;
  for(const rowEl of card.querySelectorAll(`[data-sid="${end.sid}"]`))
    if(rowEl.getBoundingClientRect().width>0) return true;
  return false;
}

// ── tooltip ────────────────────────────────────────────────────────────────────────────
// Served over HTTP (`lit serve`), the tooltip upgrades: pdfs.json says which curated
// papers have a servable PDF, hovering embeds its first page, clicking the preview opens
// the full PDF in a new tab. Opened from file:// (`lit build` output) it stays inert.
const LIVE = location.protocol.startsWith("http");
// touch/no-hover devices synthesize mouseenter/move on tap (iOS), which would pin a sticky
// tooltip and latch soft previews. Hover-only affordances are gated on a real hover pointer;
// the load-bearing actions (tap to open/pin) are click/pointer-based and unaffected.
const HOVER = matchMedia("(hover: hover)").matches;
// COCKPIT = terminal features available (a ttyd is up), injected by `lit serve` as GRAPH.cockpit
// ({term_port}). It means the in-progress zone can embed a per-paper terminal — NOT that the whole
// window is a curate mode. The browse view stays the graph; the cockpit is a per-paper *place*.
const COCKPIT = GRAPH.cockpit || null;
// DRIVE: this document is the zone's left card — an iframe of /preview.html?key=…&drive=1. In DRIVE
// mode a quote-click POSTs the weld to the focus wire (aiming the PARENT zone's PDF pane); it mounts
// no pane and polls nothing itself. The top-level browse document is never DRIVE.
const DRIVE = LIVE && new URLSearchParams(location.search).has("drive");
// the move (delta §3): papers on the in-progress worklist are pulled OUT of the browse view —
// they live in the in-progress zone, not the graph. The DRIVE card shows one isolated (active)
// paper, so it must not filter; a static build carries no active list, so this is empty there.
const ACTIVE = new Set(DRIVE ? [] : (GRAPH.active || []));
// the embedded terminal (ttyd) origin — port from the cockpit payload, else ?term=, else 7682
// (7681 is often a system login ttyd). The pane loads <origin>/?arg=<citekey>, which ttyd passes
// to the seed-or-resume wrapper as the paper to curate.
const TERM_PORT = (COCKPIT && COCKPIT.term_port) || new URLSearchParams(location.search).get("term") || "7682";
const TERM_ORIGIN = location.protocol + "//" + location.hostname + ":" + TERM_PORT;
// the collapsible PDF viewer lives in the browse view only — the zone has its own focus pane, and
// the DRIVE card drives that pane rather than owning one.
const pdfToggle = document.getElementById("pdfToggle");
if (pdfToggle && LIVE && !DRIVE) {
  pdfToggle.hidden = false;
  pdfToggle.addEventListener("click", toggleDock);
}
let PDFS = null;                       // Set of citekeys with a PDF (null until fetched)
if (LIVE) fetch("pdfs.json").then(r => r.ok ? r.json() : [])
  .then(l => { PDFS = new Set(l); }).catch(() => { PDFS = new Set(); });
// The tip must survive the hop from card to tip (to click the preview): hiding is
// deferred a beat (dropTip) and cancelled when the pointer arrives (keepTip).
let tipHide = null;
function keepTip(){ if (tipHide) { clearTimeout(tipHide); tipHide = null; } }
function dropTip(){
  keepTip();
  tipHide = setTimeout(() => { tip.style.display = "none"; tip.dataset.key = ""; }, 140);
}
tip.addEventListener("mouseenter", keepTip);
tip.addEventListener("mouseleave", () => { tip.style.display = "none"; tip.dataset.key = ""; });
// touch: a tap-pinned tip (from a stub) has no mouseleave — dismiss it on the next tap that
// isn't inside the tip or on another stub (capture, so it beats the stub's own re-show handler).
addEventListener("click", e => {
  if (!HOVER && tip.style.display === "block"
      && !e.target.closest("#tip") && !e.target.closest(".card.stub")) {
    tip.style.display = "none"; tip.dataset.key = "";
  }
}, true);

// The hover preview is a pure metadata card now — title · all authors · journal · year · a
// (non-clickable) first-page thumbnail. Opening the PDF is the docked viewer's job (a card click
// loads it), so the tip no longer opens anything; it's a bib peek that holds still under the pointer.
function showTip(e, key, el, force){
  if (!HOVER && !force) return;        // touch: only the explicit tap-to-pin path (force) shows the tip
  keepTip();
  tip.style.display = "block";
  if (tip.dataset.key === key) return; // pinned: hold still while the same target is hovered
  tip.dataset.key = key;
  const cur = !!(PAPERS[key] && PAPERS[key].cur);
  const p = PAPERS[key] || STUBS[key];
  let thumb;
  if (!cur) thumb = `<div class="nopdf">uncurated stub — bib metadata only</div>`;
  else if (!LIVE) thumb = `<div class="nopdf">PDF preview needs <code>lit serve</code></div>`;
  else if (!PDFS || !PDFS.has(key)) thumb = `<div class="nopdf">no PDF served (${key}.pdf)</div>`;
  else thumb = `<div class="pdf live"><img src="preview/${key}.png" alt="first page of ${key}.pdf"></div>`;
  const auth = (cur && p.authors && p.authors.length) ? `<div class="tauth">${authLine(p.authors)}</div>` : "";
  const bib = [p.journal || venueFromKey(key), p.year].filter(Boolean).join(" · ");
  tip.innerHTML = `<div class="ttitle">${p.title || key}</div>${auth}`
                + `<div class="meta">${bib}</div>${thumb}`;
  // pin beside the hovered card — right of it, flipping left when there's no room — NOT
  // at the cursor, so the pointer can travel into the tip to read a long author list
  const r = ((el && el.closest(".card")) || el || e.target).getBoundingClientRect();
  const pad = 10, w = 300, h = tip.offsetHeight;
  let x = r.right + pad;
  if (x + w > innerWidth) x = r.left - w - pad;
  x = Math.max(8, Math.min(x, innerWidth - w - 8));
  const y = Math.max(54, Math.min(e.clientY - 24, innerHeight - h - 8));
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

// ── PDF quote location resolution ────────────────────────────────────────────────────────
// A slice's weld is no longer shown as text — the PDF *is* the link. The quote's location is
// resolved from its stored quote_loc (lit locate) or live server-side (/resolve → page +
// highlight rects) and cached per session; the page is rendered by /page/<key>/<n>.png.
// Live only — needs `lit serve`.
const locCache = new Map();                        // "key:sid" -> {page,rects} | null (a miss)
async function resolveLoc(key, sid){
  const qid = `${key}:${sid}`;
  if (locCache.has(qid)) return locCache.get(qid);
  const s = (PAPERS[key] && PAPERS[key].slices || []).find(x => x.id === sid);
  let loc = null;
  if (s && s.loc && s.loc.rects && s.loc.rects.length) {
    loc = s.loc;                                   // stored (lit locate) — exact + instant
  } else if (s && s.quote) {
    try { loc = await fetch("resolve", {method: "POST",   // not yet stored → resolve live
      body: JSON.stringify({citekey: key, quote: s.quote})}).then(r => r.ok ? r.json() : null); }
    catch { loc = null; }
  }
  locCache.set(qid, loc); return loc;
}
const idKey = cardId => cardId.slice(cardId.indexOf(":") + 1);

// ── collapsible PDF viewer (browse view, live-only) ──────────────────────────────────────
// One docked pane on the right, toggled from the HUD. While OPEN, hovering a quote-slice aims
// it at that claim's citation (resolveLoc → mountDoc, the same full-document viewer a curate
// focus uses); while collapsed, hover is inert. No floating windows and no /focus round-trip —
// the browse view has no terminal to keep in sync, so hover drives mountDoc directly. The pane
// rests on the last-hovered claim when the pointer leaves; a non-quote row leaves it put.
let dockOpen = false, dockWin = null, dockShown = null, dockReq = null, dockTimer = null;
let dockDoc = null, dockRefitTimer = null;             // dockDoc = last mount {key,page,rects} (for refit)
function openDock(){
  if (dockOpen) return;
  dockOpen = true; document.body.classList.add("dock-open");
  if (pdfToggle) pdfToggle.classList.add("on");
}
function closeDock(){
  dockOpen = false; document.body.classList.remove("dock-open");
  if (pdfToggle) pdfToggle.classList.remove("on");
  clearTimeout(dockTimer);
  if (dockWin) { dockWin.remove(); dockWin = null; }
  dockShown = null; dockReq = null; dockDoc = null;
}
function toggleDock(){ dockOpen ? closeDock() : openDock(); }
// (re)mount the dock's remembered doc at the current width — buildWin is fresh each time so
// listeners never stack. Used by aimDock/loadDock and by the resize re-fit.
function mountDockDoc(){
  if (!dockDoc) return;
  const d = dockDoc;
  if (dockWin) dockWin.remove();
  dockWin = buildWin(d.key, d.rects.length ? `p.${d.page + 1}` : "full paper", {onClose: closeDock});
  dockWin.classList.add("pw-side");                    // fixed right pane (CSS) — before mount
  mountDoc(dockWin, d.key, d.page, d.rects.slice(), {interactive: true});
}
function scheduleDockRefit(){ clearTimeout(dockRefitTimer);
  dockRefitTimer = setTimeout(() => { if (dockOpen && dockDoc) mountDockDoc(); }, 140); }
// Opening a card loads its whole PDF into the dock (page 1, no highlight) — the coarse "show me
// this paper" entry; hovering a quote-slice still fine-aims the open dock at that exact quote.
function loadDock(key){
  if (DRIVE || !LIVE || !(PDFS && PDFS.has(key))) return;   // DRIVE card has no dock; nothing servable → skip
  openDock();
  const qid = `${key}:__paper__`;
  if (qid === dockShown) return;
  clearTimeout(dockTimer); dockReq = qid;
  dockDoc = {key, page: 0, rects: []};
  mountDockDoc();
  dockShown = qid;
}

// hover a quote-slice → aim the open dock at it (debounced so pass-through hovers don't thrash)
function aimDockFromHover(h){
  clearTimeout(dockTimer);
  if (!dockOpen || !HOVER) return;
  const key = h && h.sid ? idKey(h.cardId) : null;
  const s = key ? (PAPERS[key] && PAPERS[key].slices || []).find(x => x.id === h.sid) : null;
  if (!LIVE || !s || !s.quote) return;             // non-quote row / card body: leave the pane put
  dockTimer = setTimeout(() => aimDock(key, h.sid), 180);
}
async function aimDock(key, sid){
  const qid = `${key}:${sid}`;
  if (qid === dockShown) return;                    // already parked on this claim
  dockReq = qid;
  const loc = await resolveLoc(key, sid) || {page: 0, rects: []};
  if (dockReq !== qid || !dockOpen) return;         // hover moved on / dock closed while resolving
  dockDoc = {key, page: loc.page || 0, rects: loc.rects.slice()};
  mountDockDoc();
  dockShown = qid;
}
// dock width resize (persisted): the grip sits on the dock's left seam; drag sets --dock-w, and the
// PDF re-fits on release / window resize (same baked-W0 re-mount the cockpit uses).
if (LIVE && !DRIVE) {
  const grip = document.getElementById("dockGrip");
  const DW_KEY = "lit.dock.w";
  try { const v = parseFloat(localStorage.getItem(DW_KEY));
        if (v > 0.15 && v < 0.85) document.body.style.setProperty("--dock-w", (v * 100) + "%"); } catch {}
  if (grip) grip.addEventListener("pointerdown", e => {
    e.preventDefault();
    document.body.classList.add("dock-resizing");
    const move = ev => {
      const f = Math.min(0.75, Math.max(0.2, (innerWidth - ev.clientX) / innerWidth));
      document.body.style.setProperty("--dock-w", (f * 100) + "%");
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      document.body.classList.remove("dock-resizing");
      const cur = parseFloat(getComputedStyle(document.body).getPropertyValue("--dock-w"));
      try { localStorage.setItem(DW_KEY, (cur / 100).toString()); } catch {}
      scheduleDockRefit();
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
  addEventListener("resize", () => { if (dockOpen) scheduleDockRefit(); });
}

// ── the move: right-click a curated card → curate it (serve, browse view) ─────────────────
// "Curate this paper" adds the citekey to [curation] active (POST /active); the paper then
// leaves the browse view (filtered at boot, above) and lives in the in-progress set. Curated-
// only for now — a stub has no local subgraph to curate. A reload settles the graph without it.
const ctxmenu = document.getElementById("ctxmenu");
function hideCtxMenu(){ ctxmenu.style.display = "none"; ctxmenu.onclick = null; }
function showCurateMenu(e, key){
  e.preventDefault();
  ctxmenu.innerHTML = `<button data-act="curate">Curate this paper</button>`;
  ctxmenu.style.display = "block";
  const w = ctxmenu.offsetWidth || 150, h = ctxmenu.offsetHeight || 34;
  ctxmenu.style.left = Math.min(e.clientX, innerWidth - w - 8) + "px";
  ctxmenu.style.top = Math.min(e.clientY, innerHeight - h - 8) + "px";
  ctxmenu.onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    hideCtxMenu();
    if (b.dataset.act === "curate") moveToCurate(key);
  };
}
async function moveToCurate(key){
  try {
    const r = await fetch("active", {method: "POST",
      body: JSON.stringify({citekey: key, active: true})}).then(r => r.ok ? r.json() : null);
    if (r && r.ok) location.reload();          // the paper leaves the graph; reload settles the view
    else alert(`could not move ${key} into curation`);
  } catch { alert("server unreachable — is lit serve running?"); }
}
addEventListener("click", hideCtxMenu);          // any left-click dismisses the menu
addEventListener("scroll", hideCtxMenu, true);   // scrolling the board dismisses it too

// ── focus channel (serve-only) ───────────────────────────────────────────────────────────
// A shared "aim the PDF here" wire the agent (via `lit focus`) and the zone's left-card clicks
// both drive: the server holds one {citekey, quote, loc, seq}; while the zone is open we poll it
// and re-aim ONE reused pane docked in the zone's top-right cell. `seq` is the change-detector —
// unchanged → do nothing, so an idle session never repaints. A null loc is the graceful floor:
// open the paper at its top, no highlight. Polling runs ONLY inside the zone (zoneOpen); the
// browse view and the DRIVE card never poll — the browse view has no pane to aim.
let focusWin = null, focusSeq = 0, zoneOpen = false, lastFocus = null;
function closeFocusWin(){ if (focusWin) { focusWin.remove(); focusWin = null; } }
function aimFocus(f){
  if (!f.citekey || !zoneOpen) return;
  lastFocus = f;                                       // remember it so a resize can re-fit (re-mount)
  closeFocusWin();
  const loc = (f.loc && f.loc.rects) ? f.loc : {page: 0, rects: []};
  const win = buildWin(f.citekey, loc.rects.length ? `p.${loc.page + 1}` : "quote not located",
                       {onClose: closeFocusWin});
  win.classList.add("pw-zone");                        // absolute-fill the .wo-pdf cell (CSS)
  document.querySelector("#wipOverlay .wo-pdf").appendChild(win);   // re-parent out of <body>
  mountDoc(win, f.citekey, loc.page || 0, loc.rects.slice(), {interactive: true});
  focusWin = win;
}
// Point the zone's embedded terminal at a paper's session — only on a citekey *change*, so
// re-aiming the PDF pane to another quote (or another paper) never reloads the iframe and kills
// the session you're typing in. A new paper → ttyd runs the wrapper for it (seed or --continue).
// The terminal stays on the ZONE's paper even when the PDF pane roams to a cited paper.
let termKey = null;
function setTerm(key){
  if (!COCKPIT || !key || key === termKey) return;
  termKey = key;
  const box = document.querySelector("#wipOverlay .wo-term");
  let f = box.querySelector("iframe");
  if (!f) { box.textContent = ""; f = document.createElement("iframe"); f.title = "curation terminal"; box.appendChild(f); }
  f.src = TERM_ORIGIN + "/?arg=" + encodeURIComponent(key);
}
async function pollFocus(){
  if (!zoneOpen) return;
  let f; try { f = await fetch("focus").then(r => r.ok ? r.json() : null); } catch { return; }
  if (!f || f.seq === focusSeq) return;
  focusSeq = f.seq;
  aimFocus(f);
}
// The zone's left card (DRIVE) driving the wire: POST the slice's weld to /focus so the parent
// zone's poll re-aims the pane — the same code path `lit focus` uses, so clicks and the agent
// stay in one truth. (Runs in the DRIVE iframe; the fetch is same-origin to the serve.)
async function focusFromClick(key, sid){
  const s = (PAPERS[key] && PAPERS[key].slices || []).find(x => x.id === sid);
  try {
    await fetch("focus", {method: "POST",
      body: JSON.stringify({citekey: key, quote: (s && s.quote) || ""})});
  } catch { /* server gone — leave the pane as-is */ }
}

// ── zone panes: keep the docked PDF fit to its cell + Hyprland-style divider resize ──────────
// mountDoc bakes its fit-width (W0) at mount, so a re-fit means a cheap re-mount at the current
// width. One debounced re-fit serves all triggers; the ResizeObserver below fires it on first
// layout (fixes an initial under-fill), window resize, AND a divider drag — no manual plumbing.
let refitTimer = null;
function scheduleRefit(){ clearTimeout(refitTimer);
  refitTimer = setTimeout(() => { if (zoneOpen && lastFocus) aimFocus(lastFocus); }, 140); }
if (LIVE && !DRIVE) {
  const woBody = document.querySelector("#wipOverlay .wo-body");
  const pdfCell = woBody.querySelector(".wo-pdf");
  // divider state (persisted): cL = left column's share of the two columns; rT = the PDF row's share.
  const RS_KEY = "lit.zone.split";
  let split = {cL: 0.42, rT: 0.58};
  try { const s = JSON.parse(localStorage.getItem(RS_KEY) || "null"); if (s && s.cL > 0 && s.rT > 0) split = s; } catch {}
  const applySplit = () => {
    woBody.style.gridTemplateColumns = `${split.cL}fr 6px ${1 - split.cL}fr`;
    woBody.style.gridTemplateRows = `${split.rT}fr 6px ${1 - split.rT}fr`;
  };
  applySplit();
  const beginResize = (e, axisX, axisY) => {           // the divider follows the pointer (abs, not delta)
    e.preventDefault();
    const r = woBody.getBoundingClientRect();
    woBody.classList.add("resizing");
    const prevCur = document.body.style.cursor;
    document.body.style.cursor = axisX && axisY ? "nwse-resize" : axisX ? "ew-resize" : "ns-resize";
    document.body.style.userSelect = "none";
    const move = ev => {
      if (axisX) split.cL = Math.min(0.85, Math.max(0.15, (ev.clientX - r.left) / r.width));
      if (axisY) split.rT = Math.min(0.85, Math.max(0.15, (ev.clientY - r.top) / r.height));
      applySplit();
    };
    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      woBody.classList.remove("resizing");
      document.body.style.cursor = prevCur; document.body.style.userSelect = "";
      try { localStorage.setItem(RS_KEY, JSON.stringify(split)); } catch {}
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  };
  woBody.querySelector(".wo-rs-c").addEventListener("pointerdown", e => beginResize(e, true, false));
  woBody.querySelector(".wo-rs-r").addEventListener("pointerdown", e => beginResize(e, false, true));
  woBody.querySelector(".wo-rs-x").addEventListener("pointerdown", e => beginResize(e, true, true));
  let lastW = 0;                                        // re-fit only on a real width change
  new ResizeObserver(() => {
    const w = pdfCell.clientWidth;
    if (Math.abs(w - lastW) < 2) return;
    lastW = w; scheduleRefit();
  }).observe(pdfCell);
}

// A window shell: titlebar (key · page · pan/text tools · ×) + a scrollable body holding a sizer
// (owns the scroll extent) and a stage (image + highlights + text layer, under one scale). Both
// callers dock it via CSS (curate focus pane / browse viewer); `at` seeds a free-floating place
// for any future caller, but a docked pane's !important rules win over it.
function buildWin(key, sub, {onClose, at} = {}){
  const win = document.createElement("div");
  win.className = "pw";
  win.dataset.tool = "pan";
  win.innerHTML =
    `<div class="pw-bar"><b>${key}</b><span class="pw-sub">${sub}</span><span class="sp"></span>`
    + `<span class="pw-tools"><button class="pw-tool" data-t="pan" title="pan (drag)">✥</button>`
    + `<button class="pw-tool" data-t="text" title="select text">I</button></span>`
    + `<span class="pw-x" title="close">×</span>`
    + `</div><div class="pw-body"><div class="pw-loading">rendering page…</div>`
    + `<div class="pw-sizer"><div class="pw-stage"></div></div></div>`
    + `<div class="pw-grip"></div>`;
  document.body.appendChild(win);
  if (at) { win.style.left = at.left + "px"; win.style.top = at.top + "px"; }
  dragBy(win.querySelector(".pw-bar"), (dx, dy, l, t) => { win.style.left = l + dx + "px"; win.style.top = t + dy + "px"; },
         () => [win.offsetLeft, win.offsetTop], ".pw-x,.pw-tool");
  dragBy(win.querySelector(".pw-grip"), (dx, dy, w, h) => { win.style.width = Math.max(240, w + dx) + "px"; win.style.height = Math.max(160, h + dy) + "px"; },
         () => [win.offsetWidth, win.offsetHeight]);
  win.querySelector(".pw-x").addEventListener("click", onClose);
  return win;
}

// Render page `page` into `win`'s scroll body: the page image + highlight overlays (page
// fractions) live on a fixed-base-width stage; a sizer sibling owns the scroll extent and a
// single scale() transform does zoom, so highlights and the text layer never need per-element
// recompute. Opens at fit-width with the highlight scrolled into view. opts.interactive wires
// ctrl/⌘-wheel zoom + drag-pan + the pan/text tool toggle (skipped for the soft preview).
function mountPage(win, key, page, rects, opts){
  const body = win.querySelector(".pw-body");
  const sizer = win.querySelector(".pw-sizer"), stage = win.querySelector(".pw-stage");
  const img = new Image(); img.className = "pw-img"; stage.appendChild(img);
  for (const r of rects) {
    const hl = document.createElement("div"); hl.className = "pw-hl";
    hl.style.left = (r[0] * 100) + "%"; hl.style.top = (r[1] * 100) + "%";
    hl.style.width = ((r[2] - r[0]) * 100) + "%"; hl.style.height = ((r[3] - r[1]) * 100) + "%";
    stage.appendChild(hl);
  }
  const view = {z: 1, W0: 0, H0: 0};             // W0/H0 = base (fit-width) page size in px
  let ready; win._ready = new Promise(r => ready = r);   // text layer waits on W0/H0 being known
  const zoomTo = (z1, cx, cy) => {               // zoom around viewport point (cx,cy), keep it fixed
    z1 = Math.max(1, Math.min(12, z1));          // min zoom = fit-width (never a stamp in grey)
    const z0 = view.z, ax = body.scrollLeft + cx, ay = body.scrollTop + cy;
    sizer.style.width = view.W0 * z1 + "px"; sizer.style.height = view.H0 * z1 + "px";
    stage.style.transform = `scale(${z1})`;
    body.scrollLeft = ax / z0 * z1 - cx; body.scrollTop = ay / z0 * z1 - cy;
    view.z = z1;
  };
  img.onload = () => {
    const load = win.querySelector(".pw-loading"); if (load) load.remove();
    view.W0 = body.clientWidth;                  // fit-width (scrollbar-gutter keeps this stable)
    view.H0 = view.W0 * (img.naturalHeight / img.naturalWidth);
    stage.style.width = view.W0 + "px"; stage.style.transform = "scale(1)"; view.z = 1;
    sizer.style.width = view.W0 + "px"; sizer.style.height = view.H0 + "px";
    if (rects.length) {                          // scroll so the highlight sits centered in view
      let y0 = 1, y1 = 0; for (const r of rects) { y0 = Math.min(y0, r[1]); y1 = Math.max(y1, r[3]); }
