  e.preventDefault();
  ctxmenu.innerHTML = `<button data-act="curate">Curate this paper</button>`;
  ctxmenu.style.display = "block";
  const w = ctxmenu.offsetWidth || 150, h = ctxmenu.offsetHeight || 34;
  ctxmenu.style.left = Math.min(e.clientX, innerWidth - w - 8) + "px";
  ctxmenu.style.top = Math.min(e.clientY, innerHeight - h - 8) + "px";
  ctxmenu.onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    hideCtxMenu();
    if (b.dataset.act === "curate") moveToCurate(key);
  };
}
async function moveToCurate(key){
  try {
    const r = await fetch("active", {method: "POST",
      body: JSON.stringify({citekey: key, active: true})}).then(r => r.ok ? r.json() : null);
    if (r && r.ok) location.reload();          // the paper leaves the graph; reload settles the view
    else alert(`could not move ${key} into curation`);
  } catch { alert("server unreachable — is lit serve running?"); }
}
addEventListener("click", hideCtxMenu);          // any left-click dismisses the menu
addEventListener("scroll", hideCtxMenu, true);   // scrolling the board dismisses it too

// ── focus channel (serve-only) ───────────────────────────────────────────────────────────
// A shared "aim the PDF here" wire the agent (via `lit focus`) and the card window's quote-clicks
// both drive: the server holds one {citekey, quote, loc, seq}, and the PDF *window* polls it (see
// the PDFWIN block below) and re-mounts on a change. `seq` is the change-detector — unchanged →
// do nothing, so an idle session never repaints. A null loc is the graceful floor: open the paper
// at its top, no highlight. One wire, one PDF window: whoever aims it, everyone sees the same page.
//
// The card window (DRIVE) driving the wire: POST the slice's weld to /focus so the PDF window's
// poll re-aims it — the same code path `lit focus` uses, so clicks and the agent stay in one truth.
async function focusFromClick(key, sid){
  const s = (PAPERS[key] && PAPERS[key].slices || []).find(x => x.id === sid);
  try {
    await fetch("focus", {method: "POST",
      body: JSON.stringify({citekey: key, quote: (s && s.quote) || ""})});
  } catch { /* server gone — leave the PDF window as-is */ }
}

// A window shell: titlebar (key · page · pan/text tools · ×) + a scrollable body holding a sizer
// (owns the scroll extent) and a stage (image + highlights + text layer, under one scale). Both
// callers dock it via CSS (curate focus pane / browse viewer); `at` seeds a free-floating place
// for any future caller, but a docked pane's !important rules win over it.
function buildWin(key, sub, {onClose, at, onDetach} = {}){
  const win = document.createElement("div");
  win.className = "pw";
  win.dataset.tool = "pan";
  const detach = onDetach ? `<button class="pw-tool" data-t="detach" title="detach to its own window">⧉</button>` : "";
  // The find button and bar are chrome, so they're built here — but they stay hidden until a
  // mount claims them: only the whole-document view (mountDoc) can honestly search a PDF, and
  // the single-page fallback would otherwise offer a search over 1/20th of the paper.
  // Same rule for the zoom stepper: wireZoom reveals it, so the hover tooltip's soft preview —
  // which mounts non-interactively — doesn't advertise a control that does nothing there.
  win.innerHTML =
    `<div class="pw-bar"><b>${key}</b><span class="pw-sub">${sub}</span><span class="sp"></span>`
    + `<span class="pw-zoom" hidden title="zoom this PDF — drag, ctrl/⌘-wheel, or + / − / 0">`
    + `<input type="range" min="0" max="1000" step="1" value="0">`
    + `<span class="pz-val" title="back to fit-width (0)">100%</span></span>`
    + `<span class="pw-tools"><button class="pw-tool" data-t="find" title="find in this PDF (ctrl/⌘-F)" hidden>🔍</button>`
    + `<button class="pw-tool" data-t="pan" title="pan (drag)">✥</button>`
    + `<button class="pw-tool" data-t="text" title="select text">I</button>${detach}</span>`
    + `<span class="pw-x" title="close">×</span>`
    + `</div>`
    + `<div class="pw-find"><input type="search" placeholder="find in this PDF"`
    + ` autocomplete="off" spellcheck="false" enterkeyhint="search">`
    + `<span class="pw-fn"></span>`
    + `<button class="pw-fb" data-f="prev" title="previous (shift-enter)">‹</button>`
    + `<button class="pw-fb" data-f="next" title="next (enter)">›</button>`
    + `<button class="pw-fb" data-f="close" title="close (esc)">×</button></div>`
    + `<div class="pw-body"><div class="pw-loading">rendering page…</div>`
    + `<div class="pw-sizer"><div class="pw-stage"></div></div></div>`
    + `<div class="pw-grip"></div>`;
  document.body.appendChild(win);
  if (at) { win.style.left = at.left + "px"; win.style.top = at.top + "px"; }
  dragBy(win.querySelector(".pw-bar"), (dx, dy, l, t) => { win.style.left = l + dx + "px"; win.style.top = t + dy + "px"; },
         // the guard names every control ON the titlebar: the bar is a drag handle, and dragBy
         // eats the pointerdown, so anything left out of this list can never be clicked or dragged
         () => [win.offsetLeft, win.offsetTop], ".pw-x,.pw-tool,.pw-zoom");
  dragBy(win.querySelector(".pw-grip"), (dx, dy, w, h) => { win.style.width = Math.max(240, w + dx) + "px"; win.style.height = Math.max(160, h + dy) + "px"; },
         () => [win.offsetWidth, win.offsetHeight]);
  win.querySelector(".pw-x").addEventListener("click", onClose);
  if (onDetach) win.querySelector('.pw-tool[data-t=detach]').addEventListener("click", onDetach);
  return win;
}

// A zoom slider's track is LOG-spaced, and both zooms use this to map one. Zoom multiplies: half
// and double are the same move in opposite directions, so they have to sit the same distance
// either side of 100%. A linear track would crush the entire zoom-out half of the board's range
// into a fifth of the bar and give the last stretch of zoom-in most of it — the reader would be
// fighting the control at exactly the end they reach for when the board stops fitting.
// 0..1000 ticks is finer than any track is wide, so the slider is continuous in practice.
const zoomSlider = {
  toTrack: (z, min, max) => Math.round(1000 * Math.log(z / min) / Math.log(max / min)),
  toZoom(v, min, max){
    const z = min * Math.pow(max / min, v / 1000);
    return Math.abs(Math.log(z)) < 0.04 ? 1 : z;   // 100% is worth being able to land on by hand
  },
};

// ── zoom, shared by both PDF mounts ──────────────────────────────────────────────────────
// Both mounts lay a page out the same way — a sizer owning the scroll extent, a stage under one
// scale() — so the zoom is one function over that pair, and the only thing they differ on
// arrives as `sharpen`: what "fetch it sharper" means when the reader zooms past the rung the
// raster was cut at (one image, or every page currently on screen).
// This is NOT the board's zoom (BOARD_ZOOM). They sit side by side and are read from different
// distances — a page at 200% beside a board at 60% is the ordinary way to curate — so they
// share no state, no control and no key.
// Remembered across mounts, because aiming at the next quote is not a request to stand back up:
// without that, every hover reset the page to fit-width and the zoom read as not being there.
// Fit-width stays the floor: below it a page is a stamp in a field of grey, and the dock is
// already as narrow as the reading ever gets.
function wireZoom(win, view, {body, sizer, stage, sharpen, interactive = true}){
  const MIN = 1, MAX = 12, STEP = 1.35, KEY = "lit.pdf.zoom";
  const ctl = interactive ? win.querySelector(".pw-zoom") : null;
  const slider = ctl && ctl.querySelector("input");
  const clamp = z => Math.max(MIN, Math.min(MAX, z || 1));
  const paint = () => {
    if (!ctl) return;
    ctl.hidden = false;
    ctl.querySelector(".pz-val").textContent = Math.round(view.z * 100) + "%";
    slider.value = String(zoomSlider.toTrack(view.z, MIN, MAX));
  };
  // Lay the stage out at `z` and leave the scroll alone — what a fresh mount wants, since it is
  // about to scroll to its highlight itself.
  const layout = z => {
    view.z = clamp(z);
    sizer.style.width = view.W0 * view.z + "px";
    sizer.style.height = view.H0 * view.z + "px";
    stage.style.transform = `scale(${view.z})`;
    const r = rung(view.W0 || body.clientWidth, view.z);   // zoomed past this raster → sharpen
    if (r > view.rw) { view.rw = r; sharpen(); }
    paint();
  };
  // …and with the scroll: keep whatever is under (cx,cy) on the glass under (cx,cy).
  const to = (z1, cx, cy) => {
    const z0 = view.z, ax = body.scrollLeft + cx, ay = body.scrollTop + cy;
    layout(z1);
    body.scrollLeft = ax / z0 * view.z - cx; body.scrollTop = ay / z0 * view.z - cy;
    try { localStorage.setItem(KEY, String(view.z)); } catch {}
  };
  const mid = z => { const r = body.getBoundingClientRect(); to(z, r.width / 2, r.height / 2); };
  const api = {layout, to,
    // the distance the reader last chose — 1 for a non-interactive mount, which is a thumbnail
    // and has no business inheriting a reading zoom
    stored(){ if (!interactive) return 1;
              try { return clamp(parseFloat(localStorage.getItem(KEY))); } catch { return 1; } },
    in(){ mid(view.z * STEP); }, out(){ mid(view.z / STEP); }, reset(){ mid(1); }};
  if (!interactive) return api;
  win._zoom = api;                                 // the +/−/0 keys reach the PDF through this
  // Dragging the track zooms about the middle of the page you can see, which is the bit you are
  // reading — zooming about a corner would slide the text out from under you.
  slider.addEventListener("input", () => mid(zoomSlider.toZoom(+slider.value, MIN, MAX)));
  ctl.querySelector(".pz-val").addEventListener("click", () => api.reset());
  body.addEventListener("wheel", e => {            // ctrl/⌘-wheel (and trackpad pinch) zooms; plain wheel scrolls
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const r = body.getBoundingClientRect();
    to(view.z * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, {passive: false});
  return api;
}
// Open on the quote. Both mounts hand this the highlight's boxes in ZOOMED px — the space the
// scroll offsets live in — as the whole quote (`box`) and its opening line (`head`).
// Centre the whole thing, which is what fit-width always did and still does. But a quote is
// several lines and, zoomed in, wider or taller than the port: the centre of a three-line quote
// that starts at 70% across the page puts its opening off the right edge, which is the one part
// the reader is actually looking for. So the centring is clamped to keep `head` in frame, and
// the clamp is ordered so that a head bigger than the port shows its START. At fit-width every
// clamp is inert and the behaviour is exactly what it was.
function showQuote(body, box, head){
  const M = 24;                                    // a little air, so the line isn't flush to the edge
  let sl = (box.x0 + box.x1) / 2 - body.clientWidth / 2;
  let st = (box.y0 + box.y1) / 2 - body.clientHeight / 2;
  if (head) {
    sl = Math.min(Math.max(sl, head.x1 - body.clientWidth + M), head.x0 - M);
    st = Math.min(Math.max(st, head.y1 - body.clientHeight + M), head.y0 - M);
  }
  body.scrollLeft = Math.max(0, Math.min(body.scrollWidth  - body.clientWidth,  sl));
  body.scrollTop  = Math.max(0, Math.min(body.scrollHeight - body.clientHeight, st));
}
function unionBox(bs){
  return {x0: Math.min(...bs.map(b => b.x0)), x1: Math.max(...bs.map(b => b.x1)),
          y0: Math.min(...bs.map(b => b.y0)), y1: Math.max(...bs.map(b => b.y1))};
}

// Render page `page` into `win`'s scroll body: the page image + highlight overlays (page
// fractions) live on a fixed-base-width stage; a sizer sibling owns the scroll extent and a
// single scale() transform does zoom, so highlights and the text layer never need per-element
// recompute. Opens at fit-width with the highlight scrolled into view. opts.interactive wires
// ctrl/⌘-wheel zoom + drag-pan + the pan/text tool toggle (skipped for the soft preview).
function mountPage(win, key, page, rects, opts){
  const body = win.querySelector(".pw-body");
  const sizer = win.querySelector(".pw-sizer"), stage = win.querySelector(".pw-stage");
  const img = new Image(); img.className = "pw-img"; stage.appendChild(img);
  for (const r of rects) {
    const hl = document.createElement("div"); hl.className = "pw-hl";
    hl.style.left = (r[0] * 100) + "%"; hl.style.top = (r[1] * 100) + "%";
    hl.style.width = ((r[2] - r[0]) * 100) + "%"; hl.style.height = ((r[3] - r[1]) * 100) + "%";
    stage.appendChild(hl);
  }
  const view = {z: 1, W0: 0, H0: 0};             // W0/H0 = base (fit-width) page size in px
  const interactive = opts.interactive !== false;
  view.rw = rung(body.clientWidth, 1);           // raster rung in force; grows as the user zooms
  let ready; win._ready = new Promise(r => ready = r);   // text layer waits on W0/H0 being known
  const zoom = wireZoom(win, view, {body, sizer, stage, interactive,
    sharpen: () => {                             // one page here — swap this raster for a sharper cut
      const next = new Image();                  // decode off-screen, then swap: no blink
      next.onload = () => { img.src = next.src; };
      next.src = pageSrc(key, page, view.rw);
    }});
  img.onload = () => {
    // Only the first raster lays the stage out. A sharper one swapped in by the zoom fires onload
    // again, and re-running this would snap the reader back to fit-width mid-zoom.
    if (view.laidOut) return;
    view.laidOut = true;
    const load = win.querySelector(".pw-loading"); if (load) load.remove();
    view.W0 = body.clientWidth;                  // fit-width (scrollbar-gutter keeps this stable)
    view.H0 = view.W0 * (img.naturalHeight / img.naturalWidth);
    stage.style.width = view.W0 + "px";
    zoom.layout(zoom.stored());                  // fit-width, or the distance last chosen
    if (rects.length) {                          // …and open on the quote, at that zoom
      const bs = rects.map(r => ({x0: r[0] * view.W0 * view.z, x1: r[2] * view.W0 * view.z,
                                  y0: r[1] * view.H0 * view.z, y1: r[3] * view.H0 * view.z}));
      showQuote(body, unionBox(bs), bs[0]);
    }
    ready();
  };
  img.onerror = () => { const l = win.querySelector(".pw-loading"); if (l) l.textContent = "page render failed"; };
  img.decoding = "async";
  img.src = pageSrc(key, page, view.rw);
  if (!interactive) return;

  body.addEventListener("pointerdown", e => {    // pan tool: drag scrolls (text tool: browser selects)
    if (e.pointerType === "touch") return;       // native scroll owns touch; drag-pan is mouse-only
    if (e.button !== 0 || win.dataset.tool !== "pan") return;
    body.classList.add("pan"); body.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY, l0 = body.scrollLeft, t0 = body.scrollTop;
    const mv = ev => { body.scrollLeft = l0 - (ev.clientX - sx); body.scrollTop = t0 - (ev.clientY - sy); };
    const up = () => { body.classList.remove("pan"); body.removeEventListener("pointermove", mv); body.removeEventListener("pointerup", up); };
    body.addEventListener("pointermove", mv); body.addEventListener("pointerup", up);
  });
  win.querySelector(".pw-tools").addEventListener("click", e => {   // pan / text-select toggle
    const b = e.target.closest(".pw-tool"); if (!b) return;
    if (b.dataset.t !== "pan" && b.dataset.t !== "text") return;    // e.g. ⧉ detach — not a viewer tool
    win.dataset.tool = b.dataset.t;
    if (b.dataset.t === "text") ensureTextLayer(win, key, page, view);
  });
}
// A transparent selectable text layer (pdf.js trick): one absolutely-positioned span per word,
// placed in base-px coords on the stage so the scale transform keeps it registered on the raster.
// Each span's glyph run is scaleX-fit to its raster word box so drag-selection tracks the page.
// Built once, on first entry to text mode; native Ctrl+C copies the selection.
async function ensureTextLayer(win, key, page, view){
  if (win._textBuilt) return; win._textBuilt = true;
  let words = [];
  try { words = await fetch(`words/${key}/${page}.json`).then(r => r.ok ? r.json() : []); }
  catch { words = []; }
  await win._ready;                              // W0/H0 known
  if (!win.isConnected || !words.length) return;
  const stage = win.querySelector(".pw-stage"), layer = document.createElement("div");
  layer.className = "pw-text";
  const W0 = view.W0, H0 = view.H0, spans = [];
  for (const w of words) {
    const sp = document.createElement("span");
    sp.style.left = (w.x0 * W0) + "px"; sp.style.top = (w.y0 * H0) + "px";
    sp.style.fontSize = Math.max(4, (w.y1 - w.y0) * H0) + "px";
    sp.textContent = w.t;                        // measure the word alone; space appended after
    layer.appendChild(sp); spans.push([sp, (w.x1 - w.x0) * W0]);
  }
  stage.appendChild(layer);
  for (const [sp, targetW] of spans) {           // read widths in one batch (after all writes), then fit
    const natW = sp.offsetWidth;
    if (natW > 0) sp.style.transform = `scaleX(${targetW / natW})`;
    sp.appendChild(document.createTextNode(" "));   // word separation for copied text
  }
}

// Full-document viewer for a pinned window: the whole PDF as a lazily-rendered stack of page
// boxes (one per page, sized from the /pages manifest), opened scrolled to the quote's page with
// the highlight in view. A page renders — and, in text mode, grows its selectable overlay — only
// as it nears the viewport, so a long PDF stays cheap. Falls back to a single page if the manifest
// can't be read. Ctrl/⌘-wheel zooms, plain wheel scrolls, the titlebar tracks the current page.
async function mountDoc(win, key, page, rects, opts){
  const body = win.querySelector(".pw-body");
  const sizer = win.querySelector(".pw-sizer"), stage = win.querySelector(".pw-stage");
  const view = {z: 1, W0: 0, H0: 0};             // H0 = the whole stack's base height
  let ready; win._ready = new Promise(r => ready = r);
  let sizes = [];
  try { sizes = await fetch(`pages/${key}.json`).then(r => r.ok ? r.json() : []); } catch { sizes = []; }
  if (!win.isConnected) return;
  if (!sizes.length) return mountPage(win, key, page, rects, opts);   // manifest unreadable → one page
  const load = win.querySelector(".pw-loading"); if (load) load.remove();
  const GAP = 8, W0 = body.clientWidth; view.W0 = W0;
  const pages = []; let top = 0;                  // lay out one sized box per page, stacked
  for (let n = 0; n < sizes.length; n++) {
    const h = W0 * (sizes[n][1] / sizes[n][0]);
    const div = document.createElement("div"); div.className = "pw-page"; div.dataset.n = n;
    div.style.height = h + "px"; stage.appendChild(div);
    pages.push({div, n, top, h, imgLoaded: false, textBuilt: false});
    top += h + GAP;
  }
  view.H0 = top - GAP;
  stage.style.width = W0 + "px";
  const qp = pages[page] || pages[0];            // highlight rects live on the quote's page box
  for (const r of rects) {
    const hl = document.createElement("div"); hl.className = "pw-hl";
    hl.style.left = (r[0] * 100) + "%"; hl.style.top = (r[1] * 100) + "%";
    hl.style.width = ((r[2] - r[0]) * 100) + "%"; hl.style.height = ((r[3] - r[1]) * 100) + "%";
    qp.div.appendChild(hl);
  }
  ready();
  view.rw = rung(W0, 1);                          // raster rung in force; grows as the user zooms
  const loadImg = p => { if (p.imgLoaded) return; p.imgLoaded = true;
    if (!p.img) {                                 // one <img> per page box, reused on re-entry
      p.img = new Image(); p.img.className = "pw-img"; p.img.decoding = "async";
      p.div.appendChild(p.img);                   // stays under the absolutely-positioned overlays
    }
    p.rw = view.rw; p.img.src = pageSrc(key, p.n, view.rw); };
  // Zooming past the rung a page was rasterized at would just magnify its pixels, so re-fetch the
  // on-screen pages one rung up. Only pages actually in view are upgraded (the rest re-fetch
  // lazily when the observer reaches them), and the new raster is decoded off-screen before it
  // replaces the old one, so a zoom never blinks the page out.
  const upgradeRasters = () => {
    const br = body.getBoundingClientRect();
    for (const p of pages) {
      if (!p.imgLoaded || p.rw >= view.rw) continue;
      const r = p.div.getBoundingClientRect();
      if (r.bottom < br.top - 400 || r.top > br.bottom + 400) { p.imgLoaded = false; continue; }
      const want = view.rw, next = new Image();
      next.onload = () => { if (p.img && p.rw < want) { p.img.src = next.src; p.rw = want; } };
      next.src = pageSrc(key, p.n, want);
    }
  };
  // Zoom before the opening scroll, so "centred on the highlight" is true at whatever distance
  // the reader last stood at — not true at 100% and then wrong the moment the stage grows.
  const zoom = wireZoom(win, view, {body, sizer, stage, sharpen: upgradeRasters});
  zoom.layout(zoom.stored());
  if (rects.length) {                            // open on the quote, else on its page's top
    const bs = rects.map(r => ({x0: r[0] * view.W0 * view.z, x1: r[2] * view.W0 * view.z,
                                y0: (qp.top + r[1] * qp.h) * view.z,
                                y1: (qp.top + r[3] * qp.h) * view.z}));
    showQuote(body, unionBox(bs), bs[0]);
  } else {                                       // unresolved quote: the page top, as before
    body.scrollTop = Math.max(0, Math.min(body.scrollHeight - body.clientHeight,
                                          qp.top * view.z - body.clientHeight / 2));
  }
  const buildText = async p => {                 // transparent selectable overlay for one page (pdf.js trick)
    if (p.textBuilt) return; p.textBuilt = true;
    let words = []; try { words = await fetch(`words/${key}/${p.n}.json`).then(r => r.ok ? r.json() : []); } catch { words = []; }
    if (!win.isConnected || !words.length) return;
    const layer = document.createElement("div"); layer.className = "pw-text"; const spans = [];
    for (const w of words) { const sp = document.createElement("span");
      sp.style.left = (w.x0 * W0) + "px"; sp.style.top = (w.y0 * p.h) + "px"; sp.style.fontSize = Math.max(4, (w.y1 - w.y0) * p.h) + "px"; sp.textContent = w.t;
      layer.appendChild(sp); spans.push([sp, (w.x1 - w.x0) * W0]); }
    p.div.appendChild(layer);
    for (const [sp, tw] of spans) { const nw = sp.offsetWidth; if (nw > 0) sp.style.transform = `scaleX(${tw / nw})`; sp.appendChild(document.createTextNode(" ")); }
  };
  // Prefetch reach: a screen and a bit on touch, where bandwidth is the scarce thing and a fast
  // flick would otherwise queue a dozen page fetches the reader scrolls straight past; the old
  // 1200px stays on desktop, where the pages are already local.
  const REACH = matchMedia("(hover:none) and (pointer:coarse)").matches ? "500px 0px" : "1200px 0px";
  const io = new IntersectionObserver(es => {    // render (+ text, in text mode) pages as they near view
    for (const e of es) { if (!e.isIntersecting) continue; const p = pages[+e.target.dataset.n];
      loadImg(p); if (win.dataset.tool === "text") buildText(p); }
  }, {root: body, rootMargin: REACH});
  pages.forEach(p => io.observe(p.div));

  body.addEventListener("pointerdown", e => {    // pan tool: drag scrolls (text tool: browser selects)
    if (e.pointerType === "touch") return;       // native scroll owns touch; drag-pan is mouse-only
    if (e.button !== 0 || win.dataset.tool !== "pan") return;
    body.classList.add("pan"); body.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY, l0 = body.scrollLeft, t0 = body.scrollTop;
    const mv = ev => { body.scrollLeft = l0 - (ev.clientX - sx); body.scrollTop = t0 - (ev.clientY - sy); };
    const up = () => { body.classList.remove("pan"); body.removeEventListener("pointermove", mv); body.removeEventListener("pointerup", up); };
    body.addEventListener("pointermove", mv); body.addEventListener("pointerup", up);
  });
  const sub = win.querySelector(".pw-sub");       // titlebar tracks the page under the viewport middle
  body.addEventListener("scroll", () => {
    const mid = body.scrollTop + body.clientHeight / 2; let cur = 0;
    for (const p of pages) { if (p.top * view.z <= mid) cur = p.n; else break; }
    if (sub) sub.textContent = `p.${cur + 1}`;
  }, {passive: true});
  win.querySelector(".pw-tools").addEventListener("click", e => {   // pan / text-select toggle
    const b = e.target.closest(".pw-tool"); if (!b) return;
    if (b.dataset.t !== "pan" && b.dataset.t !== "text") return;    // e.g. ⧉ detach — not a viewer tool
    win.dataset.tool = b.dataset.t;
    if (b.dataset.t === "text") {                 // build overlay for every page currently on screen
      const br = body.getBoundingClientRect();
      for (const p of pages) { const r = p.div.getBoundingClientRect(); if (r.bottom > br.top && r.top < br.bottom) buildText(p); }
    }
  });
  attachFind(win, key, {body, pages, view});
}

// ── find in the PDF ──────────────────────────────────────────────────────────────────────
// The reader's own text search, and it has to be ours because the page is a raster. The
// browser's Ctrl+F can only see the transparent word overlay, and that is built lazily, for
// the pages you have already visited *in text mode* — so it would search a fraction of the
// document and report the result as if it were all of it. That is the failure worth avoiding:
// not a missing feature, a search that lies. So the server searches the whole PDF instead
// (/search/<key>.json), with the same folded matcher that places a quote's highlight — case,
// spacing, hyphenation seams and ligatures all folded away, which is why "cell-cell" finds a
// line-broken "cell- cell" and why "cell" is also inside "excellent".
//
// A re-aim rebuilds the window from scratch (mountDockDoc), so the hits can't survive one —
// but the QUERY does, and the bar reopens on it, because what you were looking for is still
// what you are looking for after you glance at another claim.
let findQuery = "";
function attachFind(win, key, {body, pages, view}){
  const btn = win.querySelector('.pw-tool[data-t=find]'), bar = win.querySelector(".pw-find");
  if (!btn || !bar) return;
  const input = bar.querySelector("input"), count = bar.querySelector(".pw-fn");
  const steps = bar.querySelectorAll('[data-f=prev],[data-f=next]');
  let hits = [], marks = [], cur = -1, truncated = false, seq = 0, timer = null;
  btn.hidden = false;                              // only the whole-document view offers this

  function clear(){
    for (const els of marks) for (const el of els) el.remove();
    marks = []; hits = []; cur = -1; truncated = false;
  }
  function paint(){
    count.textContent = !input.value.trim() ? ""
      : hits.length ? `${cur + 1}/${hits.length}${truncated ? "+" : ""}` : "none";
    marks.forEach((els, i) => els.forEach(el => el.classList.toggle("on", i === cur)));
    steps.forEach(b => { b.disabled = hits.length < 2; });
  }
  function draw(){                                 // one box per line a hit spans, on its page
    for (const h of hits) {
      const p = pages[h.page], els = [];
      if (p) for (const r of h.rects) {
        const el = document.createElement("div"); el.className = "pw-fh";
        el.style.left = (r[0] * 100) + "%"; el.style.top = (r[1] * 100) + "%";
        el.style.width = ((r[2] - r[0]) * 100) + "%"; el.style.height = ((r[3] - r[1]) * 100) + "%";
        p.div.appendChild(el); els.push(el);
      }
      marks.push(els);
    }
  }
  function go(d){                                  // step to a hit and scroll it into the middle
    if (!hits.length) return;
    cur = (cur + d + hits.length) % hits.length;
    const h = hits[cur], p = pages[h.page];
    if (p) {
      let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
      for (const r of h.rects) { x0 = Math.min(x0, r[0]); x1 = Math.max(x1, r[2]); y0 = Math.min(y0, r[1]); y1 = Math.max(y1, r[3]); }
      const cy = (p.top + (y0 + y1) / 2 * p.h) * view.z;     // base px × the live zoom
      const cx = (x0 + x1) / 2 * view.W0 * view.z;
      body.scrollTop = Math.max(0, Math.min(body.scrollHeight - body.clientHeight, cy - body.clientHeight / 2));
      body.scrollLeft = Math.max(0, Math.min(body.scrollWidth - body.clientWidth, cx - body.clientWidth / 2));
    }
    paint();
  }
  async function run(){
    const q = input.value.trim();
    clear();
    if (q.length < 2) { paint(); return; }         // one character matches half the paper
    const mine = ++seq;
    count.textContent = "…";
    let res = null;
    try { res = await fetch(`search/${key}.json?q=${encodeURIComponent(q)}`).then(r => r.ok ? r.json() : null); }
    catch { res = null; }
    if (mine !== seq || !win.isConnected) return;  // a later keystroke (or a remount) won
    hits = (res && res.hits) || []; truncated = !!(res && res.truncated);
    draw();
    // Land on the hit nearest where the reader already is, not on page 1 — searching for a word
    // you can see on screen should not throw you back to the top of the paper.
    const top = body.scrollTop / (view.z || 1);
    const at = hits.findIndex(h => { const p = pages[h.page]; return p && p.top + h.rects[0][1] * p.h >= top; });
    cur = (at < 0 ? 0 : at) - 1;
    hits.length ? go(1) : paint();
  }
  function open(){
    win.classList.add("finding");
    if (!input.value && findQuery) input.value = findQuery;
    input.focus(); input.select();
    if (input.value.trim() && !hits.length) run();
  }
  function close(){ win.classList.remove("finding"); clear(); paint(); }

  btn.addEventListener("click", () => win.classList.contains("finding") ? close() : open());
  input.addEventListener("input", () => {
    findQuery = input.value;
    clearTimeout(timer); timer = setTimeout(run, 200);
  });
  input.addEventListener("keydown", e => {
    e.stopPropagation();                           // the board's bare-key shortcuts (w, …) must not fire
    if ((e.key === "f" || e.key === "F") && (e.ctrlKey || e.metaKey) && !e.altKey) {
      e.preventDefault(); input.select();          // find-again while already in the box: reselect
    } else if (e.key === "Enter") { e.preventDefault(); clearTimeout(timer); hits.length ? go(e.shiftKey ? -1 : 1) : run(); }
    else if (e.key === "Escape") { e.preventDefault(); close(); }
  });
  bar.addEventListener("click", e => {
    const b = e.target.closest(".pw-fb"); if (!b) return;
    if (b.dataset.f === "close") close(); else { go(b.dataset.f === "prev" ? -1 : 1); input.focus(); }
  });
  win._find = {open, close};
  paint();
}
// Ctrl/⌘-F belongs to the PDF whenever one is mounted: in the PDF-only window nothing else it
// could mean exists, and in the browse view an open dock IS what you are reading. With no viewer
// on screen we don't touch it, so the browser's own find-in-page still works on the graph.
addEventListener("keydown", e => {
  if ((e.key !== "f" && e.key !== "F") || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  const w = document.querySelector(".pw");
  if (!w || !w._find) return;
  e.preventDefault(); w._find.open();
});
// generic pointer-drag: onMove(dx,dy,base0,base1); base() seeds the deltas; skip if target in `guard`
function dragBy(handle, onMove, base, guard){
  handle.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch") return;   // touch scrolls the sheet natively; drag/resize is mouse-only
    if (guard && e.target.closest(guard)) return;
    e.preventDefault(); e.stopPropagation(); handle.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY, [b0, b1] = base();
    const mv = ev => onMove(ev.clientX - sx, ev.clientY - sy, b0, b1);
    const up = () => { handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); };
    handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
  });
}

// ── boot: the landing list (column 0), ranked by pass desc, then year desc ───────────────
// The landing column lists CURATED papers only. ORDER carries the whole bibliography (~3.7k
// entries against 54 curated ones), and rendering a card for each built a ~187k-px column whose
// mere existence taxed every forced relayout — one per click, one per hover. Measured at 4x CPU
// throttle, trimming it cut a click from 34.8 ms to 13.6 ms and rebuild() from 23.2 to 10.2 ms.
//
// Nothing becomes unreachable. Stubs stay indexed by the search box, which materializes a landing
// card on demand (gotoPaper), and the two ways a stub is drawn *into* the graph both still work:
// uncurated grounds fold into the per-card source stack (they never had a landing card of their
// own to anchor on), and a lateral/answers target that is only a stub is materialized up front by
// landingKeys so its arrow still lands.
function landingKeys(){
  const keep=new Set(ORDER.filter(k=>PAPERS[k]));
  for(const p of Object.values(PAPERS))
    for(const f of ["lateral","ans"])
      for(const l of p[f]||[])
        if(!l.slug && !PAPERS[l.key] && STUBS[l.key]) keep.add(l.key);
  return ORDER.filter(k=>keep.has(k));               // ORDER's ranking, filtered — never resorted
}

// ── the flat landing column ──────────────────────────────────────────────────────────────
// Every curated paper, always, in ORDER's pass ranking — the same decision as the synthesis band,
// for the same reason. This column was collapsed for a while: it landed empty and papers arrived
// only when something asked for them (a claim you showed, a jump by name), on the theory that a
// list of 54 you must scroll is a backlog rather than a view. It is a backlog only if scrolling is
// the sole way to reach anything in it. It isn't — showing a claim HOISTS its papers to the top of
// this column, so the reader's attention is placed by order, and the collapse was buying nothing
// the hoist did not already deliver while costing everything below:
//
//   · a card could be *put away*, so what the column held became session history rather than a
//     fact about the library, and three doors in needed a per-card × and a `clear` to undo;
//   · a paper's presence had to be EXPLAINED (the `.cprov` strip exists for this), because the
//     reader could not otherwise know why these 12 and not the other 42;
//   · the board could not answer "what have I curated?" at all without opening the library.
//
// What survives is one door and one set of state:
//   landedStuck — a paper named by the search box or a library row that the flat list does NOT
//                 carry, i.e. a STUB. Curated papers are always present, so naming one is a
//                 scroll-and-flash (gotoPaper) and adding it here is a no-op. Sticky, because
//                 naming something is a standing request; `clear` is the way back.
//   shownBroad  — the claims you have SHOWN (showBroad). No longer decides which papers EXIST in
//                 the column, only which ones are gathered at its top, and which arrows are lit.
// `landedDropped` and the per-card × went with the collapse: hiding a paper from a flat list is
// the very thing the flat list is for not doing.
const landedStuck=new Set();
const shownBroad=new Set();
// key -> {claims:[slug], stuck:bool}: WHY a card is here — no longer *whether*. Two consumers, the
// per-card provenance strip and the stub reconcile below, so they cannot disagree.
function landedWant(){
  const want=new Map();
  const note=(k,slug)=>{
    const e=want.get(k)||{claims:[],stuck:false};
    if(slug) e.claims.push(slug); else e.stuck=true;
    want.set(k,e);
  };
  for(const k of landedStuck) note(k,null);
  for(const slug of shownBroad)
    for(const k of new Set((BROAD_LINKS[slug]||[]).map(l=>l.key))) note(k,slug);
  return want;
}
const broadLabel=slug=>{
  const b=BROAD[slug]||{}, s=b.title||b.text||slug;
  return s.length>36?s.slice(0,35)+"…":s;
};
// `clear` no longer empties the column — a flat list has nothing to empty. It RELEASES: every shown
// claim put away, its arrows dark, every stub summoned by name dismissed. Claim pins go with it,
// because rebuild derives them from shownBroad — one state, one clear. It deliberately leaves the
// ORDER the hoists built: releasing a claim is not a reason to re-sort the column under the reader.
function clearLanding(){
  landedStuck.clear(); shownBroad.clear();
  rebuild();
}
// ── showing a claim: ONE gesture ─────────────────────────────────────────────────────────
// This used to be three. A ◂ chip landed the claim's papers in the column; a ▸ chip walked one rung
// down the ladder; a click on the card pinned its edges bright and hoisted the block. They read as
// alternatives and were not: since the landing column collapsed, a pin has nothing to light up
// until its evidence has landed, so the card click was only ever the chips' other half — and which
// of the three you reached for changed what you got.
//
// Now the card is the whole gesture, at every altitude. Click a claim: whatever sits one step below
// it joins it at the top of the board — its papers land in the column, the narrower claims that
// ladder into it are hoisted up beside it on the band, its arrows go bright and stay bright, and
// the whole block gathers into one screenful. Click again: it all comes undone. Which kind of
// evidence a claim has is a fact about the graph; making the reader express it as a different
// gesture pushed a detail of the schema into the hands. The chips are readouts of that state, not
// ways to enter part of it.
//
// The gesture PLACES; it no longer reveals. The rungs used to appear on this click (see broadTier for
// why they stopped hiding), so a claim's own subtree could vanish under it and `pruneShown` existed to
// keep that consistent. With the band flat, showing a claim can only ever move things.
function showBroad(slug){
  const hide=shownBroad.has(slug);
  if(hide) shownBroad.delete(slug); else shownBroad.add(slug);
  rebuild();                                   // hoists the papers, re-derives the pins, re-hoists
  // on hide the pointer is still resting on the card we just put away; without this the transient
  // hover re-lights the very edges the click turned off (see `unpinned`). On show, jump to the
  // hoisted block — instantly, because every scroll event redraws the edge overlay and animating
  // up from deep in a tall column would repaint every arrow the whole way.
  if(hide){ unpinned={cardId:`card-${SYNTH}:${slug}`,sid:null}; return; }
  // The hoist put this claim's FAMILY at the top of the column; scrolling home lands on the family
  // head, which is the right place only when the head is what you clicked. A rung deep inside a tall
  // box needs the board brought to the rung. Instantly, never smoothly: every scroll event redraws
  // the whole edge overlay, and animating down a long column repaints every arrow the whole way.
  const el=document.getElementById(`card-${SYNTH}:${slug}`);
  if(!broadHost[slug]||!el){ if(board.scrollTop) board.scrollTop=0; return; }
  el.scrollIntoView({block:"center"});
  el.classList.remove("found"); void el.offsetWidth;
  el.classList.add("found");
  setTimeout(()=>el.classList.remove("found"),1800);
}
// Reconcile cols[0]. The curated list is a FIXED population — every key landingKeys() names is
// present from boot and never leaves, so this only ever adds what a fresh graph brought in (a
// hot-reloaded DRIVE window) and evicts stub cards nobody names any more. It never re-sorts: a card
// already in the column stays exactly where the hoists left it.
function syncLanding(){
  const c=cols[0]; if(!c) return;
  const want=landedWant();
  const perm=new Set(landingKeys());
  for(const k of [...c.keys]){                       // only summoned stubs are evictable
    if(perm.has(k)||landedStuck.has(k)||k.endsWith("::srcs")) continue;
    c.keys.delete(k);
    const el=document.getElementById(`card-0:${k}`); if(el) el.remove();
  }
  for(const k of perm){                              // ORDER's ranking — never resorted
    if(ACTIVE.has(k)||c.keys.has(k)) continue;        // in-progress papers live in their own windows
    addPaper(0,k);
  }
  for(const k of landedStuck){                       // a stub named by hand isn't in landingKeys()
    if(ACTIVE.has(k)||c.keys.has(k)||!(PAPERS[k]||STUBS[k])) continue;
    addPaper(0,k);
  }
  // Say what each card is doing here. Not "why is it on screen" any more — a curated paper needs no
  // excuse for being in the list of curated papers — but which of the shown claims it answers to,
  // which is what tells the reader whose block a hoisted card belongs to when two are gathered at
  // the top. Rewritten every sync: showing a second claim that rests on this paper adds a reason.
  for(const k of c.keys){
    const card=document.getElementById(`card-0:${k}`);   // id-with-a-colon: getElementById, not a selector
    const via=card&&card.querySelector(".cvia");
    if(!via) continue;
    const e=want.get(k)||{claims:[],stuck:false};
    const bits=[];
    if(e.stuck) bits.push("asked for by name");
    for(const slug of e.claims) bits.push("evidence for “"+broadLabel(slug)+"”");
    via.textContent=bits.join(" · ");
    via.title=bits.join("\n");
    card.classList.toggle("plain",!bits.length);         // no reason to state → no strip at all
  }
  const hd=c.el.querySelector(".colhd");
  // Count the CURATED cards, not c.keys.size: the column's tail carries a card per uncurated paper
  // that some lateral / answers edge points at (landingKeys), which exist so those arrows have an
  // anchor and are not part of the list this header names. 69 curated, 49 such stubs today.
  // `clear` appears only when there is state to release (a shown claim, a summoned stub). On the
  // resting column it would be a button that does nothing, which is worse than no button.
  let n=0; for(const k of c.keys) if(PAPERS[k]) n++;
  if(hd) hd.innerHTML=`curated papers · ${n}`
    +(shownBroad.size||landedStuck.size?`<span class="hd-clear">clear</span>`:"");
  c.el.classList.toggle("vacant",!c.keys.size);         // an empty repo, or a preview of one paper
  document.body.classList.toggle("landing-vacant",!c.keys.size);
}
function boot(){
  broadRefresh();                    // tiers + nesting ready before the very first ensureBroadBand()
  const c0=ensureCol(0,"curated papers");
  // delegated, because syncLanding rewrites the header every time the count changes
  c0.el.addEventListener("click",e=>{
    if(e.target.closest(".hd-clear")){ e.stopPropagation(); clearLanding(); }
  });
  syncLanding();                                     // the whole curated list, in ORDER's ranking
  ensureBroadBand();                                 // synthesis band present from the landing view
  redraw();
}
if (!PDFWIN) boot();                                  // a PDF-only window renders no graph

// ── the PDF-only window ──────────────────────────────────────────────────────────────────
// Its own OS window holding nothing but a full-bleed PDF pane, mounted with the same
// buildWin/mountDoc the in-page dock uses so the two can't drift. Two drivers share the mount:
//
//   ?detached=1  the browse view's popped-out dock. The graph window broadcasts {t:"aim",…} on
//                the same hover that would aim the in-page dock. We announce {t:"ready"} on boot
//                so a graph window that opened us first still hands over the current aim.
//   ?focus=1     curation's paper window. No parent to mirror — it polls the focus wire itself,
//                so `lit focus` from the agent and quote-clicks in the card window both steer it,
//                and it survives the graph window being closed or navigated away.
if (PDFWIN) {
  document.title = FOCUSWIN ? "litgraph · paper" : "litgraph · PDF";
  const pane = document.getElementById("detachPane");
  let win = null, lastAim = null;
  function mount(m){
    lastAim = m;
    const empty = document.getElementById("detachEmpty"); if (empty) empty.remove();
    if (win) win.remove();
    win = buildWin(m.key, (m.rects && m.rects.length) ? `p.${m.page + 1}` : "full paper",
                   {onClose: () => window.close()});
    pane.appendChild(win);                           // re-parent out of <body> into the full-bleed host
    mountDoc(win, m.key, m.page || 0, (m.rects || []).slice(), {interactive: true});
  }
  const chan = (DETACHED && "BroadcastChannel" in window) ? new BroadcastChannel("lit-pdf") : null;
  if (chan) {
    chan.onmessage = e => { const m = e.data; if (m && m.t === "aim") mount(m); };
    chan.postMessage({t: "ready"});
    addEventListener("beforeunload", () => chan.postMessage({t: "closed"}));
  }
  if (FOCUSWIN) {                                     // poll the wire; re-mount only when seq moves
    let seq = null;
    setInterval(async () => {
      let f; try { f = await fetch("focus").then(r => r.ok ? r.json() : null); } catch { return; }
      if (!f || !f.citekey || f.seq === seq) return;
      seq = f.seq;
      const loc = (f.loc && f.loc.rects) ? f.loc : {page: 0, rects: []};
      mount({key: f.citekey, page: loc.page || 0, rects: loc.rects || []});
    }, 500);
  }
  let rt = null;                                      // re-fit the page to the new window width (mountDoc bakes W0)
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (lastAim) mount(lastAim); }, 140); });
}
// width slider: drive --col live; columns resize (edges re-anchor on redraw), centering
// padding follows via calc(50vw - var(--col)/2). Value readout kept in sync.
(function(){
  const slider=document.getElementById("colw"), val=slider.nextElementSibling;
  const apply=()=>{ document.documentElement.style.setProperty("--col","min("+slider.value+"px, 86vw)");
    val.textContent=slider.value+"px"; redraw(); };
  slider.addEventListener("input",apply); apply();
})();

// ── board zoom: the camera ───────────────────────────────────────────────────────────────
// The width slider above changes the LAYOUT — how wide a card sets its text. This changes only
// how far away you stand from it. They are next to each other in the HUD and deliberately
// different shapes (slider vs stepper) because they answer different questions: "how should this
// be laid out" and "how much of it do I want on screen".
// Zoomed out, the board stops being readable and becomes a MAP — which column fans where, how
// far an arrow reaches, whether the ladder you just hoisted actually gathered anything. That is
// a question the reader has at 40%, and one the 500px-wide-column view could never answer on a
// paper with 58 cards.
// It is its own zoom, sharing nothing with the PDF viewer's (see wireZoom): two surfaces the
// reader looks at side by side, each with its own distance, each remembered separately.
const BOARD_ZOOM = (function(){
  // 1/3 … 3 rather than 0.3 … 3: a geometrically symmetric range puts 100% exactly mid-track on
  // the log slider, so "back to normal" is a place the hand can find without reading the number.
  const MIN = 1 / 3, MAX = 3, STEP = 1.2, KEY = "lit.board.zoom";
  const ctl = document.getElementById("bzoom");
  const val = ctl && ctl.querySelector(".zval");
  const slider = ctl && ctl.querySelector("input");
  let z = 1;
  const clamp = v => Math.max(MIN, Math.min(MAX, v));
  const paint = () => {
    if (!ctl) return;
    val.textContent = Math.round(z * 100) + "%";
    slider.value = String(zoomSlider.toTrack(z, MIN, MAX));
  };
  // (cx,cy) is the point on the glass, relative to the board's own box, to keep fixed — the
  // pointer for a wheel-zoom, the middle of the port for the slider and the keys. Everything else
  // follows from "the stage coordinate under that point must not move".
  function set(z1, cx, cy){
    z1 = clamp(z1);
    const r = board.getBoundingClientRect();
    if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
    const z0 = z, ax = board.scrollLeft + cx, ay = board.scrollTop + cy;
    z = z1;
    document.documentElement.style.setProperty("--bz", String(z));
    hudQuiet = performance.now() + 250;          // the scroll below is the zoom's, not the reader's
    board.scrollLeft = ax / z0 * z - cx;         // the browser clamps if the extent shrank
    board.scrollTop  = ay / z0 * z - cy;
    paint();
    try { localStorage.setItem(KEY, String(z)); } catch {}
    redraw();                                    // the overlay's viewport cover is BZ-dependent
  }
  // Restored, not reset, on load: the distance you were standing at is part of where you were.
  try { const v = parseFloat(localStorage.getItem(KEY)); if (v > 0) z = clamp(v); } catch {}
  document.documentElement.style.setProperty("--bz", String(z));
  paint();
  if (z !== 1) redraw();                         // the columns were laid out before this ran
  // Dragging the track zooms about the middle of the port — the board you can see stays the board
  // you can see, which is what makes sweeping for a distance work at all.
  if (ctl) {
    slider.addEventListener("input", () => set(zoomSlider.toZoom(+slider.value, MIN, MAX)));
    val.addEventListener("click", () => set(1));
  }
  // ctrl/⌘-wheel (and trackpad pinch) over the board, exactly as over a PDF page — same gesture,
  // and which one it lands on is simply which one you are pointing at.
  board.addEventListener("wheel", e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const r = board.getBoundingClientRect();
    set(z * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, {passive: false});
  return {set, get z(){ return z; }, in(){ set(z * STEP); }, out(){ set(z / STEP); }, reset(){ set(1); }};
})();

// + / − / 0 zoom whichever surface you are pointing at. The PDF only ever claims the keys while
// the pointer is over it — or in a PDF-only window, where there is no board to mean instead.
// Bare keys, not ctrl-+: the browser's own page zoom stays available and unshadowed, and it is
// still the right tool when what you want is bigger chrome rather than a wider view.
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!/^[+\-=_0]$/.test(e.key)) return;
  // Typing beats zooming — but a range input is not typing, and after dragging a zoom slider the
  // slider is what has focus, which was quietly eating the very keys that do the same job.
  const el = e.target, tag = el.tagName || "";
  if (el.isContentEditable || tag === "TEXTAREA" || (tag === "INPUT" && el.type !== "range")) return;
  const pw = document.querySelector(".pw");
  const pdf = pw && pw._zoom &&
              (document.body.classList.contains("detached") || pw.matches(":hover")) ? pw._zoom : null;
  const t = pdf || BOARD_ZOOM;
  if (!pdf && (document.body.classList.contains("library") || document.body.classList.contains("walk"))) return;
  e.preventDefault();
  if (e.key === "0") t.reset(); else if (e.key === "-" || e.key === "_") t.out(); else t.in();
});

// ── find a paper (build + serve) ─────────────────────────────────────────────────────────
// A paper-finding search: type fragments of what you remember (title, author, journal, year,
// tag) and jump to the matching card. NOT a knowledge search over claims/quotes. Purely
// client-side, so a static `lit build` keeps it working offline. It indexes the WHOLE
// bibliography, curated or not — since the landing column trimmed down to curated papers, this is
// the only path to a stub, and gotoPaper mints its card on demand. Curated papers rank above stubs
// (ORDER is already curated-first); in-progress (ACTIVE) papers live in their own curation
// windows, not the browse column, so they're left out — there's no landing card to jump to.
const searchInput = document.getElementById("search");
const searchResults = document.getElementById("searchResults");
let searchIndex = null;
function buildSearchIndex(){
  const rows = [];
  for(const key of ORDER){
    if(ACTIVE.has(key)) continue;
    const cur = !!(PAPERS[key] && PAPERS[key].cur);
    const p = PAPERS[key] || STUBS[key] || {};
    const authors = (p.authors || []).map(a => a[0]);
    const journal = p.journal || venueFromKey(key);       // curated: venue token from the citekey
    const tags = (cur && p.tags) ? p.tags : [];            // tags are curated-only
    const blob = [key, p.title || "", authors.join(" "), journal, p.year || "", tags.join(" ")]
      .join(" ").toLowerCase();
    // `pass` is curated-only and rides along for the library view's ranking badge; the search
    // dropdown ignores it.
    rows.push({key, cur, title: p.title || key, authors, journal, year: p.year, tags,
               pass: cur ? p.pass : null, blob});
  }
  return rows;
}
function openResults(){
  const r = searchInput.getBoundingClientRect();       // pin under the box (HUD is fixed)
  searchResults.style.left = Math.max(8, Math.min(r.left, innerWidth - 348)) + "px";
  searchResults.style.top = (r.bottom + 6) + "px";
  searchResults.classList.add("on");
}
function closeSearch(){ searchResults.classList.remove("on"); }
const SR_CAP = 12;
function _srRow(r){
  const who = r.authors.length
    ? esc(r.authors.slice(0, 3).join(" · ")) + (r.authors.length > 3 ? " · …" : "") : "";
  const bib = esc([r.journal, r.year].filter(Boolean).join(" · "));
  const meta = [who, bib].filter(Boolean).join("  ·  ");
  const badge = r.cur ? "" : `<span class="sr-badge">stub</span>`;
  return `<div class="sr-row ${r.cur ? "" : "stub"}" data-key="${esc(r.key)}">`
       + `<div class="sr-t">${esc(r.title)}${badge}</div>`
       + `<div class="sr-m">${esc(r.key)}${meta ? "  ·  " + meta : ""}</div></div>`;
}
// A topic (SCHEMA §9) is not a second filter mechanism — it is a saved search over its
// keyword closure, run through this SAME find-a-paper index. "topic:<slug>" is the box's own
// query syntax for it; typing past it falls straight back to ordinary free-text search, same as
// editing a tag-chip search. The library's facet rail is now the way you BROWSE the topic tree
// (it filters rows in place, which is strictly more useful than a dropdown of search results),
// so this syntax is what's left of the old topics panel: still exact, no longer the front door.
function renderTopicResults(slug){
  const topic = TOPICS[slug];
  const hits = topic.papers.map(k => searchIndex.find(r => r.key === k)).filter(Boolean);
  const hd = `<div class="sr-topic">topic · ${esc(topic.title)} · `
           + `${hits.length} paper${hits.length === 1 ? "" : "s"}</div>`;
  const body = hits.length
    ? hits.slice(0, SR_CAP).map(_srRow).join("")
      + (hits.length > SR_CAP ? `<div class="sr-more">+${hits.length - SR_CAP} more — refine the search</div>` : "")
    : `<div class="sr-none">no curated paper carries this topic's keywords</div>`;
  searchResults.innerHTML = hd + body;
  openResults();
}
function renderResults(q){
  if(!searchIndex) searchIndex = buildSearchIndex();
  const q0 = q.trim();
  const topicMatch = /^topic:([a-z0-9][a-z0-9-]*)$/i.exec(q0);
  if(topicMatch && TOPICS[topicMatch[1]]){ renderTopicResults(topicMatch[1]); return; }
  const terms = q0.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length){ closeSearch(); return; }
  const hits = searchIndex.filter(r => terms.every(t => r.blob.includes(t)));   // AND across terms
  if(!hits.length){
    searchResults.innerHTML = `<div class="sr-none">no paper matches “${esc(q)}”</div>`;
  } else {
    let html = hits.slice(0, SR_CAP).map(_srRow).join("");
    if(hits.length > SR_CAP) html += `<div class="sr-more">+${hits.length - SR_CAP} more — refine the search</div>`;
    searchResults.innerHTML = html;
  }
  openResults();
}
function gotoPaper(key){
  closeSearch();
  // A curated paper is already in the flat list, so this is a scroll-and-flash and landedStuck is a
  // no-op. It earns its keep for a STUB, which the list does not carry: naming one is a standing
  // request for it, so the card is minted and survives every rebuild's syncLanding until `clear`.
  if(!STUBS[key] && !PAPERS[key]) return;
  // …but in the walk, the board is not the view you are looking at: naming a paper there means
  // focus the WALK on it. Reached through window (not the `const WALK` below) so this stays safe
  // however early it is called — a bare `typeof` on a const in its temporal dead zone throws.
  if(document.body.classList.contains("walk") && window.litWalk){
    window.litWalk.setFocus(key);
    return;
  }
  landedStuck.add(key);
  syncLanding();                             // mints a summoned stub's card, and refreshes every
  let el = document.getElementById(`card-0:${key}`);     // card's provenance + the column header
  if(!el){                                   // an in-progress paper (ACTIVE) is held out of the
    addPaper(0, key);                        // list because it has its own window — but naming it
    el = document.getElementById(`card-0:${key}`);       // by hand outranks that, so mint the card
    if(!el) return;                                      // (appended below the ranking)
  }
  redraw();                                              // the column may have grown; edges re-anchor
  el.scrollIntoView({behavior: "smooth", block: "center"});
  el.classList.remove("found"); void el.offsetWidth;     // restart the flash if it's still running
  el.classList.add("found");
  setTimeout(() => el.classList.remove("found"), 1800);
}
function runSearch(term){                                 // called by a tag chip → search that tag
  if(!searchInput) return;
  searchInput.value = term;
  searchInput.focus();
  renderResults(term);
}
if(searchInput){
  searchInput.addEventListener("input", () => renderResults(searchInput.value));
  searchInput.addEventListener("focus", () => { if(searchInput.value.trim()) renderResults(searchInput.value); });
  searchInput.addEventListener("keydown", e => {
    if(e.key === "Escape"){ searchInput.value = ""; closeSearch(); searchInput.blur(); }
    else if(e.key === "Enter"){
      const first = searchResults.querySelector(".sr-row");
      if(first) gotoPaper(first.dataset.key);
    }
  });
  searchResults.addEventListener("click", e => {
    const row = e.target.closest(".sr-row");
    if(row) gotoPaper(row.dataset.key);
  });
  addEventListener("click", e => {                       // click outside closes the dropdown
    if(!e.target.closest("#searchResults, #search")) closeSearch();
  }, true);
}

// ── the LIBRARY view ─────────────────────────────────────────────────────────────────────
// Reference-manager browsing: one vertical scroll over the WHOLE bibliography, narrowed by a
// facet rail. It reuses buildSearchIndex() wholesale — that index already carries every field
// a row needs for all 3.8k entries — so this view is a surface over the search machinery, not
// a second copy of it. A row click leaves for the board via gotoPaper(), which mints a card
// for an uncurated stub on demand.
//
// Why topic facets imply curated: `tags` are curated-only (a stub has no curation, so no tags)
// and a topic reaches papers through tags. Selecting a container therefore cannot match a stub,
// and pretending otherwise would show an empty list with no explanation. The scope pill flips
// itself and says so.
if(!DRIVE && !PDFWIN && !MOBILE_CURATE) (function(){
  const btn = document.getElementById("libBtn");
  const pane = document.getElementById("libraryPane");
  const facets = document.getElementById("libFacets");
  const scroll = document.getElementById("libScroll");
  const sizer = document.getElementById("libSizer");
  const rowsEl = document.getElementById("libRows");
  const filterEl = document.getElementById("libFilter");
  const countEl = document.getElementById("libCount");
  const clearEl = document.getElementById("libClear");
  if(!btn || !pane) return;

  const ROW_H = 76, OVERSCAN = 6;
  // pass ranking first because it is the board's own landing order — the curator's judgement
  // about the library, which a plain year sort would silently discard.
  const SORTS = {
    pass:  {label: "curation pass", cmp: null},        // null = keep index order (ORDER is pass-ranked)
    year:  {label: "year ↓", cmp: (a, b) => (b.year || 0) - (a.year || 0)},
    title: {label: "title", cmp: (a, b) => a.title.localeCompare(b.title)},
  };
  const SCOPES = {all: "everything", curated: "curated", stub: "uncited stubs"};
  const HEAD = 12, MORE = 60;                          // ranked-facet cap, and what "more" opens it to
  let scope = "all", sort = "pass", topic = null, author = null, journal = null,
      moreAuth = false, moreJrnl = false, rows = [], view = [];

  const leavesByHead = () => Object.entries(TOPICS).filter(([, t]) => t.root)
    .sort((a, b) => a[1].title.localeCompare(b[1].title))
    .map(([slug, t]) => [t, Object.entries(TOPICS).filter(([, x]) => x.broader.includes(slug))
      .sort((a, b) => a[1].title.localeCompare(b[1].title))]);

  // ── the two derived axes ──────────────────────────────────────────────────────────────
  // Neither authors nor journals are stored in a form you can group on directly, and both fail
  // the same way: the curated tier and the stub tier write the *same* fact differently, so a
  // naive tally files one journal (or one person) under two entries and the ranking lies.

  // Journals ride the CITEKEY's venue token, not the display string. A curated paper stores no
  // `journal` at all (SCHEMA §3: the venue only ever lived in the citekey), while a stub carries
  // OpenAlex's full name — so "Nature Physics" and "NatPhys" are the same journal seen from the
  // two tiers. The token is in every citekey on both tiers, which makes it the one key they
  // share; the stubs then donate a readable name for it (the most-cited spelling wins, since
  // OpenAlex serves catalogue variants like "Physical review. E" alongside the modern title).
  let venueName = null;
  function venueNames(){
    if(venueName) return venueName;
    const tally = {};
    for(const [k, s] of Object.entries(STUBS)){
      const t = venueFromKey(k);
      if(!t || !s.journal) continue;
      (tally[t] || (tally[t] = {}))[s.journal] = (tally[t][s.journal] || 0) + 1;
    }
    venueName = {};
    for(const [t, names] of Object.entries(tally))
      venueName[t] = Object.entries(names)
        .sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0][0];
    return venueName;
  }
  const venueLabel = tok => venueNames()[tok] || tok;

  // Authors fold to `family|first-initial`. Curated YAML writes "Family, Given" (SCHEMA §4);
  // stubs carry OpenAlex's "Given M. Family" — one person, two strings, and the same person
  // also drifts between "Given Family" and "Given M. Family" across publishers. Family plus
  // first initial is the granularity a bibliography can actually support. The cost is that true
  // homonyms collide, which the rail says out loud rather than pretending precision it hasn't got.
  const PARTICLES = new Set(["van", "von", "de", "der", "den", "du", "del", "della", "di", "da",
                             "dos", "la", "le", "ter", "ten"]);
  const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();  // strip accents
  function authorId(raw){
    // U+2010–2015 are the typographic dashes OpenAlex serves in place of ASCII "-"
    const s = String(raw || "").replace(/[\u2010-\u2015]/g, "-").replace(/\s+/g, " ").trim();
    if(!s) return null;
    let family, given;
    const c = s.indexOf(",");
    if(c > -1){ family = s.slice(0, c).trim(); given = s.slice(c + 1).trim(); }
    else {
      const w = s.split(" ");
      let i = w.length - 1;                          // absorb a nobiliary particle into the family
      while(i > 1 && PARTICLES.has(fold(w[i - 1]).replace(/\.$/, ""))) i--;
      family = w.slice(i).join(" "); given = w.slice(0, i).join(" ");
    }
    if(!family) return null;
    const ini = (given.match(/[A-Za-z\u00c0-\u024f]/) || [""])[0].toUpperCase();
    return {id: fold(family) + "|" + fold(ini), name: family + (ini ? ", " + ini + "." : "")};
  }

  // Fold once, onto the shared search index — recompute() runs on every keystroke and would
  // otherwise re-parse ~30k names each time.
  function prepare(r){
    if(r.auth) return r;
    const seen = new Set();
    r.auth = [];
    for(const a of r.authors){
      const id = authorId(a);
      if(id && !seen.has(id.id)){ seen.add(id.id); r.auth.push(id); }
    }
    r.venue = venueFromKey(r.key);
    return r;
  }

  // One ranked facet: rows already tallied, capped at HEAD unless opened, with the current
  // selection pinned in even when it falls outside the cap (counts are computed with this
  // facet's own filter lifted, so a narrow pick can rank low in its own list).
  function rankedFacet(kind, title, tally, sel, more, note){
    let list = Object.entries(tally)
      .sort((a, b) => b[1].n - a[1].n || a[1].name.localeCompare(b[1].name));
    if(!list.length) return "";
    const cap = more ? MORE : HEAD, total = list.length;
    let shown = list.slice(0, cap);
    if(sel && !shown.some(([k]) => k === sel) && tally[sel]) shown = shown.concat([[sel, tally[sel]]]);
    return `<div class="lf-hd">${esc(title)}</div><div class="lf-list">`
      + shown.map(([k, v]) =>
          `<span class="lf-row${sel === k ? " on" : ""}" data-${kind}="${esc(k)}" `
          + `title="${esc(v.name)}"><span class="nm">${esc(v.name)}</span>`
          + `<span class="n">${v.n}</span></span>`).join("")
      + `</div>`
      + (total > cap
          ? `<div class="lf-more" data-more="${kind}">${more ? "less" : `${total - cap} more…`}</div>`
          : "")
      + (note ? `<div class="lf-note">${note}</div>` : "");
  }

  function renderFacets(tallies){
    let html = `<div class="lf-hd">show</div><div class="lf-seg">`
      + Object.entries(SCOPES).map(([k, lbl]) =>
          `<span class="lf-opt${scope === k ? " on" : ""}" data-scope="${k}">${esc(lbl)}</span>`).join("")
      + `</div>`
      // sort rides up here with scope: both are controls over the whole list, whereas topic,
      // journal and author are the three filter axes and read better as one block.
      + `<div class="lf-hd">sort</div><div class="lf-seg">`
      + Object.entries(SORTS).map(([k, s]) =>
          `<span class="lf-opt${sort === k ? " on" : ""}" data-sort="${k}">${esc(s.label)}</span>`).join("")
      + `</div>`;
    const heads = leavesByHead().filter(([, leaves]) => leaves.length);
    if(heads.length){
      html += `<div class="lf-hd">topic</div>`
        + heads.map(([t, leaves]) =>
            `<div class="tp-head" title="${esc(t.note || "")}">${esc(t.title)}</div>`
            + `<div class="tp-leaves">` + leaves.map(([lslug, lt]) =>
                `<span class="tp-chip${topic === lslug ? " on" : ""}" data-slug="${esc(lslug)}" `
                + `title="${esc(lt.note || "")}">${esc(lt.title)}`
                + `<span class="n">${lt.papers.length}</span></span>`).join("")
            + `</div>`).join("")
        + `<div class="lf-note">headings group and can't be filtered; click a container to narrow. `
        + `Topics reach curated papers only — a stub carries no tags.</div>`;
    }
    html += rankedFacet("jrnl", "journal", tallies.jrnl, journal, moreJrnl,
                        "grouped by the citekey's venue token, so a curated paper and the stubs "
                        + "citing the same journal land on one row.")
          + rankedFacet("auth", "author", tallies.auth, author, moreAuth,
                        "ranked by how often the name appears across the whole bibliography. "
                        + "Folded to family name + first initial, so two people who share both "
                        + "share a row.");
    facets.innerHTML = html;
  }

  function recompute(){
    if(!searchIndex) searchIndex = buildSearchIndex();
    if(!rows.length) rows = searchIndex.map(prepare);  // ORDER's ranking, curated-first
    const terms = filterEl.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const inTopic = topic ? new Set(TOPICS[topic].papers) : null;
    // `skip` lifts one facet's own filter, so its list keeps showing the alternatives you could
    // switch to instead of collapsing to the one row you already picked.
    const passes = (r, skip) => {
      if(scope === "curated" && !r.cur) return false;
      if(scope === "stub" && r.cur) return false;
      if(skip !== "topic" && inTopic && !inTopic.has(r.key)) return false;
      if(skip !== "jrnl" && journal && r.venue !== journal) return false;
      if(skip !== "auth" && author && !r.auth.some(a => a.id === author)) return false;
      return terms.every(t => r.blob.includes(t));
    };
    const tallies = {auth: {}, jrnl: {}};
    for(const r of rows){
      if(r.venue && passes(r, "jrnl")){
        const e = tallies.jrnl[r.venue] || (tallies.jrnl[r.venue] = {n: 0, name: venueLabel(r.venue)});
        e.n++;
      }
      if(passes(r, "auth")) for(const a of r.auth){
        const e = tallies.auth[a.id] || (tallies.auth[a.id] = {n: 0, name: a.name});
        e.n++;
      }
    }
    view = rows.filter(r => passes(r, null));
    const cmp = SORTS[sort].cmp;
    if(cmp) view = view.slice().sort(cmp);
    countEl.textContent = `${view.length} of ${rows.length}`;
    clearEl.hidden = !(topic || author || journal || terms.length
                       || scope !== "all" || sort !== "pass");
    const keepScroll = facets.scrollTop;               // the rail re-renders on every keystroke
    renderFacets(tallies);
    facets.scrollTop = keepScroll;
    sizer.style.height = (view.length * ROW_H) + "px";
    paint();
  }

  function rowHTML(r){
    const who = r.authors.length
      ? esc(r.authors.slice(0, 4).join(" · ")) + (r.authors.length > 4 ? " · …" : "") : "";
    // the venue token resolved back to a real journal name, same map the facet ranks by
    const bib = esc([r.venue ? venueLabel(r.venue) : r.journal, r.year].filter(Boolean).join(" · "));
    const badge = r.cur ? "" : `<span class="lr-badge">stub</span>`;
    const tags = (r.tags || []).slice(0, 8)
      .map(t => `<span class="lr-tag">${esc(t)}</span>`).join("");
    // the same pie the board's cards carry (pass/4), in a gutter the title can't clip
    return `<div class="lr ${r.cur ? "" : "stub"}" data-key="${esc(r.key)}">`
         + `<div class="lr-ind">${passCircle(r.cur ? r.pass : 0)}</div>`
         + `<div class="lr-body">`
         + `<div class="lr-t">${esc(r.title)}</div>`
         + `<div class="lr-m">${badge}${esc(r.key)}${who || bib ? "  ·  " + [who, bib].filter(Boolean).join("  ·  ") : ""}</div>`
         + `<div class="lr-tags">${tags}</div></div>`
         + `<button class="lr-go" title="show this paper on the board">board →</button></div>`;
  }

  // Windowed paint: only the rows the viewport can see are in the DOM, offset by a transform.
  function paint(){
    if(!view.length){
      rowsEl.style.transform = "translateY(0)";
      rowsEl.innerHTML = `<div class="lr-none">nothing in the library matches these filters.</div>`;
      return;
    }
    const first = Math.max(0, Math.floor(scroll.scrollTop / ROW_H) - OVERSCAN);
    const last = Math.min(view.length, first + Math.ceil(scroll.clientHeight / ROW_H) + OVERSCAN * 2);
    rowsEl.style.transform = `translateY(${first * ROW_H}px)`;
    rowsEl.innerHTML = view.slice(first, last).map(rowHTML).join("");
  }

  // named openLib/closeLib, not open/close: the outer scope has an `open` Set (focused cards)
  // and window.close is a real function — shadowing either from in here is a trap for later.
  function openLib(){
    document.body.classList.add("library");
    btn.classList.add("on");
    btn.textContent = "← board";
    recompute();                                // renders the rail too: the facet counts are of the view
    scroll.scrollTop = 0;
    paint();
  }
  function closeLib(){
    document.body.classList.remove("library");
    btn.classList.remove("on");
    btn.textContent = "library";
    redraw();                                   // the board was display:none; its edges need re-anchoring
  }
  const isOpen = () => document.body.classList.contains("library");

  btn.hidden = false;
  btn.addEventListener("click", () => isOpen() ? closeLib() : openLib());
  scroll.addEventListener("scroll", paint);
  addEventListener("resize", () => { if(isOpen()) paint(); });
  filterEl.addEventListener("input", () => { scroll.scrollTop = 0; recompute(); });
  clearEl.addEventListener("click", () => {
    scope = "all"; sort = "pass"; topic = null; author = null; journal = null;
    moreAuth = moreJrnl = false; filterEl.value = "";
    scroll.scrollTop = 0; recompute();
  });
  facets.addEventListener("click", e => {
    const sc = e.target.closest("[data-scope]"), so = e.target.closest("[data-sort]"),
          ch = e.target.closest(".tp-chip"), rw = e.target.closest("[data-auth],[data-jrnl]"),
          mo = e.target.closest("[data-more]");
    if(sc) scope = sc.dataset.scope;
    else if(so) sort = so.dataset.sort;
    else if(mo){                                         // open/close a ranked facet's tail
      if(mo.dataset.more === "auth") moreAuth = !moreAuth; else moreJrnl = !moreJrnl;
      recompute(); return;                               // not a filter change — hold the scroll spot
    }
    else if(rw){
      if(rw.dataset.auth !== undefined) author = author === rw.dataset.auth ? null : rw.dataset.auth;
      else journal = journal === rw.dataset.jrnl ? null : rw.dataset.jrnl;
    }
    else if(ch){
      topic = topic === ch.dataset.slug ? null : ch.dataset.slug;
      if(topic && scope === "stub") scope = "curated";   // a stub can't carry a topic; say so by moving
    } else return;
    scroll.scrollTop = 0; recompute();
  });
  // Two destinations, two gestures. The ROW means "read this": it opens the paper's PDF in the
  // dock beside the list and stays in the library, which is what browsing a bibliography is
  // actually for — you scan, you open one, you scan on. The BOARD button is the seam over to the
  // reasoning surface, and it is explicit because it costs you the list.
  //
  // Falling back matters: a stub has no PDF and a static `lit build` serves none at all, so
  // where there is nothing to open the row keeps its old meaning rather than doing nothing.
  // Leaving first means gotoPaper's scrollIntoView + flash land on a visible board.

// ── THE WALK ─────────────────────────────────────────────────────────────────────────────
// A second view onto the same emitted graph (docs/2026-08-03-the-walk-design.md). The board
// draws five relations at once; this walks ONE at a time as an indented tree, so there is no
// edge layer and nothing can cross. Everything you are NOT walking is a count badge that
// pivots the walk when clicked.
//
// The PDF windows have no graph, so they get nothing. The DRIVE card window DOES get it, and is
// the reason the roster exists: that window is where a paper is actually curated, and "did I
// account for every slice I wrote" is the question being asked there. It carries one paper, so
// the rail is dropped and the card's own paper is the standing focus.
const CARDKEY = DRIVE ? new URLSearchParams(location.search).get("key") : null;
const WALK = (!PDFWIN && !MOBILE_CURATE) ? (function(){
  const rail = document.getElementById("walkRail");
  const stage = document.getElementById("walkStage");
  const btn = document.getElementById("walkBtn");
  if (!rail || !stage || !btn) return null;

  // ── the index ──────────────────────────────────────────────────────────────────────────
  // Papers, slices, stubs and broad nodes become one flat node table; the five relations
  // become adjacency lists. Nothing is authored here that isn't already in the JSON — this is
  // a re-shaping of `grounds` / `up` / `gen` / `cons` / `answers` / `lateral`, not new data.
  let N = {}, CH = {}, KEYS = [], BROAD_IDS = [];
  const REL_KINDS = ["grounds", "builds", "gen", "answers", "corr", "contra"];

  function add(rel, a, b){
    if (!a || !b || a === b) return;
    const l = (CH[rel][a] = CH[rel][a] || []);
    if (!l.includes(b)) l.push(b);
  }
  // A ref {key,tid} → the sharpest node that actually exists. An unsharpened ref (tid null)
  // rests on the container — the CONCEPT §2 wildcard — and that is a valid endpoint, not a miss.
  function resolveRef(r){
    if (!r) return null;
    if (r.slug) return BROAD[r.slug] ? "B:" + r.slug : null;
    const sharp = r.key && r.tid ? `${r.key}:${r.tid}` : null;
    if (sharp && N[sharp]) return sharp;
    return r.key && N[r.key] ? r.key : null;
  }

  function reindex(){
    N = {}; CH = {}; KEYS = []; BROAD_IDS = [];
    REL_KINDS.forEach(k => CH[k] = {});

    const topicsOf = {};
    for (const [slug, t] of Object.entries(TOPICS))
      for (const k of t.papers || []) (topicsOf[k] = topicsOf[k] || []).push(slug);

    for (const [key, p] of Object.entries(PAPERS)) {
      N[key] = {id: key, t: "paper", key, year: p.year, pass: p.pass || 0,
                title: p.title || "", authors: p.authors || [], type: p.type || "original",
                cur: !!p.cur, topics: topicsOf[key] || [], slices: [], wall: []};
      KEYS.push(key);
      for (const s of p.slices || []) {
        const sid = `${key}:${s.id}`;
        N[sid] = {id: sid, t: s.kind, paper: key, sid: s.id, label: s.text || "",
                  quote: s.quote || null, color: s.color || null, floor: !!s.is_floor};
        N[key].slices.push(sid);
      }
    }
    for (const [key, s] of Object.entries(STUBS))
      if (!N[key]) N[key] = {id: key, t: "stub", key, year: s.year, title: s.title || ""};
    for (const [slug, b] of Object.entries(BROAD)) {
      const id = "B:" + slug, m = b.meter || {};
      N[id] = {id, t: "broad", slug, label: b.title || b.text || slug, text: b.text || "",
               s: m.s || 0, c: m.c || 0};
      BROAD_IDS.push(id);
    }
    // The broad band has its own internal ladder: a broad claim generalises into a broader one,
    // up to the apexes the library is capped at. Without these the apex claims — the ones with no
    // paper laddering straight into them — read as empty nodes, which is the opposite of the truth.
    for (const [slug, b] of Object.entries(BROAD))
      for (const up of b.leads_to || []) {

        // Within-paper support (build.py `_up` = grounded_in, local refs). The inverse is not
        // emitted, but it is real and it is the reading a curator wants on a floor: "what in this
        // paper rests on this measurement?" Without it a floor's `built on by` reads empty, which
        // inverts the truth — and makes the most load-bearing slice in the paper look untouched.
        for (const u of s.up || []) {
          const t = N[`${key}:${u}`] ? `${key}:${u}` : null;
          if (t) { add("grounds", sid, t); add("builds", t, sid); }
        }
        for (const g of s.gen || []) {                     // the LOCAL ladder (same paper)
          const t = N[`${key}:${g}`] ? `${key}:${g}` : null;
          if (t) { add("gen", sid, t); add("builds", t, sid); }
        }
        for (const a of s.answers || []) {
          const t = typeof a === "string" ? (N[`${key}:${a}`] ? `${key}:${a}` : null) : resolveRef(a);
          if (t) { add("answers", sid, t); add("answers", t, sid); }
        }
      }
      // cross-paper grounding. A curated target is a real step of the walk; an uncurated one
      // folds into this paper's wall, which is the citation wall staying folded by construction.
      for (const r of p.grounds || []) {
        const src = r.via ? `${key}:${r.via}` : key, tgt = resolveRef(r);
        if (!tgt) continue;
        const base = tgt.split(":")[0];
        if (PAPERS[base]) {
          add("grounds", src, tgt); add("builds", tgt, src);

        } else {
