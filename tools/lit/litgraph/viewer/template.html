<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263646">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LitGraph">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LitGraph</title>
<style>
  :root{
    /* ELN light theme. The variable NAMES are load-bearing: JS reads --grounded / --cross /
       --question via cssv() to stroke the SVG edges, so only their VALUES change here. */
    --bg:#eef1f4;--ink:#27313a;--dim:#53616d;--faint:#6a7884;--line:#d7dde2;--panel:#ffffff;
    --floor:#b5822f;--model:#8a6db1;--grounded:#27735f;--borrowed:#286b9f;
    --question:#a15c1e;--broad:#7a4fb0;--cross:#9a3b3b;
    --plausible:#8a97a4;
    /* programme layer: a claim's modality, and the two feasibility kinds */
    --proposed:#8a6db1;--test:#2f6f8f;--capability:#5a7a52;--risk:#9a3b3b;
    --navy:#263646;   /* the signature ELN accent bar (the HUD) */
    --col:500px;   /* content-container width; the width slider in the HUD drives it */
    --grip:8px;    /* the graph/PDF seam's grab width — widened for fingers under (pointer:coarse).
                      Lives on :root so that override wins: an equal-specificity `body` rule later
                      in this sheet would otherwise beat the one inside the media query. */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  /* The HUD OVERLAYS the board's top padding instead of pushing the board down, so getting it out
     of the way is a pure transform: nothing reflows and the scroll position never jumps. --hud-h
     is its measured height (it wraps to two rows on a narrow screen); --hud-top is what the dock
     hangs from, and collapses to 0 while the bar is away so the PDF takes the space too. */
  body{--hud-h:46px;--hud-top:var(--hud-h)}
  body.hud-off{--hud-top:0px}
  #hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;
    padding:8px 16px;background:var(--navy);color:#d7e0e7;
    border-bottom:1px solid rgba(0,0,0,.18);backdrop-filter:blur(6px);
    transition:transform .18s ease}
  body.hud-off #hud{transform:translateY(-100%)}
  #hud b{font-size:13px;color:#fff}
  #hud .widthctl{display:flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#a9b7c4}
  #hud .widthctl input{width:150px;accent-color:#5a9fd0;cursor:pointer}
  #hud .widthctl .val{min-width:34px;text-align:right;color:#d7e0e7;letter-spacing:0}
  /* board zoom — the camera control, beside width, which is the LAYOUT control. Same shape as
     width on purpose: both are continuous, both want to be swept rather than counted up to, and
     a camera especially — you find the distance you want by moving until the board looks right,
     which is a drag, not eleven clicks. The track is LOG-spaced (see BOARD_ZOOM): zoom is
     multiplicative, so half and double have to sit the same distance from 100%.
     `margin-left:auto` here (rather than on .widthctl) parks the pair together at the bar's end. */
  #hud .zoomctl{margin-left:auto;display:flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#a9b7c4}
  #hud .zoomctl input{width:120px;accent-color:#5a9fd0;cursor:pointer}
  #hud .zoomctl .zval{min-width:38px;text-align:right;color:#d7e0e7;letter-spacing:0;
    font-variant-numeric:tabular-nums;cursor:pointer}
  #hud .zoomctl .zval:hover{color:#fff;text-decoration:underline}

  /* find-a-paper search box (build + serve) + its results dropdown */
  #hud #search{width:240px;font:inherit;font-size:11px;color:#eaf1f6;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;
    padding:4px 12px;outline:none;-webkit-appearance:none}
  #hud #search::placeholder{color:#93a4b3}
  #hud #search:focus{background:rgba(255,255,255,.16);border-color:rgba(150,195,225,.75)}
  #searchResults{position:fixed;z-index:55;width:340px;max-height:70vh;overflow:auto;display:none;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 34px rgba(38,54,70,.24);padding:5px}
  #searchResults.on{display:block}
  #searchResults .sr-row{display:flex;flex-direction:column;gap:2px;padding:7px 9px;border-radius:7px;cursor:pointer}
  #searchResults .sr-row:hover{background:var(--bg)}
  #searchResults .sr-t{font-size:11px;color:var(--ink);line-height:1.3}
  #searchResults .sr-row.stub .sr-t{color:var(--dim)}
  #searchResults .sr-m{font-size:9px;color:var(--faint)}
  #searchResults .sr-badge{font-size:7px;letter-spacing:.6px;text-transform:uppercase;color:#fff;
    background:var(--faint);border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:1px}
  #searchResults .sr-none{padding:9px;font-size:10px;color:var(--faint)}
  #searchResults .sr-more{padding:6px 9px 4px;font-size:9px;color:var(--faint);letter-spacing:.4px}
  /* topic-mode banner: names what's being shown so a topic search never reads as a text match */
  #searchResults .sr-topic{padding:6px 9px 5px;font-size:9px;letter-spacing:.5px;
    text-transform:uppercase;color:#295c86;border-bottom:1px solid var(--line);margin-bottom:3px}

  /* a paper the search jumped to: a brief highlight so the eye lands on it */
  @keyframes foundflash{
    0%{border-color:var(--floor);box-shadow:0 0 0 2px var(--floor),0 6px 20px rgba(181,130,47,.28)}
    100%{border-color:var(--line);box-shadow:0 0 0 0 transparent}}
  .card.found{animation:foundflash 1.7s ease-out}

  /* curation-in-progress review lens (serve only) */
  #hud .wip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#e7cfa6;
    border:1px solid rgba(231,207,166,.42);border-radius:999px;padding:3px 10px;
    background:rgba(181,130,47,.15)}
  #hud .wip:hover{background:rgba(181,130,47,.28);border-color:rgba(231,207,166,.7)}
  #hud .wip .n{color:#fff;font-weight:600}
  #hud .wip[hidden]{display:none}

  /* collapsible PDF viewer toggle (serve only, browse view) */
  #hud .pdfbtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#bcd2e4;
    border:1px solid rgba(120,170,210,.42);border-radius:999px;padding:3px 10px;
    background:rgba(90,159,208,.14)}
  #hud .pdfbtn:hover{background:rgba(90,159,208,.26);border-color:rgba(150,195,225,.7)}
  #hud .pdfbtn.on{background:rgba(90,159,208,.34);border-color:rgba(170,205,230,.85);color:#fff}
  #hud .pdfbtn[hidden]{display:none}

  /* ── LIBRARY view (docs/2026-08-03-topics-and-claim-altitudes.md) ────────────────────────
     The board answers "how does what I know hang together"; this answers "what do I have on X".
     Two different questions that were fighting for one screen, so they get two surfaces:
     BROWSE is where you find, the BOARD is where you reason. A row click hands off to
     gotoPaper(), which is the seam between them.

     It is a VIEW, not a second file: the graph payload is ~2.3 MB inlined, a second document
     would either duplicate it or break the single-file offline property that makes `lit build`
     work over file://. Same body-class idiom as .detached below — hide the graph chrome, let
     the pane fill the window — except the HUD stays, since that is where the toggle lives.

     Deliberately unlike the board: no columns, no edges, no panning. A vertical scroll with a
     facet rail, which is the idiom every reference manager already taught the reader. */
  #libraryPane{display:none}
  body.library #board,body.library #searchResults,
  body.library #tip,body.library #ctxmenu,body.library #wipPanel,
  body.library #aimPanel{display:none!important}
  body.library #libraryPane{display:flex;position:fixed;left:0;right:0;bottom:0;
    top:var(--hud-top);z-index:20;background:var(--bg);transition:top .18s ease}
  body.library{overflow:hidden}
  /* The PDF dock stays live in the library, because reading is what browsing is FOR: a row click
     aims it (see the scroll handler), so the pane has to yield the same width the board does.
     The portrait half of this rule lives with the rest of the split, in the one orientation
     block below — a second one would fight it for order. */
  body.library.dock-open #libraryPane{right:var(--dock-w)}

  /* facet rail — the controls (scope, sort), then three filter axes: topic, journal, author.
     §4 of the design doc is the law for the topic tree: a tier-1 heading reaches 31–46 of 53
     papers, so it groups and never filters; only the leaf containers narrow. Same .tp-head /
     .tp-chip vocabulary as the topics panel on purpose — it is the same axis, shown at more
     length. Journal and author are long tails over the whole ~4.9k bibliography, so they are
     ranked lists (count desc) capped at a head, not chip clouds. */
  #libFacets{flex:0 0 232px;overflow:auto;padding:14px 0 40px;border-right:1px solid var(--line);
    background:var(--panel)}
  #libFacets .lf-hd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding:10px 14px 6px;margin-top:10px;border-top:1px solid var(--line)}
  #libFacets .lf-hd:first-child{margin-top:0;border-top:0;padding-top:0}
  #libFacets .lf-seg{display:flex;gap:4px;padding:0 14px 4px;flex-wrap:wrap}
  #libFacets .lf-opt{font-size:10px;color:var(--dim);background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:3px 9px;cursor:pointer;user-select:none}
  #libFacets .lf-opt:hover{border-color:#b9cfe0;color:#295c86}
  #libFacets .lf-opt.on{background:#295c86;border-color:#295c86;color:#fff}
  #libFacets .tp-head{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;
    color:var(--dim);margin:10px 14px 5px}
  #libFacets .tp-leaves{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 4px}
  #libFacets .tp-chip{display:inline-flex;align-items:baseline;gap:4px;font-size:10px;
    color:#3f6486;background:#eef3f8;border:1px solid #d7e2ec;border-radius:999px;
    padding:3px 9px;cursor:pointer}
  #libFacets .tp-chip:hover{background:#e0ebf4;border-color:#b9cfe0;color:#295c86}
  #libFacets .tp-chip.on{background:#295c86;border-color:#295c86;color:#fff}
  #libFacets .tp-chip.on .n{color:#c6dcec}
  #libFacets .tp-chip .n{color:var(--faint);font-size:8px}
  #libFacets .lf-note{padding:8px 14px 2px;font-size:9px;line-height:1.5;color:var(--faint)}
  /* ranked facet (journal · author): a row, not a chip, because these are long strings and the
     count is the point — right-aligned and tabular so the ranking reads as a column. */
  #libFacets .lf-list{display:flex;flex-direction:column;padding:0 8px 2px}
  #libFacets .lf-row{display:flex;align-items:baseline;gap:6px;font-size:10px;color:#3f6486;
    padding:2px 6px;border-radius:4px;cursor:pointer}
  #libFacets .lf-row:hover{background:#e0ebf4;color:#295c86}
  #libFacets .lf-row.on{background:#295c86;color:#fff}
  #libFacets .lf-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #libFacets .lf-row .n{flex:0 0 auto;font-size:8px;color:var(--faint);font-variant-numeric:tabular-nums}
  #libFacets .lf-row.on .n{color:#c6dcec}
  #libFacets .lf-more{font-size:9px;color:#295c86;cursor:pointer;padding:3px 14px 2px;
    user-select:none}
  #libFacets .lf-more:hover{text-decoration:underline}

  /* the list itself */
  #libMain{flex:1;min-width:0;display:flex;flex-direction:column}
  #libBar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 20px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  #libBar #libFilter{flex:1;min-width:0;max-width:420px;font:inherit;font-size:12px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;outline:none;
    -webkit-appearance:none}
  #libBar #libFilter:focus{border-color:#9dbdd6;background:var(--panel)}
  #libBar .lb-count{font-size:10px;letter-spacing:.6px;color:var(--faint);white-space:nowrap}
  #libBar .lb-clear{font-size:10px;color:#295c86;cursor:pointer;white-space:nowrap;
    border:1px solid #d7e2ec;border-radius:999px;padding:3px 10px;background:#eef3f8}
  #libBar .lb-clear:hover{background:#e0ebf4}
  #libBar .lb-clear[hidden]{display:none}

  /* Windowed scroll: the bibliography is ~3.8k entries and painting them all costs a second of
     layout on every keystroke. A fixed row height is what buys the window, so the row is a
     fixed three-line shape and long tag lists ellipsize rather than wrap. */
  #libScroll{flex:1;overflow:auto;position:relative}
  #libSizer{position:relative;width:100%}
  #libRows{position:absolute;left:0;right:0;top:0}
  /* The row is HORIZONTAL: a fixed indicator gutter, then the text block. The gutter exists
     because .lr-t is nowrap+ellipsis — a badge riding inside the title line is the first thing
     clipped away, and it was clipped on exactly the long titles. Outside the ellipsized box it
     is unconditionally visible, and it lands in a column the eye can run down. */
  #libScroll .lr{height:76px;box-sizing:border-box;display:flex;align-items:center;gap:11px;
    padding:0 20px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--panel)}
  #libScroll .lr-ind{flex:0 0 16px;display:flex;align-items:center;justify-content:center}
  #libScroll .lr-body{flex:1;min-width:0;display:flex;flex-direction:column;
    justify-content:center;gap:3px}
  /* the handoff to the board is its own button on the far right, because the row itself now
     means "read this" — two different destinations must not share one gesture */
  #libScroll .lr-go{flex:0 0 auto;font:inherit;font-size:9px;letter-spacing:.7px;
    text-transform:uppercase;color:#7d94a8;background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  #libScroll .lr-go:hover{background:#295c86;border-color:#295c86;color:#fff}
  #libScroll .lr:hover{background:#f4f7f9}
  #libScroll .lr-t{font-size:12.5px;line-height:1.3;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #libScroll .lr.stub .lr-t{color:var(--dim)}
  #libScroll .lr-m{font-size:9.5px;color:var(--faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #libScroll .lr-tags{display:flex;gap:4px;overflow:hidden;height:14px}
  #libScroll .lr-tag{flex:0 0 auto;font-size:8px;color:#3f6486;background:#eef3f8;
    border:1px solid #d7e2ec;border-radius:999px;padding:1px 6px;line-height:1.4}
  /* "stub" leads the META line, not the title line — the title ellipsizes, the meta starts with
     the citekey and so has room at its head. The curation pass it used to carry is the gutter
     circle's job now (an empty ring already reads as "nothing curated here"). */
  #libScroll .lr-badge{font-size:7px;letter-spacing:.6px;text-transform:uppercase;color:#fff;
    background:var(--faint);border-radius:3px;padding:1px 4px;margin-right:5px;vertical-align:1px}
  #libScroll .lr-none{padding:40px 20px;font-size:11px;color:var(--faint)}

  #hud .libbtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#bcd2e4;
    border:1px solid rgba(120,170,210,.42);border-radius:999px;padding:3px 10px;
    background:rgba(90,159,208,.14)}
  #hud .libbtn:hover{background:rgba(90,159,208,.26);border-color:rgba(150,195,225,.7)}
  #hud .libbtn.on{background:rgba(90,159,208,.34);border-color:rgba(170,205,230,.85);color:#fff}
  #hud .libbtn[hidden]{display:none}

  /* The alternative renderings (docs/2026-08-05-additive-graph-views.md). Serve-only: the wrap
     stays hidden unless GRAPH.views arrived, so a static `lit build` page never grows a menu
     whose links have no server to answer them. */
  #viewsWrap{position:relative;display:inline-flex}
  #viewsWrap[hidden]{display:none}
  #viewsMenu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:260px;
    background:#1b2733;border:1px solid rgba(120,170,210,.42);border-radius:8px;padding:4px;
    box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #viewsMenu[hidden]{display:none}
  #viewsMenu a{display:block;padding:7px 10px;border-radius:5px;text-decoration:none;color:#eaf1f6;
    font-size:12px;letter-spacing:0;text-transform:none}
  #viewsMenu a:hover{background:rgba(90,159,208,.26)}
  #viewsMenu a .vn{display:block;color:#93a4b3;font-size:10.5px;margin-top:1px}

  @media (max-width:760px){
    #libFacets{flex-basis:170px}
    #libScroll .lr{padding:0 12px}
    #libBar{padding:9px 12px}
  }

  /* "finish curation" — the DRIVE card window's counterpart to the picker row's ✓ (serve only) */
  #hud .donebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#a9d8c6;
    border:1px solid rgba(120,200,175,.42);border-radius:999px;padding:3px 10px;
    background:rgba(39,115,95,.20)}
  #hud .donebtn:hover{background:rgba(39,115,95,.38);border-color:rgba(150,215,195,.8);color:#fff}
  #hud .donebtn[disabled]{opacity:.5;cursor:default}
  #hud .donebtn[hidden]{display:none}
  #wipPanel{position:fixed;z-index:45;top:44px;left:16px;width:300px;max-height:72vh;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 34px rgba(38,54,70,.24);padding:6px}
  #wipPanel[hidden]{display:none}
  #wipPanel .wp-hd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding:6px 8px 5px}
  #wipPanel .wp-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer}
  #wipPanel .wp-row:hover{background:var(--bg)}
  #wipPanel .wp-row .ckey{font-size:12px;color:var(--ink)}
  #wipPanel .wp-row .stage{margin-left:auto;font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
  /* per-row "finish" — return the paper to the graph without opening its windows */
  #wipPanel .wp-row .wp-done{flex:0 0 auto;font:inherit;font-size:11px;line-height:1;padding:3px 6px;
    border:1px solid transparent;border-radius:5px;background:none;color:var(--faint);cursor:pointer}
  #wipPanel .wp-row:hover .wp-done{color:var(--dim);border-color:var(--line)}
  #wipPanel .wp-row .wp-done:hover{color:var(--grounded);border-color:var(--grounded)}
  #wipPanel .wp-note{padding:6px 8px 2px;font-size:10px;line-height:1.5;color:var(--faint)}

  /* the programme index — the same panel shape as the worklist, but its rows are links to
     an aim's card (/preview.html?key=@slug) rather than an in-place transition */
  #aimPanel{position:fixed;z-index:45;top:44px;left:16px;width:320px;max-height:72vh;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 34px rgba(38,54,70,.24);padding:6px}
  #aimPanel[hidden]{display:none}
  #aimPanel .wp-hd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding:6px 8px 5px}
  #aimPanel .ap-row{display:flex;align-items:baseline;gap:8px;padding:7px 8px;border-radius:7px;
    text-decoration:none;color:inherit}
  #aimPanel .ap-row:hover{background:var(--bg)}
  #aimPanel .ap-row .ckey{font-size:12px;color:var(--ink)}
  #aimPanel .ap-row .flag{margin-left:auto;flex:none;font-size:9px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--faint)}
  #aimPanel .ap-row .flag.warn{color:var(--risk);font-weight:600}
  #aimPanel .wp-note{padding:6px 8px 2px;font-size:10px;line-height:1.5;color:var(--faint)}

  /* ── the board is a CAMERA over a stage ──────────────────────────────────────────────────
     #board is the scroll port and nothing else; #stage holds the columns and the edge overlay
     and carries the board zoom as one `scale()`. A camera, not a layout change: zooming re-wraps
     nothing, so the picture a reader has learned — which column sits where, how long a card runs —
     survives it, and the SVG scales with the cards it anchors on for free.
     Why a transform and not `zoom`: every scroll-anchoring site in this file compensates a DOM
     shift with `board.scrollLeft += <viewport delta>`. Under a transform the scroll port's own
     coordinate space stays viewport-scaled, so all of those keep working untouched; CSS `zoom`
     would divorce scrollLeft from the rects and break them silently. The one place that pays is
     redraw(), which converts viewport rects into stage coordinates (÷ BZ — see there).
     Absolutely positioned so the board's scroll extent is the stage's TRANSFORMED box: zoom out
     and the scrollable region shrinks with the picture instead of leaving screenfuls of nothing.
     Lengths that must hold their size on the GLASS rather than on the stage — the HUD clearance,
     the centering padding — divide by --bz; everything else is stage-space and scales.

     That side padding centers the landing column on screen when nothing is expanded (half the
     viewport minus half a column), so grounds (←) and builds/synthesis (→) spawn symmetrically;
     it grows into scroll as columns fan out. min 40px keeps a gutter on narrow screens. */
  :root{--bz:1}                                   /* board zoom — JS drives it, redraw() reads it */
  #board{position:absolute;inset:0;overflow:auto}
  #stage{position:absolute;top:0;left:0;transform:scale(var(--bz));transform-origin:0 0;
    width:max-content;min-width:calc(100% / var(--bz));
    display:flex;align-items:flex-start;
    gap:54px;padding:calc(var(--hud-h) / var(--bz) + 34px) max(40px, calc(50vw / var(--bz) - var(--col)/2)) 80px}
  /* edges paint above the cards so an arrow runs all the way to the slice row it anchors
     on (never clipped at the container border); hover-isolation is for disentangling */
  svg#edges{position:absolute;top:0;left:0;z-index:10;pointer-events:none;overflow:visible}

  .col{position:relative;z-index:5;display:flex;flex-direction:column;gap:14px;flex:none;width:var(--col)}
  /* an empty landing column is a prompt, not a column: at full --col width it spends a third of
     the screen on nothing and shoves the apex claims off the right edge, which is the opposite
     of what landing on the top of the ladder is for. Shrink it to its own caption. */
  .col.vacant{width:auto;max-width:200px}
  .col.vacant .colhd{margin-bottom:0;line-height:1.6}
  /* the centering padding exists to hold the landing column mid-screen; with nothing in it that
     is half a screen of margin in front of the ladder you were meant to land on */
  body.landing-vacant #stage{padding-left:40px}
  .col .colhd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding-left:4px;margin-bottom:-4px}
  /* the release-everything exit: puts every shown claim away and dismisses every stub summoned by
     name. Present only while there is something to release (see syncLanding). */
  .col .colhd .hd-clear{margin-left:7px;padding:1px 7px;border:1px solid var(--line);
    border-radius:999px;cursor:pointer;letter-spacing:.6px}
  .col .colhd .hd-clear:hover{background:#f7e8e8;border-color:#e0bcbc;color:#a33}

  /* Provenance, landing column only: the shown claims this paper answers to. With the column flat
     a card needs no excuse for being here, so the strip is not an explanation any more — it is what
     tells you whose hoisted block a card belongs to when two claims are gathered at the top. No
     reason to state means no strip (.plain), rather than a dashed rule under every one of 54 cards. */
  .card .cprov{display:flex;align-items:center;gap:6px;padding:3px 8px 4px 11px;
    border-top:1px dashed var(--line);font-size:8px;letter-spacing:.4px;color:var(--faint)}
  .card.plain .cprov{display:none}
  .card .cvia{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* paper card */
  .card{position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);
    overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:#b8c3cc}
  .card.curated{border-style:solid}
  .card.stub{border-style:dashed;opacity:.92;cursor:default}
  .card.focus{border-color:var(--grounded);box-shadow:0 0 0 1px var(--grounded),0 6px 20px rgba(38,54,70,.14)}
  /* hover counterpart: the paper(s) an edge of the hovered claim touches */
  .card.hl{border-color:var(--borrowed);box-shadow:0 0 0 1px var(--borrowed)}
  .bn.hl{box-shadow:0 0 0 1.5px var(--borrowed)}
  /* header: circle + citekey always; type/year only when expanded. Flex row = no overlap.
     wrap so a paper's tag chips can spill onto a second header line on a narrow card. */
  .chd{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:9px 11px}
  .circle{flex:none;display:flex;width:16px;height:16px}
  .ckey{font-size:11px;font-weight:700;cursor:help}
  /* the paper classifier (original / perspective / methods …) rides in the header at all
     times — collapsed or open — so a paper's kind is legible without focusing it */
  .ctype{display:inline-block;font-size:7px;padding:1px 5px;border-radius:4px;font-weight:700;
    color:#fff;background:var(--dim)}
  .ctype.original{background:#5d7290}.ctype.methods{background:var(--floor)}
  .ctype.perspective{background:#8a6db1}.ctype.review{background:#2f8f7f}
  .ctype.commentary{background:#a15c1e}
  .cyr{display:none;margin-left:auto;font-size:9px;color:var(--faint)}
  /* expanded-only body (revealed when a curated card is focused → .open) */
  .ctitle{display:none;padding:0 11px 2px;font-size:10px;color:var(--dim);line-height:1.32}
  .cauth{display:none;padding:4px 11px 6px;font-size:9px;color:var(--faint)}
  .cauth .star{color:var(--floor)}
  .cauth .anum{color:var(--faint);opacity:.7;font-style:italic}
  /* the abstract: on desktop it lives in the hover tip; on touch (no hover) it shows inline in
     the open card instead (revealed by the coarse-pointer media query below) */
  .cabs{display:none;padding:0 11px 8px;font-size:10px;color:var(--dim);line-height:1.4}
  .card.open .cyr{display:inline-block}
  .card.open .ctitle,.card.open .cauth{display:block}
  /* the aim card's punchline. A paper's card is a bibliography record — its citekey identifies it
     and the title can wait for the open state. An aim has no such handle: `@fluid-solid-switch`
     collapsed told a reader nothing at all. So an aim's title and its one-line thesis (the first
     sentence of `note`) read on the CLOSED card, and the rest of the pitch follows when it opens.
     Placed after the .card.open rules so equal specificity resolves this way. */
  .card.aim .ctitle{display:block;padding:3px 11px 0;font-size:11px;font-weight:600;color:var(--ink)}
  .cpunch{padding:3px 11px 9px;font-size:10px;color:var(--dim);line-height:1.35}
  /* the standing counts — `lit programme`'s report on one line, above the rows. It leads with what
     is weakest on purpose: the assumptions nothing checks are what a jury finds first anyway. */
  .cstat,.cnote{display:none;padding:0 11px 9px;font-size:9px;color:var(--faint);line-height:1.5}
  .cnote{font-size:10px;color:var(--dim);line-height:1.4;padding-bottom:7px}
  .card.open .cstat,.card.open .cnote{display:block}
  .cstat .warn{color:var(--risk);font-weight:600}
  /* curator tags — a container filter axis; ride in the header (collapsed or open), click one to
     search it. As a single flex child they wrap onto their own header line when the row is full. */
  .ctags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .ctag{font-size:8px;letter-spacing:.3px;color:#3f6486;background:#eef3f8;border:1px solid #d7e2ec;
    border-radius:999px;padding:2px 7px;cursor:pointer}
  .ctag:hover{background:#e0ebf4;border-color:#b9cfe0;color:#295c86}
  /* open card: body is inert; the header collapses, the slice rows drill */
  .card.open{cursor:default}
  .card.open .chd{cursor:pointer}

  /* slices (vertical, within-paper). A paper's slices render as the GRAPH they are (see
     renderGraph); an aim's still render as the outline of groups its rhetoric wants. */
  .slices{display:none;border-top:1px solid var(--line);padding:6px 9px 9px 12px;background:#f9fbfc}
  .card.open .slices{display:block}
  /* ── the local subgraph, drawn as a graph ───────────────────────────────────────────────
     One node per slice and never more. The outline this replaces re-rendered a shared support
     under every branch that reached it — Fuhs2022NatPhys's 26 slices drew 76 rows — and an
     edge that skipped a generation had nowhere to be drawn at all.
     The columns ARE the hierarchy: a slice's column is its longest chain of local support, so
     the axis runs ground → derived, left → right, exactly as `leads-to` runs on the board. The
     body scrolls sideways rather than squeezing the columns, because a claim you cannot read is
     not a claim you can curate; fold the card when you want the shape instead of the text. */
  .snodes{display:flex;align-items:flex-start;gap:26px;overflow-x:auto;padding-bottom:4px}
  .scol{flex:0 0 auto;width:212px;display:flex;flex-direction:column;gap:4px}
  .snodes.allfold .scol{width:106px}      /* badges only — the whole ladder lands on screen */
  .schd{display:flex;align-items:center;gap:5px;font-size:7.5px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--faint);padding:0 0 2px 3px;border-bottom:1px solid var(--line)}
  .schd .sct{margin-left:auto;letter-spacing:0}
  .snodes .slice{cursor:pointer;margin:0}
  .snodes .slice:hover{background:#e9eef2}
  .slices .sbar{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
  .slices .saxis{opacity:.75}
  .slices .sfold{margin-left:auto;cursor:pointer;letter-spacing:.5px;padding:1px 6px;
    border:1px solid var(--line);border-radius:9px;white-space:nowrap}
  .slices .sfold:hover{color:var(--dim);border-color:#b8c3cc;background:#fff}
  /* folded to its badge: the text goes, the node stays — collapse the card and the whole
     topology lands in one screenful, which is when the arcs stop being decoration */
  .slice.fold{padding:1px 5px}
  .slice.fold .stx{display:none}
  .slice.fold .fkd{display:inline}
  .fkd{display:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--faint);font-size:8px;line-height:1.4}
  /* the paper's entry rows partition into standing sections — its own novel claims &
     questions, then the borrowed (restated) claims, then the open questions it leaves
     unanswered (at the bottom) — each a labeled sub-container */
  .slices .sgrp{display:flex;align-items:center;gap:4px;cursor:pointer;
    font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);
    margin:7px 0 3px;padding-top:5px;border-top:1px solid var(--line)}
  .slices .sgrp:first-child{margin-top:0;padding-top:0;border-top:0}
  .slices .sgrp:hover{color:var(--dim)}
  .slices .sgrp .gcar{font-size:7px}
  .slices .sgrp .gct{margin-left:auto;letter-spacing:0;font-weight:400;color:var(--faint)}
  .slices .sgrpb{padding-left:6px;margin-left:2px;border-left:1px solid #e0e5e9}
  .slice{display:flex;gap:5px;align-items:flex-start;padding:3px 5px;margin:2px 0;border-radius:5px;
    background:#f3f6f8;font-size:9px}
  .slice.drillable{cursor:pointer}
  .slice.drillable:hover{background:#e9eef2}
  .car{flex:none;width:9px;color:var(--faint);font-size:8px;margin-top:1px;text-align:center}
  .sid{flex:none;font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff;margin-top:1px}
  .sid.fl{background:var(--floor)}.sid.cl{background:var(--grounded)}.sid.bo{background:var(--borrowed)}
  .sid.q{background:var(--question)}
  .sid.q.ans{opacity:.55}
  /* programme slice badges: modality (pr/sp), the two feasibility kinds (te/ca), risk (ri) */
  .sid.pr{background:var(--proposed)}.sid.sp{background:var(--plausible)}
  .sid.te{background:var(--test)}.sid.ca{background:var(--capability)}
  .sid.ri{background:var(--risk)}
  /* the assumption badge — a claim carrying weight with no test under it */
  .lb{flex:none;margin-left:5px;padding:0 4px;border-radius:6px;font-size:7px;
      font-weight:700;color:#fff;background:var(--risk);margin-top:1px}
  .stx{color:var(--ink);line-height:1.28}
  /* the `discriminates` relation, shown ON the rows instead of by nesting: the test names what it
     separates, each claim names the test aimed at it. Both sit in the same group, so drilling the
     test to reach its rivals would render them twice — the relation is a cross-reference here. */
  .tst{flex:none;margin-left:5px;margin-top:1px;padding:0 4px;border-radius:6px;font-size:7px;
      font-weight:700;letter-spacing:.3px;color:var(--test);background:#eef4f8;border:1px solid #cddbe4}
  .sep{display:block;margin-top:3px;font-size:8px;color:var(--faint)}
  .sep b{color:var(--test);font-weight:700}
  /* a slice whose weld is a PDF quote: its page pops on hover, pins on click (no inline text) */
  .slice.pdf-src{cursor:pointer}
  .slice.pdf-src .stx{border-bottom:1px dotted #b9a55f}
  .slice.pdf-src:hover .stx{border-bottom-color:var(--borrowed)}
  /* the generalization ladder: a row that ladders (leads_to) into the broader claim above */
  .slice.gen{border-left:2px solid var(--broad)}
  .gmk{flex:none;color:var(--broad);font-size:8px;margin-top:1px}

  /* source stack — citation-wall collapse: a focused paper's uncurated sources fold into
     one "▸ N sources" card; only an explicit click unfolds it */
  .card.stack{cursor:pointer}
  .stack .ckey{color:var(--dim);font-weight:600}
  .srcs{display:none;border-top:1px solid var(--line);padding:5px 9px 8px;background:#f9fbfc}
  .card.stack.open .srcs{display:block}
  .src{display:flex;gap:6px;align-items:baseline;padding:2px 5px;margin:1px 0;border-radius:4px;
    background:#f3f6f8;font-size:9px}
  .src:hover{background:#e9eef2}
  .src .skey{font-weight:700}
  .src .sy{margin-left:auto;color:var(--faint);font-size:8px}

  /* ── the family container ──────────────────────────────────────────────────────────────
     One box per ladder root: its own card at the head, its whole descent nested below. The box
     IS the `leads_to` edge — containment drawn as containment, which is why the band no longer
     draws rungs as arrows. Deliberately quiet chrome: a hairline and a wash, because the thing
     that must read at a glance is the nesting, not the boxes' own borders. */
  .bfam{position:relative;border:1px solid #ddd2ee;border-radius:16px;padding:7px;
    background:linear-gradient(180deg,#f7f4fc,#fbfaff)}
  .bfam > .bn{border-width:1.6px}
  /* the fold bar, the paper card's `.sbar` idiom one scale up: a density control, never a reveal */
  .bfbar{display:flex;align-items:center;gap:8px;padding:6px 6px 4px 8px;font-size:8px;
    letter-spacing:1.1px;text-transform:uppercase;color:#8a72b4}
  .bfbar .bfn{flex:1}
  .bfbar .bffold{cursor:pointer;border:1px solid #ddd0ee;border-radius:999px;padding:2px 9px;
    background:#f2ecfa;letter-spacing:.7px}
  .bfbar .bffold:hover{background:#6b3fae;border-color:#6b3fae;color:#fff}
  /* the nest: an indented well with a rule down its left edge, so depth reads without counting */
  .bnest{margin:2px 0 0 9px;padding-left:9px;border-left:1.5px solid #e2d8f2;
    display:flex;flex-direction:column;gap:5px}
  .bbranch{display:flex;flex-direction:column;gap:5px}
  /* a rung: the same card, written small. Folded (the default) it is its title and its readouts —
     the full statement is the element's own hover title, and one bar-click puts every statement in
     the family on screen at once. */
  .bn.rung{border-radius:9px;padding:5px 9px;border-width:1.2px}
  .bn.rung .bkd{display:none}
  .bn.rung .btl{font-size:10px;margin-bottom:2px}
  .bn.rung .btx{font-size:9px;color:var(--dim)}
  .bn.rung .meter{margin-top:4px}
  .bn.rung .bdrills,.bn.rung .blens{margin-top:4px}
  .bfam.folded .bn.rung .btx{display:none}
  .bfam.folded .bn.rung .btl{margin-bottom:0}
  .bfam.folded .bn.rung{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;padding:4px 9px}
  .bfam.folded .bn.rung .btl{flex:1;min-width:120px}
  .bfam.folded .bn.rung .meter,.bfam.folded .bn.rung .bdrills,
  .bfam.folded .bn.rung .blens{margin-top:0}
  /* a claim that ladders into more than one broader claim, said on the card that hosts it */
  .balso{margin-top:5px;font-size:8px;letter-spacing:.4px;color:#8a72b4;font-style:italic}
  .bfam.folded .bn.rung .balso{display:none}
  /* …and the pointer left under every OTHER parent. A row, not a card: copying the card is what an
     outline does, and the paper card's DAG exists because that duplication was not worth paying. */
  .bref{display:flex;align-items:baseline;gap:6px;padding:3px 9px;border-radius:8px;cursor:pointer;
    border:1px dashed #ddd0ee;background:#fbf9fe;font-size:9px;color:var(--dim)}
  .bref:hover{background:#f2ecfa;border-color:#c3a9e6}
  .bref .brefa{color:#8a72b4;font-size:8px}
  .bref .breft{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bref .brefn{font-size:7px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
  /* naming a claim (a ref row, a second parent) scrolls to it — same flash the paper list uses */
  .bn.found{animation:foundflash 1.7s ease-out}

  /* broad / synthesis nodes */
  .bn{position:relative;border:1.6px solid var(--broad);border-radius:14px;padding:9px 12px;
    background:linear-gradient(160deg,#f4f0fa,#ece3f6);cursor:pointer}
  .bn.q{border-color:var(--question);background:linear-gradient(160deg,#faf3e6,#f6ead8)}
  .bn .bkd{font-size:7px;letter-spacing:1.4px;text-transform:uppercase;color:#6b3fae;margin-bottom:3px}
  .bn.q .bkd{color:#9a6516}
  .bn .btl{font-size:11px;font-weight:700;line-height:1.25;color:var(--ink);margin-bottom:3px}
  .bn .btx{font-size:10px;line-height:1.3;color:var(--ink)}
  /* with a title the full statement is the gloss under it — demoted, not hidden */
  .bn.titled .btx{font-size:9px;color:var(--dim)}
  .bn .meter{margin-top:6px;display:flex;gap:6px;font-size:8px}
  .bn .meter .s{color:var(--grounded)}.bn .meter .c{color:var(--cross)}
  /* The two evidence readouts. NEITHER is a control: showing a claim is the CARD's click, and
     these report what that click did — the rung chip how many narrower claims it gathered up with
     the card (they were on the band either way), the lens how many papers it put in the column and
     how many of those are still there after any × dismissals. Both were buttons once, and having
     three ways to say
     "show me this claim" was the confusion; making them labels rather than restyling them is the
     fix. pointer-events:none on each, so a click aimed at a chip lands on the card. */
  .bn .bdrills{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
  .bn .bdrill{display:inline-flex;align-items:center;gap:4px;font-size:8px;
    letter-spacing:.7px;text-transform:uppercase;color:#6b3fae;background:#f2ecfa;
    border:1px solid #ddd0ee;border-radius:999px;padding:2px 8px;pointer-events:none}
  .bn .blens{margin-top:6px}
  .bn .lens{display:inline-flex;align-items:center;gap:4px;font-size:8px;letter-spacing:.7px;
    text-transform:uppercase;color:#295c86;background:#eef3f8;border:1px solid #d7e2ec;
    border-radius:4px;padding:2px 8px;pointer-events:none}
  /* shown: filled, so "this claim is on the board" reads at a glance down a column of chips */
  .bn .lens.on{background:#295c86;border-color:#295c86;color:#fff}
  .bn .bdrill.on{background:#6b3fae;border-color:#6b3fae;color:#fff}

  /* tooltip */
  #tip{position:fixed;z-index:50;width:300px;border:1px solid var(--line);border-radius:10px;
    background:rgba(255,255,255,.97);box-shadow:0 12px 40px rgba(38,54,70,.18);padding:11px 13px;display:none;backdrop-filter:blur(8px);
    max-height:88vh;overflow-y:auto}
  /* metadata card: title · all authors · journal · year · non-clickable first-page preview */
  #tip .ttitle{margin:0 0 4px;font-size:11px;font-weight:700;color:var(--ink);line-height:1.3}
  #tip .tauth{font-size:9.5px;color:var(--dim);line-height:1.4;margin-bottom:6px}
  #tip .meta{font-size:9px;color:var(--faint);margin-bottom:7px}
  #tip .pdf{margin-top:9px;height:70px;border:1px dashed var(--line);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--faint);
    background:repeating-linear-gradient(180deg,#f3f6f8,#f3f6f8 6px,#e9eef2 6px,#e9eef2 12px)}
  #tip .pdf.live{border-color:var(--line);height:210px;padding:0;overflow:hidden;
    background:#fff;align-items:flex-start;border-style:solid}
  #tip .pdf.live img{width:100%;display:block}
  #tip .nopdf{margin-top:9px;font-size:9px;color:var(--faint);font-style:italic}
  /* live-fetched abstract for an uncurated stub (serve-only) — clamped + scrollable */
  #tip .tabs{margin-top:9px;font-size:9.5px;color:var(--dim);line-height:1.5;text-align:justify;
    max-height:240px;overflow-y:auto;border-top:1px solid var(--line);padding-top:8px}
  .hint{position:fixed;bottom:12px;left:16px;font-size:10px;color:var(--faint);z-index:30}

  /* right-click "Curate this paper" menu (serve only, browse view) */
  #ctxmenu{position:fixed;z-index:70;display:none;min-width:150px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 12px 40px rgba(38,54,70,.20)}
  #ctxmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;
    font:inherit;font-size:11px;color:var(--ink);padding:6px 10px;border-radius:5px;cursor:pointer}
  #ctxmenu button:hover{background:var(--bg)}

  /* floating PDF quote window: the page rendered, the quote highlighted, movable/zoomable */
  .pw{position:fixed;z-index:60;width:440px;height:520px;display:flex;flex-direction:column;
    border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;
    user-select:none;box-shadow:0 14px 50px rgba(38,54,70,.22)}
  .pw-bar{flex:none;display:flex;align-items:center;gap:6px;height:22px;padding:0 4px 0 8px;
    background:#f3f6f8;border-bottom:1px solid var(--line);cursor:move;user-select:none;
    font-size:9px;color:var(--dim)}
  .pw-bar b{color:#24313d;font-weight:700}
  .pw-bar .sp{margin-left:auto}
  .pw-tools{display:flex;gap:1px}
  .pw-tool{cursor:pointer;border:0;background:transparent;color:var(--faint);font:inherit;
    font-size:11px;line-height:1;padding:2px 5px;border-radius:3px}
  .pw-tool:hover{color:#24313d}
  /* the PDF's own zoom slider, in its own titlebar — the board's lives in the HUD. Two surfaces,
     two distances; the control has the same shape because the gesture is the same (sweep to the
     distance you want), and nothing else about them is shared. Short track: the bar is 22px of
     chrome beside the key, the page number and four tools, and the wheel is the fine control. */
  .pw-zoom{display:flex;align-items:center;gap:5px}
  .pw-zoom[hidden]{display:none}
  .pw-zoom input{width:66px;height:12px;margin:0;accent-color:#6ea8d8;cursor:pointer}
  .pw-zoom .pz-val{font-size:9px;min-width:30px;text-align:right;color:var(--faint);
    font-variant-numeric:tabular-nums;cursor:pointer}
  .pw-zoom .pz-val:hover{color:#24313d}
  .pw[data-tool=pan]  .pw-tool[data-t=pan],
  .pw[data-tool=text] .pw-tool[data-t=text]{background:#cfd8e0;color:#24313d}
  .pw-x{cursor:pointer;padding:0 5px;color:var(--faint);font-size:12px;line-height:1}
  .pw-x:hover{color:#24313d}
  .pw-body{flex:1;position:relative;overflow:auto;background:#e0e5e9;
    scrollbar-width:thin;scrollbar-gutter:stable}
  .pw[data-tool=pan]  .pw-body{cursor:grab}
  .pw[data-tool=pan]  .pw-body.pan{cursor:grabbing}
  .pw[data-tool=text] .pw-body{cursor:text}
  .pw-sizer{position:relative}
  .pw-stage{position:absolute;top:0;left:0;transform-origin:0 0}
  .pw-page{position:relative;width:100%;margin-bottom:8px;background:#fff;
    box-shadow:0 1px 3px rgba(38,54,70,.16)}
  .pw-page:last-child{margin-bottom:0}
  .pw-img{display:block;width:100%;height:auto;pointer-events:none}
  .pw-hl{position:absolute;background:#ffe45a55;outline:1.5px solid #ffd21e;
    mix-blend-mode:multiply;border-radius:1px;pointer-events:none}
  /* find-in-PDF: a bar under the titlebar, its hits on the page. The quote highlight is yellow
     and AUTHORED — it is the weld a curator wrote; a search hit is transient and mine, so it
     takes its own blue and the one you are standing on goes orange. Three marks, never confused. */
  .pw-find{flex:none;display:none;align-items:center;gap:4px;padding:3px 4px 3px 8px;
    background:#eef2f5;border-bottom:1px solid var(--line);font-size:9px;color:var(--dim)}
  .pw.finding .pw-find{display:flex}
  .pw-find input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;
    background:var(--panel);color:var(--ink);font:inherit;font-size:10px;padding:2px 6px;
    user-select:text;-webkit-user-select:text}
  .pw-find input:focus{outline:none;border-color:#6ea8d8}
  .pw-find .pw-fn{flex:none;min-width:42px;text-align:right;color:var(--faint);
    font-variant-numeric:tabular-nums}
  .pw-fb{flex:none;cursor:pointer;border:0;background:transparent;color:var(--faint);font:inherit;
    font-size:11px;line-height:1;padding:2px 5px;border-radius:3px}
  .pw-fb:hover:not(:disabled){color:#24313d;background:#dce3e9}
  .pw-fb:disabled{opacity:.3;cursor:default}
  .pw-fh{position:absolute;background:#6ea8d833;outline:1px solid #6ea8d8;
    mix-blend-mode:multiply;border-radius:1px;pointer-events:none}
  .pw-fh.on{background:#ff9b3d55;outline:1.5px solid #f2760a}
  .pw-text{position:absolute;inset:0;line-height:1;pointer-events:none}
  .pw[data-tool=text] .pw-text{pointer-events:auto}
  .pw-text span{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;
    user-select:text;cursor:text}
  .pw-text span::selection{background:rgba(46,120,210,.30)}
  .pw-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--faint)}
  .pw-grip{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;
    background:linear-gradient(135deg,transparent 50%,var(--line) 50%,var(--line) 62%,transparent 62%,
    transparent 74%,var(--line) 74%,var(--line) 86%,transparent 86%)}

  /* ── mobile / touch: read-only friendliness ──────────────────────────────────────────────
     Desktop is fenced off: layout keys off max-width (below ~640px two columns can't fit
     anyway); input affordances key off (hover:none)+(pointer:coarse). The three unconditional
     clamps below are desktop-safe (they only bite when a panel would overflow the viewport). */
  #tip{max-width:calc(100vw - 16px)}
  #wipPanel,#aimPanel{max-width:calc(100vw - 16px)}
  #board{overscroll-behavior-x:contain}          /* no back/forward-swipe hijack from the h-scroll */
  .pw-body{overscroll-behavior:contain}          /* nested page-scroll doesn't chain to the board */

  @media (max-width:640px){
    :root{--col:min(340px,86vw)}                 /* card fits with a gutter; neighbor column peeks */
    #stage{gap:22px;padding:calc(var(--hud-h) / var(--bz) + 22px) max(12px, calc(50vw / var(--bz) - var(--col)/2)) 80px}
    #hud{gap:8px 10px;flex-wrap:wrap}
    #hud .widthctl{display:none}                 /* column ≈ full width — slider is moot (and ate swipes) */
    #wipPanel,#aimPanel{left:8px;right:8px;width:auto;max-height:60vh}
  }
  @media (hover:none) and (pointer:coarse){
    /* the movable/resizable quote window becomes a near-fullscreen sheet: no drag, no resize,
       native scroll, closed by its × (drag/resize/pan are gated in JS on pointerType) */
    .pw{position:fixed !important;inset:8px !important;width:auto !important;height:auto !important}
    .pw-grip{display:none}
    .pw-bar{cursor:default}
    /* the find bar is a real form control on a touch screen: 16px is the size below which iOS
       zooms the whole sheet on focus, and the arrows need a finger-sized target */
    .pw-find{padding:5px 4px 5px 8px}
    .pw-find input{font-size:16px;padding:4px 7px}
    .pw-fb{padding:6px 9px;font-size:13px}
    .card,.slice,.slices .sgrp,.card.stack,.pw-tool,.pw-x,#hud .wip,
    #wipPanel .wp-row,#aimPanel .ap-row,#libFacets .tp-chip,
    .bn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .slice{padding:7px 6px}                       /* fatter tap targets */
    .slices .sgrp{padding-top:9px;margin:9px 0 4px}
    #wipPanel .wp-row{padding:11px 10px}
    /* the aim rows wrap on a narrow screen: title on one line, the flag beneath it */
    #aimPanel .ap-row{padding:12px 10px;flex-wrap:wrap;gap:2px 8px}
    #aimPanel .ap-row .flag{margin-left:0;flex-basis:100%}
    /* nothing on a card is tappable but the card: the strip is a label, and neither chip on a
       claim is a control — the whole claim card is the target. */
    .card .cprov{padding:5px 8px 6px 11px}
    .bn .lens,.bn .bdrill{padding:4px 10px}
    /* the nest costs width per level, and a 340px column cannot pay the desktop rate three deep:
       halve the indent and keep the rule, which is what actually carries the depth */
    .bnest{margin-left:5px;padding-left:5px}
    .bfbar .bffold{padding:4px 10px}
    .card:active{border-color:#b8c3cc}            /* tap feedback (replaces the lost :hover cue) */
    .slice.drillable:active{background:#e9eef2}
    .card.open .cabs{display:block}               /* abstract inline (no hover tip on touch) */
    body{--grip:22px}                             /* a seam a finger can actually catch */
  }

  /* ── collapsible PDF viewer ─────────────────────────────────────────────────────────────
     Toggled from the HUD. One docked pane the graph makes room for; hovering (or tapping) a
     quote-slice aims it. Empty until the first aim — the placeholder sits behind and is painted
     over once a page mounts.
     ONE layout for every mode. Phone curation used to have its own stacked split while the browse
     view was always a right-hand dock, which meant the same PDF behaved differently depending on
     how you had arrived at it. The split now follows the WINDOW's long axis rather than the mode:
     landscape puts the PDF beside the graph, portrait puts it underneath. The two fractions are
     stored separately, so rotating a phone lands on the ratio you last chose for that shape. */
  body{--dock-w:44%;--dock-h:52%}                 /* JS-driven, persisted, resizable */
  body.dock-open #board{right:var(--dock-w)}
  #dockEmpty{display:none}
  body.dock-open #dockEmpty{display:flex;position:fixed;right:0;top:var(--hud-top);bottom:0;
    width:var(--dock-w);z-index:15;align-items:center;justify-content:center;text-align:center;
    padding:0 32px;border-left:1px solid var(--line);background:var(--bg);
    color:var(--faint);font-size:11px;line-height:1.6}
  body.dock-open .pw-side{position:fixed !important;right:0 !important;
    left:auto !important;top:var(--hud-top) !important;bottom:0 !important;width:var(--dock-w) !important;
    height:auto !important;border-radius:0;box-shadow:none;border-left:1px solid var(--line);
    z-index:16;transition:top .18s ease}
  body.dock-open .pw-side .pw-grip{display:none}
  body.dock-open .pw-side .pw-bar{cursor:default}
  /* drag handle on the seam — Hyprland-style resize (persisted). The pill makes it findable on a
     touchscreen, where there is no hover to reveal the strip. */
  #dockGrip{display:none;touch-action:none}
  body.dock-open #dockGrip{display:block;position:fixed;top:var(--hud-top);bottom:0;right:var(--dock-w);
    width:var(--grip);margin-right:calc(var(--grip) / -2);z-index:17;cursor:ew-resize;
    background:transparent;transition:background .12s,top .18s ease}
  #dockGrip::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:3px;height:38px;border-radius:3px;background:#c3ccd4;transition:background .12s}
  #dockGrip:hover,body.dock-resizing #dockGrip{background:#6ea8d8}
  #dockGrip:hover::after,body.dock-resizing #dockGrip::after{background:#fff}
  body.dock-resizing{user-select:none}            /* the cursor is set per axis from JS */
  body.dock-resizing .pw-side{pointer-events:none}

  /* PORTRAIT — the long axis is vertical, so the graph takes the top and the PDF the bottom. */
  @media (orientation:portrait){
    body.dock-open #board{right:0;bottom:var(--dock-h)}
    body.dock-open #dockEmpty{left:0;right:0;top:auto;bottom:0;width:100%;height:var(--dock-h);
      border-left:0;border-top:1px solid var(--line)}
    body.dock-open .pw-side{left:0 !important;right:0 !important;top:auto !important;
      bottom:0 !important;width:100% !important;height:var(--dock-h) !important;
      border-left:0;border-top:1px solid var(--line)}
    body.dock-open #dockGrip{left:0;right:0;top:auto;bottom:var(--dock-h);width:auto;
      height:var(--grip);margin:0 0 calc(var(--grip) / -2) 0;cursor:ns-resize}
    #dockGrip::after{width:38px;height:3px}
    body.library.dock-open #libraryPane{right:0;bottom:var(--dock-h)}
  }
  /* ── PDF-only window (index.html?detached=1 or ?focus=1) ────────────────────────────────
     One document, two drivers: the browse view's popped-out dock (`detached`, mirrored over a
     BroadcastChannel) and curation's paper window (`focus`, aimed by polling the focus wire).
     Both hide all graph chrome and let the PDF pane fill the whole window. Same .pw markup as
     the dock, restyled to be borderless. */
  #detachPane{display:none}
  body.detached{overflow:hidden}
  body.detached #hud,body.detached #board,body.detached #searchResults,body.detached #dockEmpty,
  body.detached #dockGrip,body.detached #tip,body.detached #ctxmenu,
  body.detached #wipPanel,body.detached #aimPanel,
  body.detached #libraryPane{display:none!important}
  body.detached #detachPane{display:block;position:fixed;inset:0;z-index:5;background:#e0e5e9}
  body.detached #detachEmpty{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;text-align:center;padding:24px;color:var(--faint);font-size:12px}
  body.detached #detachPane .pw{position:absolute!important;inset:0!important;
    width:auto!important;height:auto!important;border:0;border-radius:0;box-shadow:none}
  body.detached #detachPane .pw-grip{display:none}
  body.detached #detachPane .pw-bar{cursor:default}

  /* ── the DRIVE card window ───────────────────────────────────────────────────────────────
     preview.html?key=…&drive=1 in its own OS window: the paper's isolated subgraph, standing
     alone rather than squeezed into a pane. Nothing to restyle — it IS the viewer — but the
     window is narrow, so let the column breathe to the full width it's given. */
  body.cardwin #stage{padding-left:16px;padding-right:16px}

  /* ── THE WALK ────────────────────────────────────────────────────────────────────────────
     An alternative to the board, not a replacement (docs/2026-08-03-the-walk-design.md).
     The board superimposes five relations — grounds, within-paper support, the ladder,
     answers, stance — as strokes on one canvas; each has a different natural layout, so on a
     matured paper (57 cards / 88 edges for Hohmann2022Cellsa) none of them stays readable.
     The walk shows ONE relation at a time as an indented tree, so there is no edge layer at
     all and nothing can cross. Everything you are not walking is a count badge that pivots
     the walk when clicked. Same emitted JSON, same emergent colouring — a second view onto
     the identical graph, toggled from the HUD. */
  #walkPane{display:none}
  body.walk #board,body.walk #searchResults,body.walk #ctxmenu,
  body.walk #wipPanel,body.walk #aimPanel{display:none!important}
  body.walk #walkPane{display:flex;position:fixed;left:0;right:0;bottom:0;
    top:var(--hud-top);z-index:20;background:var(--bg);transition:top .18s ease}
  body.walk{overflow:hidden}
  /* the PDF dock keeps working in the walk — hovering a quote row aims it, exactly as a
     slice row does on the board — so the pane has to yield the same width the board does */
  body.walk.dock-open #walkPane{right:var(--dock-w)}

  #walkRail{flex:0 0 236px;overflow:auto;padding:12px 0 40px;border-right:1px solid var(--line);
    background:var(--panel)}
  #walkStage{flex:1;overflow:auto;padding:18px 26px 90px;position:relative}
  #walkRail .wr-hd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding:10px 14px 6px;margin-top:10px;border-top:1px solid var(--line)}
  #walkRail .wr-hd:first-child{margin-top:0;border-top:0;padding-top:0}
  #walkRail .wr-row{display:flex;align-items:center;gap:7px;padding:4px 14px;cursor:pointer;
    font-size:11px;border-left:2px solid transparent}
  #walkRail .wr-row:hover{background:#e9eef2}
  #walkRail .wr-row.on{background:rgba(76,195,138,.10);border-left-color:var(--grounded)}
  #walkRail .wr-row .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #walkRail .wr-row .n{margin-left:auto;font-size:9px;color:var(--faint);
    font-variant-numeric:tabular-nums}
  #walkRail .wr-row.hot .n{color:var(--cross)}
  #walkRail .wr-t{padding:3px 14px;font-size:10.5px;color:var(--dim);cursor:pointer;
    border-left:2px solid transparent}
  #walkRail .wr-t:hover{background:#e9eef2;color:var(--ink)}
  #walkRail .wr-t.on{background:rgba(122,92,255,.12);border-left-color:var(--broad)}
  #walkRail .wr-t .n{float:right;font-size:9px;color:var(--faint)}

  #walkCrumbs{font-size:10px;color:var(--faint);margin-bottom:10px;display:flex;gap:6px;
    flex-wrap:wrap;align-items:center;min-height:14px}
  #walkCrumbs a{color:var(--dim);cursor:pointer}
  #walkCrumbs a:hover{color:var(--grounded)}
  #walkCrumbs .sep{opacity:.5}

  .wk-focus{border:1.5px solid var(--line);border-left:3px solid var(--grounded);
    border-radius:12px;background:var(--panel);padding:13px 16px 14px;max-width:900px}
  .wk-focus.q{border-left-color:var(--question)}
  .wk-focus.b{border-left-color:var(--broad)}
  .wk-focus .fk{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .wk-focus .kind{font-size:7.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
  .wk-focus .key{font-size:12px;font-weight:700}
  .wk-focus .yr{font-size:9.5px;color:var(--faint);margin-left:auto;
    font-variant-numeric:tabular-nums}
  .wk-focus .ttl{font-size:11px;color:var(--dim);line-height:1.35}
  .wk-focus .txt{font-size:12px;color:var(--ink);line-height:1.45;margin-top:4px;max-width:70ch}
  .wk-focus .auth{font-size:9.5px;color:var(--faint);margin-top:6px}
  .wk-focus .quote{margin-top:9px;font-size:10.5px;color:var(--dim);
    border-left:2px solid var(--grounded);padding-left:9px;line-height:1.4;font-style:italic}

  #walkTabs{display:flex;gap:5px;margin:14px 0 4px;flex-wrap:wrap;align-items:center}
  .wk-tab{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);
    cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    background:var(--panel);transition:border-color .12s,color .12s,background .12s}
  .wk-tab:hover:not(.off){border-color:var(--faint);color:var(--ink)}
  .wk-tab.on{background:rgba(76,195,138,.12);border-color:var(--grounded)}
  .wk-tab.on.q{background:rgba(227,134,61,.12);border-color:var(--question)}
  .wk-tab.on.b{background:rgba(122,92,255,.12);border-color:var(--broad)}
  .wk-tab.on.x{background:rgba(255,123,114,.12);border-color:var(--cross)}
  .wk-tab.off{opacity:.32;cursor:default}
  .wk-tab .ct{font-size:9px;font-variant-numeric:tabular-nums;color:var(--faint);
    background:#eef2f5;border-radius:999px;padding:1px 5px;min-width:17px;
    text-align:center}
  .wk-note{font-size:9.5px;color:var(--faint);margin:0 0 12px;max-width:78ch;line-height:1.4}

  #walkTree{max-width:1100px}
  .wk-row{display:flex;align-items:flex-start;min-height:23px;border-radius:5px;
    padding:2px 6px 2px 0;cursor:pointer}
  .wk-row:hover{background:#e9eef2}
  .wk-g{flex:none;width:17px;align-self:stretch;position:relative}
  .wk-g.v::before{content:"";position:absolute;left:8px;top:0;bottom:0;
    border-left:1px solid rgba(0,0,0,.13)}
  .wk-g.e::before{content:"";position:absolute;left:8px;top:0;height:11px;
    border-left:1px solid rgba(0,0,0,.20)}
  .wk-g.e::after{content:"";position:absolute;left:8px;top:11px;width:7px;
    border-top:1px solid rgba(0,0,0,.20)}
  .wk-g.e.mid::before{bottom:0;height:auto}
  .wk-tw{flex:none;width:13px;font-size:9px;color:var(--faint);text-align:center;line-height:20px}
  .wk-row:hover .wk-tw{color:var(--ink)}
  .wk-lb{flex:1;min-width:0;font-size:11px;line-height:1.4;color:var(--ink);padding:2px 0}
  .wk-lb .k{color:var(--dim);font-weight:600}
  .wk-lb .yr{color:var(--faint);font-size:9.5px;font-variant-numeric:tabular-nums}
  .wk-lb .lad{color:var(--broad)}
  .wk-row.rep .wk-lb{color:var(--faint)}
  .wk-row.dimmed .wk-lb{color:var(--faint)}
  .wk-also{font-size:9px;color:var(--borrowed);margin-left:7px}
  .wk-q{font-size:10px;color:var(--dim);font-style:italic;line-height:1.4;
    border-left:2px solid rgba(76,195,138,.35);padding:1px 0 1px 9px;margin:1px 0 3px}
  .wk-q.aims{cursor:pointer}
  .wk-q.aims:hover{border-left-color:var(--grounded);color:var(--ink)}
  .wk-bg{flex:none;display:flex;gap:3px;margin:2px 0 0 10px;align-items:center}
  .wk-b{font-size:9px;font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,.14);
    border-radius:5px;padding:0 4px;color:var(--faint);background:#e9eef2;
    cursor:pointer;line-height:16px}
  .wk-b:hover{border-color:currentColor;background:#dde5eb}
  .wk-b.z{display:none}
  .wk-chip{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--faint);
    border:1px dashed var(--line);border-radius:7px;padding:2px 9px;margin:3px 0;cursor:pointer;
    background:#f3f6f8}
  .wk-chip:hover{color:var(--ink);border-color:var(--faint)}
  .wk-chip b{color:var(--dim);font-variant-numeric:tabular-nums}
  .wk-chiprow{display:flex;align-items:center;min-height:22px}
  .wk-flash{animation:wkfl 1.1s ease-out}
  @keyframes wkfl{0%{background:rgba(76,195,138,.28)}100%{background:transparent}}

  #walkLedger{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;max-width:1000px}
  #walkLedger .lhd{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
    padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
  #walkLedger .lhd.p{color:var(--grounded)}
  #walkLedger .lhd.m{color:var(--cross)}
  #walkLedger .lhd span{float:right;color:var(--faint);font-variant-numeric:tabular-nums}
  .wk-ent{border-left:2px solid transparent;padding:5px 0 6px 10px;margin-bottom:4px;
    cursor:pointer;border-radius:0 5px 5px 0}
  .wk-ent:hover{background:#e9eef2}
  .wk-ent.p{border-left-color:rgba(76,195,138,.45)}
  .wk-ent.m{border-left-color:rgba(255,123,114,.45)}
  .wk-ent .src{font-size:9.5px;color:var(--dim);font-weight:600}
  .wk-ent .src .yr{color:var(--faint);font-weight:400}
  .wk-ent .wild{font-size:8.5px;color:var(--borrowed);border:1px dashed rgba(88,166,255,.4);
    border-radius:4px;padding:0 4px;margin-left:4px;font-weight:400}
  .wk-ent .t{font-size:10.5px;color:var(--ink);line-height:1.38;margin-top:2px}
  .wk-ent .qt{font-size:9.5px;color:var(--dim);font-style:italic;line-height:1.35;
    margin-top:4px;border-left:2px solid rgba(0,0,0,.12);padding-left:8px}
  .wk-empty{font-size:10px;color:var(--faint);font-style:italic;padding:6px 0 0 10px}
  .wk-land{max-width:760px;color:var(--dim);font-size:12px;line-height:1.6}
  .wk-land h2{font-size:15px;color:var(--ink);margin:0 0 10px;font-weight:600}
  .wk-land .pt{margin:14px 0 0;padding-left:14px;border-left:2px solid var(--line)}
  .wk-land .pt b{color:var(--ink);font-weight:600}
  #walkBudget{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:10px;margin-left:auto}
  #walkBudget input{width:64px;accent-color:var(--grounded);cursor:pointer}
  #walkBudget .cost b{color:var(--grounded)}
  #walkBudget .cost .bad{color:var(--cross)}
  /* The roster. Containment is the one "relation" that must be COMPLETE rather than budgeted:
     a curator sifting a paper has to be able to account for every slice they wrote, including
     the ones no edge touches yet — which on a relation tab are, correctly, invisible. */
  #walkRoster{max-width:1000px}
  .rs-bar{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 15px}
  .rs-f{font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;cursor:pointer;background:var(--panel)}
  .rs-f:hover{border-color:var(--faint);color:var(--ink)}
  .rs-f.on{background:rgba(76,195,138,.12);border-color:var(--grounded);color:var(--ink)}
  .rs-f.w.on{background:rgba(227,134,61,.14);border-color:var(--question)}
  .rs-f b{font-variant-numeric:tabular-nums;color:var(--faint);margin-left:5px;font-weight:600}
  .rs-sec{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
    padding:0 0 5px;border-bottom:1px solid var(--line);margin:17px 0 8px}
  #walkRoster .rs-sec:first-child{margin-top:0}
  .rs-sec span{float:right;font-variant-numeric:tabular-nums}
  .wk-ent.rs{display:flex;align-items:flex-start;gap:9px;border-left-color:rgba(0,0,0,.10)}
  .wk-ent.rs .bd{flex:1;min-width:0}
  .wk-ent.rs.q{border-left-color:rgba(227,134,61,.45)}
  .wk-ent.rs.un{border-left-style:dashed;border-left-color:var(--question)}
  .wk-ent .qt.aims{cursor:pointer}
  .wk-ent .qt.aims:hover{border-left-color:var(--grounded);color:var(--ink)}
  .rs-tag{font-size:8.5px;border-radius:4px;padding:0 4px;margin-left:5px;font-weight:400}
  .rs-tag.un{color:var(--question);border:1px dashed rgba(227,134,61,.45)}
  .rs-tag.fl{color:var(--grounded);border:1px solid rgba(76,195,138,.40)}
  .rs-none{font-size:10px;color:var(--faint);font-style:italic;padding:8px 0 0}
  /* the cockpit's card window carries ONE paper, so the library rail has nothing to list; drop
     it and give the roster the whole (already narrow) window. Same for any narrow window. */
  body.cardwin #walkRail{display:none}
  @media (max-width:820px){
    #walkRail{display:none}
    #walkStage{padding:14px 15px 80px}
    #walkLedger{grid-template-columns:1fr;gap:0}
  }
  /* node badges the board has no equivalent for — a paper, a stub, a broad slice */
  .sid.pa{background:#4a6d8c}.sid.st{background:var(--faint)}.sid.br{background:var(--broad)}
</style>
</head>
<body>
<div id="hud">
  <b>litgraph</b>
  <input id="search" type="search" autocomplete="off" spellcheck="false"
         placeholder="find a paper — title, author, journal, tag…">

  <button id="walkBtn" class="libbtn" hidden title="one focus, one relation, no drawn edges (w)">walk</button>
  <span id="viewsWrap" hidden><button id="viewsBtn" class="libbtn"
       title="alternative renderings of the same graph">show graph ▾</button><div id="viewsMenu" hidden></div></span>

    <input type="range" min="0" max="1000" step="1" value="500">
    <span class="zval" title="back to 100% (0)">100%</span>
  </label>

    <input id="colw" type="range" min="220" max="720" step="4" value="500">
