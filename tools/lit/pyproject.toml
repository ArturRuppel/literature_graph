[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litgraph"
version = "0.1.0"
description = "Initialize literature_graph nodes from PDFs (DOI-anchored bibliographic ingest)"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=0.0.20",   # PDF -> deterministic Markdown (pulls pymupdf/fitz)
    "ruamel.yaml>=0.17",     # round-trip YAML (preserves stubs.yaml comments)
    "tomlkit>=0.12",         # round-trip TOML (preserves config.toml comments on `active` writes)
    "iso4>=0.0.2",           # ISO-4 journal abbreviation (needs nltk wordnet)
    "requests>=2.28",        # OpenAlex / Crossref HTTP
]

[project.scripts]
lit = "litgraph.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["litgraph*"]

[tool.setuptools.package-data]
# viewer/* does not recurse, so the css/ and js/ modules the build inlines need globs of
# their own — without them a wheel ships a shell with nothing to put in it.
litgraph = ["viewer/*", "viewer/css/*.css", "viewer/js/*.js", "curate_session.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
