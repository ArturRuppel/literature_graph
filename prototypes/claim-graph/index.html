<!doctype html>
<meta charset="utf-8">
<!-- Without the viewport meta a phone lays this page out at 980px and scales the result down,
     which makes the header unreadable and every tap target a third of its size. The doctype
     matters for the same reason: quirks mode is not a place to debug an SVG's coordinates. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim graph — support skeleton</title>
<link rel="stylesheet" href="style.css">
<div id="app">
  <header>
    <a class="backlink" id="back" href="../../" hidden>← board</a>
    <h1>Claim graph</h1>
    <div class="sub">the support skeleton — 822 slices + 45 broad nodes, layered by distance-to-floor</div>
    <div id="stats">loading…</div>
    <div id="controls">
      <label><input type="checkbox" id="tgl-up" checked> grounding (up)</label>
      <label><input type="checkbox" id="tgl-gen" checked> generalization (gen)</label>
      <label><input type="checkbox" id="tgl-cons" checked> → broad (cons)</label>
      <label><input type="checkbox" id="tgl-ladder" checked> broad ladder</label>
      <label><input type="checkbox" id="tgl-cite" checked> sharpened citation</label>
      <label><input type="checkbox" id="tgl-lateral" checked> corroborate / contradict</label>
      <button id="btn-reset">reset view</button>
    </div>
  </header>
  <div id="legend"></div>
  <main>
    <div class="axis-hint">← evidence / floors&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;synthesis / broad →</div>
    <div id="canvasWrap">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="zoombar">
      <button id="zoom-out">−</button>
      <button id="zoom-fit">⤢</button>
      <button id="zoom-in">+</button>
    </div>
    <div id="panel">
      <button class="p-close" id="panel-close">×</button>
      <div id="panel-body"></div>
    </div>
    <div id="tooltip"></div>
  </main>
</div>
<script src="app.js"></script>
